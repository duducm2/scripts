<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Memory Palace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/dashboard.css" />
    <style>
      /* Secondary app chrome — does not override Practice/Plans dashboard look */
      .app-more {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        padding: 0.55rem 1.5rem;
        border-bottom: 1px solid var(--line);
        background: rgba(18, 20, 26, 0.65);
      }
      .app-more button {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.35rem 0.7rem;
        font: inherit;
        font-size: 0.88rem;
        cursor: pointer;
      }
      .app-more button:hover,
      .app-more button.active {
        color: var(--gold);
        border-color: var(--gold);
      }
      #btnPractice {
        background: transparent;
        color: var(--gold);
        border: 1px solid var(--gold);
        border-radius: 6px;
        padding: 0.5rem 0.9rem;
        font-size: 0.95rem;
        font-weight: 650;
        cursor: pointer;
        height: 2.35rem;
      }
      #btnPractice:hover,
      #btnPractice.active {
        background: var(--gold);
        color: #1a1408;
      }
      #appExtra {
        padding: 1.25rem 1.5rem 2.5rem;
      }
      #appExtra.hidden {
        display: none !important;
      }
      .spa-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.85rem 1rem;
        margin-bottom: 0.85rem;
      }
      .spa-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.65rem;
      }
      .spa-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      .spa-table th,
      .spa-table td {
        text-align: left;
        padding: 0.45rem 0.4rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .spa-table th {
        color: var(--muted);
      }
      .spa-table tr:hover td {
        background: #242830;
      }
      .spa-btn {
        background: #242830;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 0.35rem 0.65rem;
        font: inherit;
        cursor: pointer;
      }
      .spa-btn:hover {
        border-color: var(--gold);
        color: var(--gold);
      }
      .spa-btn.danger:hover {
        border-color: #e07070;
        color: #e07070;
      }
      .crumb {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 0.65rem;
      }
      .crumb b {
        color: var(--gold);
      }
      #toast {
        position: fixed;
        bottom: 1.1rem;
        right: 1.1rem;
        background: #252830;
        border: 1px solid var(--gold);
        padding: 0.65rem 0.9rem;
        border-radius: 8px;
        display: none;
        z-index: 3000;
        max-width: 380px;
        color: var(--text);
      }
      #methodPanel {
        padding: 1rem 1.5rem 2.5rem;
      }
      #methodPanel .method-fallback {
        white-space: pre-wrap;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.88rem;
      }
      kbd {
        font: inherit;
        font-size: 0.78rem;
        color: var(--gold);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 0.3rem;
        background: #1a1e28;
      }

      /* Palace overlay: large snapshot on top + beast row below */
      #overlay.open {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #08090c;
      }
      #overlay .overlay-body {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        gap: 0;
        padding: 0;
        overflow: auto;
      }
      #overlay .overlay-stage {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        box-sizing: border-box;
        height: auto;
        min-height: 0;
        max-height: none;
        padding: 0.55rem 0.75rem 0.65rem;
        overflow: visible;
        flex: 0 0 auto;
      }
      #overlay .overlay-image {
        flex: 0 0 auto;
        width: 100%;
        max-width: none;
        height: auto;
        max-height: 38vh;
        min-height: 0;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #07080b;
        cursor: zoom-in;
        overflow: hidden;
      }
      #overlay .overlay-image:empty {
        display: none;
      }
      #overlay .overlay-image img {
        width: 100%;
        height: auto;
        max-height: 38vh;
        object-fit: contain;
        object-position: center center;
        display: block;
      }
      #overlay .overlay-image .missing-lg {
        padding: 1.25rem;
        font-size: 0.9rem;
      }
      #overlay .overlay-atoms {
        flex: 0 0 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: visible;
        padding: 0;
      }
      #overlay .overlay-atoms > h3 {
        display: none;
      }
      #overlay:not(.image-expanded) #ovAtoms {
        flex: 0 0 auto;
        display: grid !important;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important;
        grid-auto-rows: auto !important;
        gap: 0.5rem !important;
        width: 100%;
        align-content: start;
        overflow: visible;
      }
      #overlay:not(.image-expanded) #ovAtoms[data-beast-count="1"] {
        grid-template-columns: minmax(0, 1fr) !important;
      }
      #overlay:not(.image-expanded) #ovAtoms[data-beast-count="2"] {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
      #overlay:not(.image-expanded) #ovAtoms[data-beast-count="3"] {
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      }
      #overlay:not(.image-expanded) #ovAtoms[data-beast-count="4"] {
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      }
      #overlay:not(.image-expanded) #ovAtoms[data-beast-count="5"] {
        grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
      }
      #overlay:not(.image-expanded) #ovAtoms > .beast-cluster {
        grid-column: auto !important;
        grid-row: auto !important;
        height: auto !important;
        min-height: 0;
        overflow: visible !important;
        gap: 0.35rem;
        padding: 0.45rem 0.55rem 0.5rem;
        border-radius: 8px;
      }
      #overlay:not(.image-expanded) .beast-cluster-head {
        padding-bottom: 0.25rem;
      }
      #overlay:not(.image-expanded) .beast-cluster-head .lbl {
        font-size: 0.62rem;
      }
      #overlay:not(.image-expanded) .beast-cluster-head .beast-name {
        font-size: 0.9rem;
        line-height: 1.25;
      }
      #overlay:not(.image-expanded) .beast-cluster-head .sensory-chip {
        font-size: 0.72rem;
        max-width: min(12rem, 48%);
        white-space: normal;
      }
      #overlay:not(.image-expanded) .beast-cluster-atoms {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 0.4rem !important;
        overflow: visible !important;
        min-height: 0;
      }
      #overlay:not(.image-expanded) .atom-card {
        padding: 0.45rem 0.55rem;
        border-radius: 6px;
        overflow: visible !important;
        height: auto !important;
        display: block;
        min-height: 0;
      }
      #overlay:not(.image-expanded) .atom-card .atom-card-head {
        margin: 0 0 0.25rem;
        padding-bottom: 0.2rem;
      }
      #overlay:not(.image-expanded) .atom-card .field {
        margin: 0.3rem 0 0;
        font-size: 0.8rem;
        line-height: 1.35;
        max-height: none !important;
        overflow: visible !important;
      }
      #overlay:not(.image-expanded) .atom-card .lbl {
        font-size: 0.62rem;
        margin-bottom: 0.05rem;
      }
      /* Concept-first: hide Quote/Story until Details (D) */
      #overlay:not(.show-atom-details) .atom-card .field-quote,
      #overlay:not(.show-atom-details) .atom-card .field-story {
        display: none !important;
      }
      #overlay:not(.image-expanded) .atom-card .field-concept {
        margin-top: 0.3rem;
        padding: 0.35rem 0.45rem;
        border-radius: 5px;
        max-height: none !important;
        overflow: visible !important;
      }
      #overlay .atom-card .field-keywords {
        margin-top: 0.25rem;
      }
      #overlay .atom-card .kw-list {
        display: flex;
        flex-direction: column;
        gap: 0.12rem;
        font-size: 0.85em;
        line-height: 1.35;
      }
      #overlay .atom-card .kw-pair {
        display: block;
      }
      #overlay .overlay-details {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1rem 1.1rem 2rem;
        border-top: 1px solid var(--line);
        background: #101218;
      }
      @media (min-width: 1100px) {
        #overlay .overlay-details {
          grid-template-columns: 1.1fr 1fr;
        }
        #overlay .overlay-gallery {
          grid-column: 1 / -1;
        }
      }
      #overlay.image-expanded .overlay-stage {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 3.6rem);
        min-height: calc(100vh - 3.6rem);
        max-height: calc(100vh - 3.6rem);
      }
      #overlay.image-expanded .overlay-atoms,
      #overlay.image-expanded .overlay-details {
        display: none !important;
      }
      #overlay.image-expanded .overlay-image {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        max-height: none;
        min-height: 0;
        border: none;
        border-radius: 0;
        cursor: zoom-out;
      }
      #overlay.image-expanded .overlay-image img {
        width: 100%;
        height: 100%;
        max-height: none;
        object-fit: contain;
      }
      @media (max-width: 900px) {
        #overlay .overlay-stage {
          height: auto;
          min-height: auto;
          max-height: none;
          overflow: auto;
        }
        #overlay .overlay-image {
          height: 32vh;
          max-height: 32vh;
          min-height: 140px;
        }
        #overlay:not(.image-expanded) #ovAtoms,
        #overlay:not(.image-expanded) #ovAtoms[data-beast-count="4"],
        #overlay:not(.image-expanded) #ovAtoms[data-beast-count="5"] {
          grid-template-columns: 1fr !important;
        }
        #overlay .overlay-atoms > h3 {
          display: block;
          margin: 0 0 0.4rem;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Memory Palace</h1>
        <p class="sub" id="stats">Loading…</p>
      </div>
      <div class="controls">
        <div>
          <label for="study">Study</label>
          <select id="study"></select>
        </div>
        <button type="button" id="btnLatest" title="Latest palace (L)">
          Latest palace
        </button>
        <button
          type="button"
          id="btnPractice"
          class="active"
          title="Practice (Esc)"
        >
          Practice
        </button>
        <button type="button" id="btnPlans" title="Toggle plans (P)">
          Plans
        </button>
        <button type="button" id="btnMethod" title="Method docs (M)">
          Method
        </button>
        <div>
          <label for="atomSearch">Search Knowledge Atoms</label>
          <input
            type="search"
            id="atomSearch"
            placeholder="Beast, concept, keywords, quote, story…"
            autocomplete="off"
          />
        </div>
      </div>
    </header>
    <div id="searchResults" aria-live="polite"></div>
    <div class="app-more" id="appMore">
      <button type="button" data-view="browse">Browse</button>
      <button type="button" data-view="links">Links</button>
      <button type="button" data-view="help">Help</button>
    </div>

    <main id="practicePanel"></main>

    <div id="plansPanel" class="hidden" aria-hidden="true">
      <div class="plans-layout" id="plansLayout">
        <nav class="plans-toc" id="plansToc" aria-label="Plan sections">
          <div class="plans-toc-head">
            <h2>Sections</h2>
            <button
              type="button"
              id="btnPlansTocToggle"
              class="btn-plans-toc-toggle"
              title="Collapse sections"
              aria-expanded="true"
              aria-controls="plansTocList"
            >
              ◀
            </button>
          </div>
          <ul id="plansTocList"></ul>
        </nav>
        <div class="plans-main">
          <div class="plans-header">
            <div>
              <h2 id="plansTitle">Study Plan</h2>
              <p class="plans-sub" id="plansSub"></p>
            </div>
            <div class="plans-header-actions">
              <a
                id="plansGithub"
                class="plans-github"
                href="#"
                target="_blank"
                rel="noopener"
                >Plans on GitHub</a
              >
              <button type="button" id="btnPlansSave" class="btn-plans-save">
                Save
              </button>
              <button type="button" id="btnPlansReset" class="btn-plans-reset">
                Reset to file
              </button>
            </div>
          </div>
          <p
            class="plans-save-status"
            id="plansSaveStatus"
            aria-live="polite"
          ></p>
          <div class="plans-progress-wrap">
            <div
              class="plans-progress-bar"
              id="plansProgressBar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            ></div>
            <span class="plans-progress-label" id="plansProgressLabel"
              >0 / 0 complete</span
            >
          </div>
          <div id="plansContent" class="plans-content"></div>
          <p class="plans-empty hidden" id="plansEmpty">
            No study plan for this topic.
          </p>
        </div>
      </div>
    </div>

    <div id="methodPanel" class="hidden" aria-hidden="true">
      <div id="methodMount"><p class="muted">Loading method…</p></div>
    </div>

    <div id="appExtra" class="hidden" aria-hidden="true"></div>

    <div id="overlay" aria-hidden="true">
      <div class="overlay-bar">
        <div>
          <h2 id="ovTitle">Memory Palace</h2>
          <p class="count" id="ovCount"></p>
        </div>
        <div class="overlay-nav">
          <button type="button" id="btnPrevPalace" title="Older palace (←)">
            ← Older
          </button>
          <span class="nav-pos" id="ovNavPos"></span>
          <button type="button" id="btnNextPalace" title="Newer palace (→)">
            Newer →
          </button>
          <button
            type="button"
            id="btnExpandImage"
            title="Toggle full-screen image (F)"
          >
            Full image (F)
          </button>
          <button
            type="button"
            id="btnToggleAtomDetails"
            title="Show or hide Quote &amp; Story (D)"
          >
            Details (D)
          </button>
          <button
            type="button"
            id="btnCopyPrompt"
            title="Copy image prompt (C)"
            disabled
          >
            Copy prompt
          </button>
          <button
            type="button"
            id="btnChangeImage"
            title="Replace palace scene image (Desktop PNG/JPG or file picker)"
          >
            Change image
          </button>
          <button type="button" id="btnClose">Close</button>
        </div>
      </div>
      <div class="overlay-body">
        <div class="overlay-stage">
          <div
            class="overlay-image"
            id="ovImage"
            title="Press F for full-screen"
          ></div>
          <div class="practice overlay-atoms">
            <h3>Practice — Knowledge Atoms</h3>
            <div id="ovAtoms"></div>
          </div>
        </div>
        <div class="overlay-details">
          <div class="overlay-prompt" id="ovPrompt"></div>
          <div class="overlay-notes" id="ovNotes">
            <h3>Notes</h3>
            <textarea
              id="ovNotesInput"
              placeholder="Palace notes for recall, links, reminders…"
            ></textarea>
            <div class="notes-toolbar">
              <button type="button" class="btn-notes-save" id="btnNotesSave">
                Save notes
              </button>
              <span class="notes-status" id="ovNotesStatus"></span>
            </div>
          </div>
          <div class="overlay-gallery" id="ovGallery">
            <h3>Gallery</h3>
            <div class="gallery-toolbar">
              <button type="button" class="btn-gallery" id="btnGalleryAdd">
                Add image
              </button>
              <span class="gallery-status" id="ovGalleryStatus"></span>
            </div>
            <input type="file" id="galleryFileInput" accept="image/*" />
            <input
              type="file"
              id="palaceHeroFileInput"
              accept="image/*"
              hidden
            />
            <div class="gallery-grid" id="ovGalleryGrid"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <div
      id="studyModal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="studyModalTitle"
    >
      <div class="modal-panel">
        <h2 id="studyModalTitle">Select a study</h2>
        <p class="hint" id="studyModalHint"></p>
        <ul class="pick-list" id="studyModalList"></ul>
        <p class="modal-foot" id="studyModalFoot"></p>
      </div>
    </div>

    <script>
      const LAST_STUDY_KEY = "palace_last_study_id";
      const PALACE_SPA_FULL_REFRESH = false;
      const state = {
        data: null,
        _practiceIndex: null,
        view: "practice",
        studyId: "",
        browse: { studyId: "", palaceId: "", beastId: "" },
        overlayPalaceId: "",
        pendingHeroPalaceId: "",
        notesTimer: null,
        planCheckSnapshot: null,
        studyPickerPending: true,
        methodLoaded: false,
        methodCanon: null,
        mermaidLoading: false,
        studyLinks: { video: "", article: "", favorite: "" },
      };

      function invalidateDataIndex() {
        state._practiceIndex = null;
      }

      function buildPracticeIndex() {
        const beastsByPalace = new Map();
        const atomsByBeast = new Map();
        for (const b of state.data?.beasts || []) {
          const pid = b.palace_id;
          if (!beastsByPalace.has(pid)) beastsByPalace.set(pid, []);
          beastsByPalace.get(pid).push(b);
        }
        for (const a of state.data?.atoms || []) {
          const bid = a.beast_id;
          if (!atomsByBeast.has(bid)) atomsByBeast.set(bid, []);
          atomsByBeast.get(bid).push(a);
        }
        for (const arr of beastsByPalace.values()) {
          arr.sort(
            (x, y) => Number(x.sort_order || 0) - Number(y.sort_order || 0),
          );
        }
        for (const arr of atomsByBeast.values()) {
          arr.sort(
            (x, y) => Number(x.sort_order || 0) - Number(y.sort_order || 0),
          );
        }
        state._practiceIndex = { beastsByPalace, atomsByBeast };
      }

      function practiceIndex() {
        if (!state._practiceIndex) buildPracticeIndex();
        return state._practiceIndex;
      }

      function updateStatsHeader() {
        if (!state.data) return;
        document.getElementById("stats").textContent =
          `${state.data.studies.length} studies · ${state.data.palaces.length} Memory Palaces · ` +
          `${state.data.beasts.length} beasts · ${state.data.atoms.length} Knowledge Atoms`;
      }

      function mergeApiRow(entityKey, row, { removeId } = {}) {
        if (!state.data || !entityKey) return;
        invalidateDataIndex();
        const list = state.data[entityKey];
        if (!Array.isArray(list)) return;
        if (removeId) {
          state.data[entityKey] = list.filter((r) => r.id !== removeId);
          updateStatsHeader();
          return;
        }
        if (!row?.id) return;
        const i = list.findIndex((r) => r.id === row.id);
        const copy = { ...row };
        if (i >= 0) list[i] = copy;
        else list.push(copy);
        updateStatsHeader();
      }

      function afterEntitySave(entityKey, r) {
        if (PALACE_SPA_FULL_REFRESH) {
          refresh().catch((e) => toast(String(e.message || e)));
          return;
        }
        if (r?.row) mergeApiRow(entityKey, r.row);
        else updateStatsHeader();
        render();
      }

      async function api(path, opts = {}) {
        const res = await fetch(path, {
          headers: {
            "Content-Type": "application/json",
            ...(opts.headers || {}),
          },
          ...opts,
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          throw new Error(text.slice(0, 200));
        }
        if (!res.ok && json && json.ok === false)
          throw new Error(json.error || res.statusText);
        return json;
      }

      function toast(msg, ms = 2200) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.display = "block";
        clearTimeout(toast._t);
        toast._t = setTimeout(() => (el.style.display = "none"), ms);
      }

      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function escAttr(s) {
        return esc(s).replace(/\n/g, " ");
      }
      function dash(s) {
        const t = String(s ?? "").trim();
        return t ? esc(t) : "—";
      }

      function mediaUrl(rel) {
        if (!rel) return "";
        const n = String(rel).replace(/\\/g, "/");
        if (n.startsWith("http") || n.startsWith("file:")) return n;
        if (n.startsWith("practice/")) return "/media/" + n;
        return "/media/" + n;
      }

      function studies() {
        return (state.data?.studies || [])
          .filter((s) => s.active !== "0")
          .slice()
          .sort(
            (a, b) =>
              Number(a.sort_order || 999) - Number(b.sort_order || 999) ||
              String(a.title || "").localeCompare(String(b.title || "")),
          );
      }
      function palaces(sid) {
        return (state.data?.palaces || [])
          .filter((p) => !sid || p.study_id === sid)
          .sort(
            (a, b) =>
              Number(b.palace_number || 0) - Number(a.palace_number || 0),
          );
      }
      function beasts(pid) {
        const idx = practiceIndex().beastsByPalace.get(pid);
        return idx ? idx.slice() : [];
      }
      function atoms(bid) {
        const idx = practiceIndex().atomsByBeast.get(bid);
        return idx ? idx.slice() : [];
      }
      function gallery(pid) {
        return (state.data?.palace_images || [])
          .filter((g) => g.palace_id === pid)
          .sort(
            (a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0),
          );
      }
      function studyById(id) {
        return studies().find((s) => s.id === id);

        const sel = document.getElementById("study");
        const list = studies();
        let prefer = "";

        } catch {
          prefer = "";

          if (prefer && list.some((s) => s.id === prefer))

          .map(

              `<option value="${escAttr(s.id)}" ${s.id === state.studyId ? "selected" : ""}>${esc(s.title)}</option>`,
          )
          .join("");

      function rememberStudy(id) {
        if (!id) return;
        state.studyId = id;
        try {
          localStorage.setItem(LAST_STUDY_KEY, id);
        } catch {
          /* ignore */
        }
        const sel = document.getElementById("study");
        if (sel && sel.value !== id) sel.value = id;

      function openLatestPalace() {
        const list = palaces(state.studyId);

      function closeStudyModal({ focusLatest = true } = {}) {
        const modal = document.getElementById("studyModal");
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        if (focusLatest) {
          requestAnimationFrame(() =>

      function studyShortcut(idx) {
        if (idx < 0 || idx >= studies().length || idx > 25) return null;
        return String.fromCharCode(97 + idx);
      }

      function renderStudyModal() {
        const list = studies();
        document.getElementById("studyModalTitle").textContent =
          "Select a study";
        document.getElementById("studyModalHint").textContent =
          "Press a letter to choose a study (1–9 also work for the first nine). Arrow keys + Enter to move and select.";
        document.getElementById("studyModalFoot").textContent =
          "Esc keeps the current study";
        const ul = document.getElementById("studyModalList");
        ul.innerHTML = "";
        list.forEach((st, idx) => {
          const letter = studyShortcut(idx);
          if (!letter) return;
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.studyId = st.id;
          const numHint =
            idx < 9
              ? ` <span style="color:var(--muted)">(${idx + 1})</span>`
              : "";
          btn.innerHTML =
            `<span class="key">${esc(letter.toUpperCase())}</span>` +
            `<span class="pick-label">${esc(st.title)}${numHint}</span>`;
          btn.addEventListener("click", () => pickStudyItem(st.id));
          li.appendChild(btn);
          ul.appendChild(li);
        });

        if (firstBtn) requestAnimationFrame(() => firstBtn.focus());

      function handleStudyModalKey(e) {
        if (!studyModalIsOpen()) return false;
        if (e.key === "Escape") {
          e.preventDefault();
          closeStudyModal({ focusLatest: true });
          return true;
        }
        const buttons = [
          ...document.querySelectorAll("#studyModalList button"),
        ];
        if (!buttons.length) return true;
        const focused = document.activeElement;
        const focusIdx = buttons.indexOf(focused);
        if (e.key === "ArrowDown" || e.key === "ArrowRight") {
          e.preventDefault();
          const next =
            focusIdx < 0 ? 0 : Math.min(buttons.length - 1, focusIdx + 1);
          buttons[next].focus();
          return true;
        }
        if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
          e.preventDefault();
          const prev = focusIdx < 0 ? 0 : Math.max(0, focusIdx - 1);
          buttons[prev].focus();
          return true;
        }
        if (e.key === "Enter" || e.key === " ") {
          if (focusIdx >= 0) {
            e.preventDefault();
            pickStudyItem(buttons[focusIdx].dataset.studyId);
            return true;
          }
        }
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const ch = e.key.toLowerCase();
          let idx = -1;
          if (ch >= "a" && ch <= "z") idx = ch.charCodeAt(0) - 97;
          else if (ch >= "1" && ch <= "9") idx = parseInt(ch, 10) - 1;
          const list = studies();
          if (idx >= 0 && idx < list.length) {
            e.preventDefault();
            pickStudyItem(list[idx].id);
            return true;
          }
        }
        return true;
      }

          .getElementById("btnPlans")
          .classList.toggle("active", state.view === "plans");

      function showPanel(name) {
        const panels = {
          practice: document.getElementById("practicePanel"),
          plans: document.getElementById("plansPanel"),
          method: document.getElementById("methodPanel"),
          extra: document.getElementById("appExtra"),
        };
        Object.entries(panels).forEach(([k, el]) => {
          const on =
            (name === "practice" && k === "practice") ||
            (name === "plans" && k === "plans") ||
            (name === "method" && k === "method") ||
            (["browse", "links", "help"].includes(name) && k === "extra");
          el.classList.toggle("hidden", !on);
          el.setAttribute("aria-hidden", on ? "false" : "true");

      /* ---------- Practice (dashboard aesthetic) ---------- */
      function renderPromptBlock(prompt, id) {
        const t = (prompt || "").toString().trim();
        if (!t) return '<p class="prompt-empty">No image prompt saved.</p>';
        return (
          '<div class="prompt-block"><div class="prompt-head"><span>Image prompt</span>' +
          `<button type="button" class="btn-copy" data-copy-id="${escAttr(id)}">Copy prompt</button></div>` +
          `<pre class="prompt-text">${esc(prompt)}</pre></div>`

      function renderPractice() {
        const sid = state.studyId;
        const st = studyById(sid);
        const list = palaces(sid);
        const root = document.getElementById("practicePanel");
        let grid = list
          .map((p) => {
            const nb = beasts(p.id).length;
            const na = beasts(p.id).reduce((n, b) => n + atoms(b.id).length, 0);
            const src = mediaUrl(p.image_rel_path);
            const img = src
              ? `<img src="${escAttr(src)}" alt="Memory Palace ${escAttr(p.palace_number)}" loading="lazy"/>`
              : `<div class="missing">No image</div>`;

            ${img}
            <div class="meta">

              <p class="char">${esc(p.character_name || "")}</p>
              <p class="counts">${nb} beasts · ${na} Knowledge Atoms</p>
              ${renderPromptBlock(p.image_prompt, p.id)}
            </div>
          </article>`;
          })
          .join("");
        if (!grid)
          grid = `<p class="empty">No Memory Palaces in this study.</p>`;
        root.innerHTML = `
          <section class="study">
            <header class="study-head">
              <h2>${esc(st?.title || sid || "Study")}</h2>
              <p>${list.length} Memory Palace${list.length === 1 ? "" : "s"} · newest first</p>
            </header>
            <div class="grid">${grid}</div>
          </section>`;
        root.querySelectorAll(".palace").forEach((el) => {
          const open = () => openPalace(el.dataset.palaceId);
          el.onclick = open;
          el.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();

      async function copyPrompt(text, btn) {
        try {
          await navigator.clipboard.writeText(text || "");
          if (btn) {
            const o = btn.textContent;
            btn.textContent = "Copied";
            setTimeout(() => (btn.textContent = o), 1200);
          } else toast("Prompt copied");
        } catch {
          toast("Copy failed");
        }
      }

      function formatSensory(s) {
        const t = String(s || "").trim();
        return t ? esc(t) : "—";
      }
      function formatConcept(c) {
        const t = String(c || "").trim();
        return t
          ? `<span class="emoji" aria-hidden="true">💡</span> ${esc(t)}`
          : "—";
      }
      function formatQuote(q) {
        const t = String(q || "").trim();
        return t ? esc(t) : "—";
      }

      function sensoryChipHtml(sensory) {
        return (
          '<p class="sensory-chip"><span class="lbl">Sensory</span>' +
          formatSensory(sensory) +
          "</p>"
        );
      }

      function renderAtomCard(a, sensoryOnCard = true) {
        const zone =
          a.zone || a.zone_label
            ? `<p class="zone-tag"><span class="emoji" aria-hidden="true">🟦</span> ${dash(a.zone)}${a.zone_label ? " · " + dash(a.zone_label) : ""}</p>`
            : "";
        const sensory = sensoryOnCard
          ? sensoryChipHtml(a.sensory_channel || a.sensory)
          : "";
        const head =
          zone || sensory
            ? `<div class="atom-card-head">${zone}${sensory}</div>`
            : "";
        return `<article class="atom-card" data-atom-id="${escAttr(a.id)}">${head}
          <p class="field field-concept"><span class="lbl">Concept</span>${formatConcept(a.concept)}</p>
          ${formatKeywords(a.keywords)}
          <p class="field field-quote"><span class="lbl">Quote</span>${formatQuote(a.quote)}</p>
          <p class="field field-story"><span class="lbl">Story</span>${dash(a.story)}</p>
        </article>`;
      }

      function formatKeywords(raw) {
        const text = String(raw || "").trim();
        if (!text) return "";
        const pairs = text
          .split(/\s*\|\|\s*/)
          .map((p) => p.trim())
          .filter(Boolean)
          .slice(0, 10);
        if (!pairs.length) return "";
        const rows = pairs
          .map((p) => {
            const m = p.includes(" | ")
              ? p.split(/\s*\|\s*/, 2)
              : p.split("|", 2);
            const left = (m[0] || "").trim();
            const right = (m[1] || "").trim();
            if (!left || !right) return "";
            return `<span class="kw-pair">${esc(left)} | ${esc(right)}</span>`;
          })
          .filter(Boolean)
          .join("");
        if (!rows) return "";
        return `<div class="field field-keywords"><span class="lbl">Keywords</span><div class="kw-list">${rows}</div></div>`;
      }

      function orderBeastsForCockpit(blist) {
        return blist;
      }

      function renderPalaceAtoms(palaceId) {
        const blist = orderBeastsForCockpit(beasts(palaceId));
        const mount = document.getElementById("ovAtoms");
        if (mount) mount.dataset.beastCount = String(blist.length);
        if (!blist.length) {
          if (mount) delete mount.dataset.beastCount;
          return '<p class="empty">No Knowledge Atoms on this Memory Palace.</p>';
        }
        return blist
          .map((b) => {
            const ats = atoms(b.id);
            const n = Math.max(ats.length, 1);
            const innerCols = Math.min(n, 3);
            const sensoryOnBeast = ats.length === 1;
            const headSensory = sensoryOnBeast
              ? sensoryChipHtml(ats[0].sensory_channel || b.sensory_channel)
              : sensoryChipHtml(b.sensory_channel);
            const cards =
              ats.map((a) => renderAtomCard(a, !sensoryOnBeast)).join("") ||
              '<p class="empty">No atoms</p>';
            return `<section class="beast-cluster" style="--beast-cols: ${innerCols}">
            <header class="beast-cluster-head">
              <span class="lbl">Beast</span>
              <div class="beast-head-row">
                <p class="beast-name"><span class="emoji" aria-hidden="true">🟧</span> ${dash(b.beast_name || b.peg_code)}</p>
                ${headSensory}
              </div>
            </header>
            <div class="beast-cluster-atoms">${cards}</div>
          </section>`;
          })
          .join("");
      }

      function openPalace(id) {
        const p = palaceById(id);
        if (!p) return;
        state.overlayPalaceId = id;
        const list = palaces(p.study_id);
        const idx = list.findIndex((x) => x.id === id);
        const overlay = document.getElementById("overlay");
        document.getElementById("ovTitle").textContent =
          `Memory Palace ${p.palace_number}: ${p.title}`;
        const nAtoms = beasts(id).reduce((n, b) => n + atoms(b.id).length, 0);
        document.getElementById("ovCount").textContent =
          `${nAtoms} Knowledge Atom${nAtoms === 1 ? "" : "s"}` +
          (p.character_name ? ` · Character: ${p.character_name}` : "");
        const src = mediaUrl(p.image_rel_path);
        document.getElementById("ovImage").innerHTML = src
          ? `<img src="${escAttr(src)}" alt="Memory Palace ${escAttr(p.palace_number)}"/>`
          : `<div class="missing-lg">No image</div>`;
        document.getElementById("ovPrompt").innerHTML = renderPromptBlock(
          p.image_prompt,
          p.id,
        );
        document
          .getElementById("ovPrompt")
          .querySelectorAll(".btn-copy")
          .forEach((btn) => {
            btn.onclick = () => copyPrompt(p.image_prompt, btn);
          });
        const btnCopy = document.getElementById("btnCopyPrompt");
        const hasPrompt = !!(p.image_prompt || "").trim();
        btnCopy.disabled = !hasPrompt;
        btnCopy.onclick = () => copyPrompt(p.image_prompt, btnCopy);
        document.getElementById("ovAtoms").innerHTML = renderPalaceAtoms(id);
        const ovAtoms = document.getElementById("ovAtoms");
        const beastN = ovAtoms.querySelectorAll(
          ":scope > .beast-cluster",
        ).length;
        if (beastN) {
          ovAtoms.dataset.beastCount = String(beastN);
          overlay.dataset.beastCount = String(beastN);
        } else {
          delete ovAtoms.dataset.beastCount;
          delete overlay.dataset.beastCount;
        }
        document.getElementById("ovNotesInput").value = p.palace_notes || "";
        setNotesStatus("", "");
        renderGalleryGrid(id);
        document.getElementById("btnPrevPalace").disabled = idx <= 0;
        document.getElementById("btnNextPalace").disabled =
          idx < 0 || idx >= list.length - 1;
        document.getElementById("ovNavPos").textContent = list.length
          ? `${idx + 1} / ${list.length}`
          : "";
        document.getElementById("btnPrevPalace").onclick = () => {
          if (idx > 0) openPalace(list[idx - 1].id);
        };
        document.getElementById("btnNextPalace").onclick = () => {
          if (idx < list.length - 1) openPalace(list[idx + 1].id);
        };
        overlay.classList.add("open");
        overlay.classList.remove("image-expanded");
        overlay.classList.remove("show-atom-details");
        syncExpandImageButton();
        syncAtomDetailsButton();
        overlay.setAttribute("aria-hidden", "false");
        const imgPane = document.getElementById("ovImage");
        imgPane.onclick = () => toggleOverlayImageExpand();
      }

      async function saveNotes() {
        const pid = state.overlayPalaceId;
        if (!pid) return;
        const notes = document.getElementById("ovNotesInput").value;
        setNotesStatus("Saving…", "");
        try {
          const r = await api("/api/palace/notes", {
            method: "POST",
            body: JSON.stringify({ palace_id: pid, notes }),
          });
          if (!r.ok) throw new Error(r.error || "fail");
          setNotesStatus("Saved", "ok");
          const p = palaceById(pid);
          if (p) p.palace_notes = notes;
        } catch (e) {
          setNotesStatus(String(e.message || e), "err");

      async function changePalaceImage(palaceId) {
        if (!palaceId) return;
        try {
          const r = await api("/api/quick-image", {
            method: "POST",
            body: JSON.stringify({ palace_id: palaceId }),
          });

      function updatePlansProgressFromPlan(plan) {
        const todos = plan?.todos || [];
        const total = todos.length;
        const done = todos.filter((t) => {
          const box = document.getElementById(t.id);
          if (box) return box.checked;
          return !!t.checked;
        }).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        const bar = document.getElementById("plansProgressBar");
        bar.style.setProperty("--pct", pct + "%");
        bar.setAttribute("aria-valuenow", String(pct));
        document.getElementById("plansProgressLabel").textContent =
          `${done} / ${total} complete`;
      }

            '<path d="M10 9.5v5l5-2.5-5-2.5z" fill="#fff"/>' +
            "</svg></span>"

          { book: "📖", docs: "📄", article: "📝", search: "🔍", link: "🔗" }[
            kind

        return `<span class="plan-source-icon" aria-hidden="true">${emoji}</span>`;

          .trim();

      function renderPlanSources(section) {
        const resources = section.resources || [];
        const sectionPath = section.section_path || "";
        const hasTodos = (section.todos || []).length > 0;
        const hasChildren = (section.children || []).length > 0;
        const hasResources = resources.length > 0;
        if (!sectionPath || !(hasTodos || hasResources || hasChildren))
          return "";
        let html = `<div class="plan-sources plan-sources-footer" data-section-path="${escAttr(sectionPath)}">`;
        html += '<div class="plan-sources-label">Sources</div>';
        if (!hasResources) {
          html += '<span class="plan-source-empty">No sources</span>';
        } else {
          resources.forEach((r) => {
            const kind = r.kind || r.icon || "link";
            const title = r.title || r.url || "Link";
            const url = r.url || "";
            const rid = r.id || "";
            html += '<span class="plan-source-chip">';
            if (url) {
              html +=
                `<a class="plan-source-link" href="${escAttr(url)}" target="_blank" rel="noopener">` +
                resourceIcon(kind) +
                `<span class="plan-source-title">${esc(title)}</span></a>`;
            } else {
              html +=
                `<span class="plan-source-link">${resourceIcon(kind)}` +
                `<span class="plan-source-title">${esc(title)}</span></span>`;
            }
            html +=
              '<span class="plan-source-actions">' +
              `<button type="button" class="plan-source-edit" data-resource-id="${escAttr(rid)}"` +
              ` data-resource-title="${escAttr(title)}" data-resource-url="${escAttr(url)}"` +
              ' title="Edit source" aria-label="Edit source">✎</button>' +
              `<button type="button" class="plan-source-remove" data-resource-id="${escAttr(rid)}"` +
              ' title="Remove source" aria-label="Remove source">×</button>' +
              "</span></span>";
          });
        }
        html += ` <button type="button" class="plan-source-add" data-section-path="${escAttr(sectionPath)}">+ add source</button>`;
        html +=
          `<div class="plan-source-form hidden" data-form-section="${escAttr(sectionPath)}">` +
          '<input type="text" class="plan-source-title-input" placeholder="Title" autocomplete="off"/>' +
          '<input type="url" class="plan-source-url-input" placeholder="URL" autocomplete="off"/>' +
          '<button type="button" class="plan-source-save">Save</button>' +
          '<button type="button" class="plan-source-cancel">Cancel</button>' +
          "</div></div>";
        return html;
      }

      function renderPlanTodos(todos, { backlog = false } = {}) {
        if (!todos || !todos.length) return backlog ? "" : "";
        const rows = todos
          .map((t) => {
            const checked = !!t.checked;
            const doneCls = checked ? " done" : "";
            let row =
              `<li class="plan-todo${doneCls}">` +
              `<input type="checkbox" id="${escAttr(t.id)}" data-todo-id="${escAttr(t.id)}" data-iid="${escAttr(t.id)}"` +
              (checked ? " checked" : "") +
              "/>" +
              `<label for="${escAttr(t.id)}">${esc(stripPlanTopicEmoji(t.text))}</label>`;
            if (backlog) {
              row +=
                `<button type="button" class="plan-todo-remove" data-backlog-remove="${escAttr(t.id)}"` +
                ' title="Remove from backlog" aria-label="Remove from backlog">×</button>';
            }
            row += "</li>";
            return row;
          })
          .join("");
        return `<ul class="plan-todos">${rows}</ul>`;
      }

      function renderPlanSection(section) {
        const lvl = Math.min(Math.max(section.level || 2, 2), 6);
        const tag = "h" + lvl;
        const hasTodos = (section.todos || []).length > 0;
        const topicCls = hasTodos ? " plan-topic-card" : "";
        const anchor =
          section.anchor ||
          "sec-" +
            String(section.section_path || section.title || "").replace(
              /\W+/g,
              "-",
            );
        let html =
          `<section class="plan-section level-${lvl}${topicCls}" id="${escAttr(anchor)}">` +
          `<${tag}>${esc(section.title || "")}</${tag}>` +
          '<div class="plan-topic-body">' +
          renderPlanTodos(section.todos || []);
        (section.children || []).forEach((child) => {
          html += renderPlanSection(child);
        });
        html += "</div>" + renderPlanSources(section) + "</section>";
        return html;
      }

      function renderPlansToc(plan) {
        const toc = document.getElementById("plansTocList");
        if (!plan) {
          toc.innerHTML = "";
          return;
        }
        let html =
          `<li class="toc-level-2"><div class="toc-row">` +
          '<span class="toc-twist leaf">▸</span>' +
          '<a class="toc-link" href="#plan-backlog">Backlog</a></div></li>';
        function walk(nodes) {
          (nodes || []).forEach((n) => {
            const lvl = Math.min(Math.max(n.level || 2, 2), 5);
            const anchor =
              n.anchor ||
              "sec-" +
                String(n.section_path || n.title || "").replace(/\W+/g, "-");
            html +=
              `<li class="toc-level-${lvl}"><div class="toc-row">` +
              `<span class="toc-twist ${(n.children || []).length ? "" : "leaf"}">▸</span>` +
              `<a class="toc-link" href="#${escAttr(anchor)}">${esc(n.title || "")}</a></div>`;
            if ((n.children || []).length) {
              html += "<ul>";
              walk(n.children);
              html += "</ul>";
            }
            html += "</li>";
          });
        }
        walk(plan.sections || []);
        toc.innerHTML = html;
      }

      async function plansSaveAction(body) {
        return api("/api/plans/save", {
          method: "POST",
          body: JSON.stringify(body),
        });
      }

      async function renderPlans() {
        const sid = state.studyId;
        const st = studyById(sid);
        const empty = document.getElementById("plansEmpty");
        const content = document.getElementById("plansContent");
        document.getElementById("plansTitle").textContent = "Study Plan";
        document.getElementById("plansSub").textContent = st ? st.title : sid;
        setPlansSaveStatus("", "");
        if (!sid) {
          empty.classList.remove("hidden");
          content.innerHTML = "";
          renderPlansToc(null);
          updatePlansProgressFromPlan(null);
          return;
        }
        content.innerHTML = '<p class="muted">Loading plan…</p>';
        let view;
        try {
          view = await api(
            "/api/plans/view?study_id=" + encodeURIComponent(sid),
          );
        } catch (e) {
          content.innerHTML = `<p class="plans-save-status err">${esc(String(e.message || e))}</p>`;
          return;
        }
        if (view.github_url)
          document.getElementById("plansGithub").href = view.github_url;
        const plan = view.plan;
        state.currentPlanView = plan;
        if (!plan) {
          empty.classList.remove("hidden");
          content.innerHTML = "";
          renderPlansToc(null);
          updatePlansProgressFromPlan(null);
          return;
        }
        empty.classList.add("hidden");
        document.getElementById("plansTitle").textContent =
          plan.title || "Study Plan";
        document.getElementById("plansSub").textContent =
          `${plan.todo_count || 0} tasks · ${(plan.sections || []).length} sections · sources included`;
        state.planCheckSnapshot = (plan.todos || []).map((t) => ({
          id: t.id,
          checked: !!t.checked,
        }));

        const backlog = plan.backlog || [];
        let html =
          '<div class="plans-backlog" id="plan-backlog"><h3>Backlog</h3>';
        if (backlog.length) html += renderPlanTodos(backlog, { backlog: true });
        else html += '<p class="plans-backlog-empty">No backlog items yet.</p>';
        html +=
          '<div class="plans-backlog-add">' +
          '<input type="text" id="plansBacklogInput" placeholder="Add backlog item…" autocomplete="off"/>' +
          '<button type="button" id="btnPlansBacklogAdd">Add</button>' +
          "</div></div>";
        (plan.sections || []).forEach((sec) => {
          html += renderPlanSection(sec);
        });
        content.innerHTML = html;
        renderPlansToc(plan);
        updatePlansProgressFromPlan(plan);

        content
          .querySelectorAll('input[type="checkbox"][data-todo-id]')
          .forEach((box) => {
            box.addEventListener("change", () => {
              box.closest(".plan-todo")?.classList.toggle("done", box.checked);
              updatePlansProgressFromPlan(plan);
            });
          });
        content.querySelectorAll("[data-backlog-remove]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const todoId = btn.getAttribute("data-backlog-remove");
            setPlansSaveStatus("Removing backlog item…", "");
            try {
              const r = await plansSaveAction({
                action: "remove_backlog",
                study_id: sid,
                todo_id: todoId,
              });
              if (!r.ok) throw new Error(r.error || "remove failed");
              setPlansSaveStatus("Backlog item removed.", "ok");
              await refresh();
            } catch (e) {
              setPlansSaveStatus(String(e.message || e), "err");
            }
          });
        });
        const addBtn = document.getElementById("btnPlansBacklogAdd");
        const addInput = document.getElementById("plansBacklogInput");
        if (addBtn && addInput) {
          const doAdd = async () => {
            const text = addInput.value.trim();
            if (!text) {
              setPlansSaveStatus("Enter a backlog item first.", "err");
              addInput.focus();
              return;
            }
            addBtn.disabled = true;
            setPlansSaveStatus("Adding backlog item…", "");
            try {
              const r = await plansSaveAction({
                action: "add_backlog",
                study_id: sid,
                text,
              });
              if (!r.ok) throw new Error(r.error || "add failed");
              addInput.value = "";
              setPlansSaveStatus("Backlog item added.", "ok");
              await refresh();
            } catch (e) {
              setPlansSaveStatus(String(e.message || e), "err");
            } finally {
              addBtn.disabled = false;
            }
          };
          addBtn.onclick = doAdd;
          addInput.onkeydown = (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              doAdd();
            }
          };
        }
        content.querySelectorAll(".plan-source-add").forEach((btn) => {
          btn.addEventListener("click", () => {
            const wrap = btn.closest(".plan-sources");
            const form = wrap?.querySelector(".plan-source-form");
            if (!form) return;
            form.classList.remove("hidden");
            form.removeAttribute("data-edit-id");
            form.querySelectorAll("input").forEach((inp) => {
              inp.value = "";
            });
            form.querySelector(".plan-source-title-input")?.focus();
          });
        });
        content.querySelectorAll(".plan-source-cancel").forEach((btn) => {
          btn.addEventListener("click", () => {
            const form = btn.closest(".plan-source-form");
            if (!form) return;
            form.classList.add("hidden");
            form.removeAttribute("data-edit-id");
            form.querySelectorAll("input").forEach((inp) => {
              inp.value = "";
            });
          });
        });
        content.querySelectorAll(".plan-source-save").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const form = btn.closest(".plan-source-form");
            if (!form) return;
            const sp = form.getAttribute("data-form-section") || "";
            const title = (
              form.querySelector(".plan-source-title-input")?.value || ""
            ).trim();
            const url = (
              form.querySelector(".plan-source-url-input")?.value || ""
            ).trim();
            const editId = form.getAttribute("data-edit-id") || "";
            if (!title || !url) {
              setPlansSaveStatus("Title and URL required.", "err");
              return;
            }
            setPlansSaveStatus(
              editId ? "Updating source…" : "Adding source…",
              "",
            );
            try {
              const r = await plansSaveAction(
                editId
                  ? {
                      action: "edit_resource",
                      study_id: sid,
                      resource_id: editId,
                      title,
                      url,
                    }
                  : {
                      action: "add_resource",
                      study_id: sid,
                      section_path: sp,
                      title,
                      url,
                    },
              );
              if (!r.ok) throw new Error(r.error || "source save failed");
              setPlansSaveStatus(
                editId ? "Source updated." : "Source added.",
                "ok",
              );
              await refresh();
            } catch (e) {
              setPlansSaveStatus(String(e.message || e), "err");
            }
          });
        });
        content.querySelectorAll(".plan-source-edit").forEach((btn) => {
          btn.addEventListener("click", () => {
            const wrap = btn.closest(".plan-sources");
            const form = wrap?.querySelector(".plan-source-form");
            if (!form) return;
            form.classList.remove("hidden");
            form.setAttribute(
              "data-edit-id",
              btn.getAttribute("data-resource-id") || "",
            );
            const ti = form.querySelector(".plan-source-title-input");
            const ui = form.querySelector(".plan-source-url-input");
            if (ti) ti.value = btn.getAttribute("data-resource-title") || "";
            if (ui) ui.value = btn.getAttribute("data-resource-url") || "";
            ti?.focus();
          });
        });
        content.querySelectorAll(".plan-source-remove").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const rid = btn.getAttribute("data-resource-id") || "";
            if (!rid) return;
            setPlansSaveStatus("Removing source…", "");
            try {
              const r = await plansSaveAction({
                action: "remove_resource",
                study_id: sid,
                resource_id: rid,
              });
              if (!r.ok) throw new Error(r.error || "remove failed");
              setPlansSaveStatus("Source removed.", "ok");
              await refresh();
            } catch (e) {
              setPlansSaveStatus(String(e.message || e), "err");
            }
          });
        });
      }

      function resetPlanCheckboxes() {
        if (!state.planCheckSnapshot) return;

          state.planCheckSnapshot.map((x) => [x.id, x.checked]),
        );
        document
          .querySelectorAll("#plansContent input[data-todo-id]")

      async function renderMethod() {
        const mount = document.getElementById("methodMount");
        if (!mount) return;
        if (!state.methodLoaded) {
          mount.innerHTML = '<p class="muted">Loading method…</p>';
        }
        try {
          const r = await api("/api/method");
          state.methodCanon = r.canon || { characters: [], bestiary: [] };
          mount.innerHTML =
            r.html ||
            '<div class="method-empty"><p>No technique docs.</p></div>';
          state.methodLoaded = true;
          wireMethodPanel();
          ensureMermaid();
        } catch (e) {
          mount.innerHTML = `<p class="method-warn">${esc(String(e.message || e))}</p>`;
        }
      }

      function ensureMermaid() {
        const run = () => {
          try {
            if (window.mermaid)
              window.mermaid.run({ querySelector: "#methodPanel .mermaid" });
          } catch {
            /* ignore */
          }
        };
        if (window.mermaid) {
          run();
          return;
        }
        if (state.mermaidLoading) return;
        state.mermaidLoading = true;
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js";
        s.onload = () => {
          try {
            window.mermaid.initialize({ startOnLoad: false, theme: "dark" });
            run();
          } catch {
            /* ignore */
          }
        };
        document.head.appendChild(s);
      }

      function renderMethodCharacters(q) {
        const el = document.getElementById("charResults");
        if (!el) return;
        const query = (q || "").trim().toLowerCase();
        const cards = [];
        (state.methodCanon?.characters || []).forEach((sec) => {
          (sec.characters || []).forEach((c) => {
            const name = (c.name || "").toString();
            if (query && !name.toLowerCase().includes(query)) return;
            cards.push(
              `<div class="canon-card"><span class="sec">${esc(sec.title || "")}</span>${esc(name)}</div>`,
            );
          });
        });
        el.innerHTML = cards.length
          ? cards.slice(0, 200).join("")
          : '<p class="empty">No characters match.</p>';
      }

      function renderMethodBestiary(q) {
        const el = document.getElementById("beastResults");
        if (!el) return;
        const query = (q || "").trim().toLowerCase();
        const rows = [];
        (state.methodCanon?.bestiary || []).forEach((b) => {
          const code = (b.code || "").toString();
          const name = (b.name || "").toString();
          const source = (b.source || "").toString();
          const blob = `${code} ${name} ${source}`.toLowerCase();
          if (query && !blob.includes(query)) return;
          rows.push(
            `<tr><td>${esc(code)}</td><td>${esc(name)}</td><td>${esc(source)}</td></tr>`,
          );
        });
        if (!rows.length) {
          el.innerHTML = '<p class="empty">No beasts match.</p>';
          return;
        }
        const limit = query ? 200 : 80;
        el.innerHTML =
          '<table class="canon-table"><thead><tr><th>Code</th><th>Name</th><th>Source</th></tr></thead><tbody>' +
          rows.slice(0, limit).join("") +
          "</tbody></table>" +
          (rows.length > limit
            ? `<p class="method-note">Showing ${limit} of ${rows.length} — refine search to narrow.</p>`
            : "");
      }

      function wireMethodPanel() {
        const charSearch = document.getElementById("charSearch");
        const beastSearch = document.getElementById("beastSearch");
        if (charSearch) {
          charSearch.oninput = () => renderMethodCharacters(charSearch.value);
          renderMethodCharacters("");
        }
        if (beastSearch) {
          beastSearch.oninput = () => renderMethodBestiary(beastSearch.value);
          renderMethodBestiary("");
        }
        document
          .querySelectorAll("#methodPanel .btn-prompt-full")
          .forEach((btn) => {
            btn.onclick = () => {
              const det = btn.closest(".method-prompt");
              if (!det) return;
              const preview = det.querySelector(".prompt-preview");
              const full = det.querySelector(".prompt-full");
              if (!preview || !full) return;
              const showing = !full.hidden;
              full.hidden = showing;
              preview.hidden = !showing;
              btn.textContent = showing ? "Show all" : "Show less";
            };
          });
      }
