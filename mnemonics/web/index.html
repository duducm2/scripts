                ) => `<tr><td>${esc(x.peg_code)}</td><td>${esc(x.beast_name)}</td><td>${esc(x.sensory_channel)}</td>
              <td><button class="spa-btn" data-open="${escAttr(x.id)}">Atoms</button>
              <button class="spa-btn" data-edit="${escAttr(x.id)}">Edit</button>
              <button class="spa-btn danger" data-del="${escAttr(x.id)}">Del</button></td></tr>`,
              )
              .join("")}</tbody></table></div>`;
          root.querySelector("#up").onclick = () => {
            state.browse.palaceId = "";
            render();
          };
          root.querySelector("#changeImg").onclick = () =>
            changePalaceImage(b.palaceId);
          root.querySelector("#practice").onclick = () =>
            openPalace(b.palaceId);
          root.querySelector("#addB").onclick = () =>
            editBeast(null, b.palaceId);
          root.querySelectorAll("[data-open]").forEach(
            (btn) =>
              (btn.onclick = () => {
                state.browse.beastId = btn.dataset.open;
                render();
              }),
          );
          root.querySelectorAll("[data-edit]").forEach(
            (btn) =>
              (btn.onclick = () =>
                editBeast(
                  beasts(b.palaceId).find((x) => x.id === btn.dataset.edit),
                  b.palaceId,
                )),
          );
          root.querySelectorAll("[data-del]").forEach(
            (btn) =>
              (btn.onclick = async () => {
                if (!confirm("Delete beast?")) return;
                await api(`/api/beasts/${btn.dataset.del}`, {
                  method: "DELETE",
                });
                await refresh();
              }),
          );
          return;
        }
        const list = atoms(b.beastId);
        root.innerHTML =
          crumb +
          `
          <div class="spa-row"><button class="spa-btn" id="up">Up</button>
            <button class="spa-btn" id="addA">Add atom</button></div>
          <div class="spa-panel"><table class="spa-table"><thead><tr><th>Kind</th><th>Zone</th><th>Concept</th><th></th></tr></thead>
          <tbody>${list
            .map(
              (
                a,
              ) => `<tr><td>${esc(a.kind)}</td><td>${esc(a.zone)}</td><td>${esc(a.concept)}</td>
            <td><button class="spa-btn" data-edit="${escAttr(a.id)}">Edit</button>
            <button class="spa-btn danger" data-del="${escAttr(a.id)}">Del</button></td></tr>`,
            )
            .join("")}</tbody></table></div>`;
        root.querySelector("#up").onclick = () => {
          state.browse.beastId = "";
          render();
        };
        root.querySelector("#addA").onclick = () => editAtom(null, b.beastId);
        root.querySelectorAll("[data-edit]").forEach(
          (btn) =>
            (btn.onclick = () =>
              editAtom(
                list.find((a) => a.id === btn.dataset.edit),
                b.beastId,
              )),
        );
        root.querySelectorAll("[data-del]").forEach(
          (btn) =>
            (btn.onclick = async () => {
              if (!confirm("Delete atom?")) return;
              await api(`/api/atoms/${btn.dataset.del}`, { method: "DELETE" });
              await refresh();
            }),
        );
      }

      function editStudy(s) {
        const title = prompt("Title", s?.title || "");
        if (title == null || !String(title).trim()) return;
        const notes_rel_path =
          prompt(
            "notes_rel_path",
            s?.notes_rel_path ||
              String(title).toLowerCase().replace(/\s+/g, "-"),
          ) || "";
        const body = {
          title: String(title).trim(),
          notes_rel_path,
          active: s?.active || "1",
        };
        if (s?.id) body.id = s.id;
        api("/api/studies", { method: "POST", body: JSON.stringify(body) })
          .then((r) => afterEntitySave("studies", r))
          .catch((e) => toast(String(e.message || e)));
      }
      function editPalace(p, studyId) {
        const title = prompt("Title", p?.title || "");
        if (title == null || !String(title).trim()) return;
        const character_name =
          prompt("Character", p?.character_name || "") || "";
        const palace_number = prompt("Number", p?.palace_number || "") || "";
        const image_prompt =
          prompt("Image prompt", p?.image_prompt || "") || "";
        const body = {
          study_id: studyId,
          title: String(title).trim(),
          character_name,
          palace_number,
          image_prompt,
        };
        if (p?.id) body.id = p.id;
        api("/api/palaces", { method: "POST", body: JSON.stringify(body) })
          .then((r) => afterEntitySave("palaces", r))
          .catch((e) => toast(String(e.message || e)));
      }
      function editBeast(b, palaceId) {
        const peg_code = prompt("Peg code (non-numeric)", b?.peg_code || "");
        if (peg_code == null || !String(peg_code).trim()) return;
        const beast_name = prompt("Beast name", b?.beast_name || "") || "";
        const sensory_channel =
          prompt("Sensory", b?.sensory_channel || "visual") || "visual";
        const body = {
          palace_id: palaceId,
          peg_code: String(peg_code).trim(),
          beast_name,
          sensory_channel,
        };
        if (b?.id) body.id = b.id;
        api("/api/beasts", { method: "POST", body: JSON.stringify(body) })
          .then((r) => afterEntitySave("beasts", r))
          .catch((e) => toast(String(e.message || e)));
      }
      function editAtom(a, beastId) {
        const kind =
          prompt("Kind (single/zoned)", a?.kind || "single") || "single";
        const concept = prompt("Concept", a?.concept || "");
        if (concept == null) return;
        const keywordsRaw = prompt(
          "Keywords (Keyword | Word || …; max 10; optional)",
          a?.keywords || ""
        );
        if (keywordsRaw == null) return;
        const quote = prompt("Quote", a?.quote || "") || "";
        const story = prompt("Story", a?.story || "") || "";
        const zone = prompt("Zone (optional)", a?.zone || "") || "";
        const zone_label = prompt("Zone label", a?.zone_label || "") || "";
        const body = {
          beast_id: beastId,
          kind,
          concept,
          keywords: keywordsRaw,
          quote,
          story,
          zone,
          zone_label,
        };
        if (a?.id) body.id = a.id;
        api("/api/atoms", { method: "POST", body: JSON.stringify(body) })
          .then((r) => afterEntitySave("atoms", r))
          .catch((e) => toast(String(e.message || e)));
      }

      async function fetchStudyLink(kind) {
        const r = await api(`/api/links/${kind}`);
        const url = (r.url || "").trim();
        state.studyLinks[kind] = url;
        return { ok: r.ok, url, error: r.error };
      }

      async function refreshLinkStatus() {
        const out = document.getElementById("linkOut");
        const labels = {
          video: "Video",
          article: "Article",
          favorite: "Favorite",
        };
        const lines = [];
        for (const kind of Object.keys(labels)) {
          try {
            const { ok, url, error } = await fetchStudyLink(kind);
            lines.push(
              `${labels[kind]}: ${url || (ok ? "(none)" : error || "error")}`,
            );
          } catch (e) {
            state.studyLinks[kind] = "";
            lines.push(`${labels[kind]}: ${e.message || e}`);
          }
        }
        if (out) out.textContent = lines.join("\n");
      }

      let studyLinkRefreshTimer = 0;
      function scheduleStudyLinkRefresh() {
        clearTimeout(studyLinkRefreshTimer);
        studyLinkRefreshTimer = setTimeout(() => {
          refreshLinkStatus().catch(() => {});
        }, 250);
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.view === "links")
          scheduleStudyLinkRefresh();
      });
      window.addEventListener("focus", () => {
        if (state.view === "links") scheduleStudyLinkRefresh();
      });

      async function openStudyLinkChrome(kind) {
        const labels = {
          video: "video",
          article: "article",
          favorite: "favorite",
        };
        if (!labels[kind]) return;
        toast(`Opening ${labels[kind]} in Chrome…`);
        try {
          const { url } = await fetchStudyLink(kind);
          if (!url) {
            toast(`No ${labels[kind]} URL stored`);
            return;
          }
          const r = await api(`/api/links/${kind}`, {
            method: "POST",
            body: JSON.stringify({ action: "open", url }),
          });
          if (r.ok && (r.opened || r.url)) {
            if (r.url) state.studyLinks[kind] = r.url;
            toast(`Opened ${labels[kind]} in Chrome`);
          } else {
            toast(r.error || `No ${labels[kind]} URL stored`);
          }
        } catch (e) {
          toast(String(e.message || e));
        }
      }

      async function setStudyLinkFromShortcut(kind) {
        const labels = {
          video: "video",
          article: "article",
          favorite: "favorite",
        };
        if (!labels[kind]) return;
        toast(`Saving ${labels[kind]} from clipboard…`);
        try {
          const r = await api(`/api/links/${kind}`, {
            method: "POST",
            body: JSON.stringify({ action: "clipboard" }),
          });
          if (r.ok && r.url) {
            state.studyLinks[kind] = r.url;
            toast(`Saved ${labels[kind]} link`);
            await refreshLinkStatus();
          } else {
            toast(r.error || "Clipboard has no valid http(s) URL");
          }
        } catch (e) {
          toast(String(e.message || e));
        }
      }

      function renderLinks(root) {
        root.innerHTML = `<div class="spa-panel"><h2 style="margin-top:0;color:var(--gold)">Study links</h2>
          <p class="sub" style="color:var(--muted);margin:0 0 12px;font-size:13px">Shift+V/A/F open · Alt+V/A/F save from clipboard (AHK). Set buttons use clipboard too. Links [1].</p>
          <div class="spa-row">
            <button class="spa-btn" data-k="video" data-a="open">Open video</button>
            <button class="spa-btn" data-k="video" data-a="set">Set video (clipboard)</button>
            <button class="spa-btn" data-k="article" data-a="open">Open article</button>
            <button class="spa-btn" data-k="article" data-a="set">Set article (clipboard)</button>
            <button class="spa-btn" data-k="favorite" data-a="open">Open favorite</button>
            <button class="spa-btn" data-k="favorite" data-a="set">Set favorite (clipboard)</button>
          </div>
          <pre id="linkOut" style="color:var(--muted);white-space:pre-wrap">Loading…</pre>
        </div>`;
        refreshLinkStatus();
        root.querySelectorAll("[data-k]").forEach((btn) => {
          btn.onclick = async () => {
            const kind = btn.dataset.k,
              action = btn.dataset.a;
            try {
              if (action === "set") {
                await setStudyLinkFromShortcut(kind);
              } else {
                await openStudyLinkChrome(kind);
                await refreshLinkStatus();
              }
            } catch (e) {
              toast(String(e.message || e));
              await refreshLinkStatus();
            }
          };
        });
      }

      function renderHelp(root) {
        const practiceGh = state.data.meta?.practice_github || "#";
        const plansGh = state.data.meta?.plans_github || "#";
        root.innerHTML = `<div class="spa-panel">
          <h2 style="margin-top:0;color:var(--gold)">Help / glossary</h2>
          <div class="spa-row" style="margin-bottom:1rem">
            <a class="spa-btn" target="_blank" href="${escAttr(practiceGh)}">Practice GitHub</a>
            <a class="spa-btn" target="_blank" href="${escAttr(plansGh)}">Plans GitHub</a>
          </div>
          <div id="g"></div>
        </div>`;
        api("/api/glossary")
          .then((r) => {
            document.getElementById("g").innerHTML = (r.items || [])
              .map((i) => `<p><b>${esc(i.term)}</b> — ${esc(i.def)}</p>`)
              .join("");
          })
          .catch((e) => toast(String(e)));
      }

      /* ---------- Wiring ---------- */
      document.getElementById("study").onchange = (e) => {
        rememberStudy(e.target.value);
        if (state.view === "browse") {
          state.browse = { studyId: "", palaceId: "", beastId: "" };
        }
        render();
      };
      document.getElementById("btnLatest").onclick = () =>
        goLatestPalaceShortcut();
      document.getElementById("btnPractice").onclick = () =>
        setView("practice");
      document.getElementById("btnPlans").onclick = () => togglePlansPractice();
      document.getElementById("btnMethod").onclick = () => setView("method");
      document.getElementById("btnClose").onclick = () => closeOverlay();
      document.getElementById("btnExpandImage").onclick = () =>
        toggleOverlayImageExpand();
      document.getElementById("btnToggleAtomDetails").onclick = () =>
        toggleAtomDetails();
      document.getElementById("btnNotesSave").onclick = () => saveNotes();
      document.getElementById("ovNotesInput").oninput = () => {
        clearTimeout(state.notesTimer);
        state.notesTimer = setTimeout(saveNotes, 800);
      };
      document.getElementById("btnPlansSave").onclick = () =>
        savePlanProgress();
      document.getElementById("btnPlansReset").onclick = () =>
        resetPlanCheckboxes();
      document.getElementById("btnPlansTocToggle").onclick = () => {
        const layout = document.getElementById("plansLayout");
        const collapsed = layout.classList.toggle("toc-collapsed");
        document.getElementById("btnPlansTocToggle").textContent = collapsed
          ? "▶"
          : "◀";
        document
          .getElementById("btnPlansTocToggle")
          .setAttribute("aria-expanded", collapsed ? "false" : "true");
      };
      document.getElementById("btnChangeImage").onclick = () =>
        changePalaceImage(state.overlayPalaceId);
      document.getElementById("btnGalleryAdd").onclick = () =>
        document.getElementById("galleryFileInput").click();
      document.getElementById("palaceHeroFileInput").onchange = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        const palaceId = state.pendingHeroPalaceId;
        state.pendingHeroPalaceId = "";
        if (!file || !palaceId) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const r = await api("/api/palace/images", {
              method: "POST",
              body: JSON.stringify({
                palace_id: palaceId,
                action: "set_hero",
                data_b64: reader.result,
                mime: file.type,
              }),
            });
            if (!r.ok) throw new Error(r.error || "fail");
            toast(`Image updated (${r.image_rel_path || "saved"})`);
            await refresh();
            if (state.overlayPalaceId === palaceId) openPalace(palaceId);
          } catch (err) {
            toast(String(err.message || err), 3200);
          }
        };
        reader.readAsDataURL(file);
      };
      document.getElementById("galleryFileInput").onchange = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file || !state.overlayPalaceId) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const r = await api("/api/palace/images", {
              method: "POST",
              body: JSON.stringify({
                palace_id: state.overlayPalaceId,
                action: "add",
                data_b64: reader.result,
                mime: file.type,
                caption: file.name,
              }),
            });
            if (!r.ok) throw new Error(r.error || "fail");
            document.getElementById("ovGalleryStatus").textContent = "Added";
            document.getElementById("ovGalleryStatus").className =
              "gallery-status ok";
            await refresh();
            if (state.overlayPalaceId) renderGalleryGrid(state.overlayPalaceId);
          } catch (err) {
            document.getElementById("ovGalleryStatus").textContent = String(
              err.message || err,
            );
            document.getElementById("ovGalleryStatus").className =
              "gallery-status err";
          }
        };
        reader.readAsDataURL(file);
      };

      document.querySelectorAll("#appMore [data-view]").forEach((b) => {
        b.onclick = () => setView(b.dataset.view);
      });

      document.getElementById("atomSearch").oninput = (e) => {
        const q = e.target.value.trim().toLowerCase();
        const box = document.getElementById("searchResults");
        if (!q) {
          box.classList.remove("open");
          box.innerHTML = "";
          return;
        }
        const hits = [];
        for (const a of state.data?.atoms || []) {
          const blob = `${a.concept} ${a.keywords || ""} ${a.quote} ${a.story}`.toLowerCase();
          if (!blob.includes(q)) continue;
          const beast = (state.data.beasts || []).find(
            (b) => b.id === a.beast_id,
          );
          const pal = beast && palaceById(beast.palace_id);
          if (!pal) continue;
          hits.push({ a, beast, pal });
          if (hits.length >= 40) break;
        }
        if (!hits.length) {
          box.innerHTML = '<p class="empty">No matches</p>';
          box.classList.add("open");
          return;
        }
        box.innerHTML = hits
          .map(
            (h) =>
              `<button type="button" class="hit" data-pid="${escAttr(h.pal.id)}">
            <div>${esc(h.a.concept || "(no concept)")}</div>
            <div class="meta">${esc(h.pal.title)} · ${esc(h.beast?.beast_name || "")}</div>
          </button>`,
          )
          .join("");
        box.classList.add("open");
        box.querySelectorAll(".hit").forEach((btn) => {
          btn.onclick = () => {
            box.classList.remove("open");
            openPalace(btn.dataset.pid);
          };
        });
      };

      document.getElementById("atomSearch").onkeydown = (e) => {
        if (e.key !== "Enter") return;
        const box = document.getElementById("searchResults");
        if (!box.classList.contains("open")) return;
        const first = box.querySelector(".hit");
        if (!first) return;
        e.preventDefault();
        box.classList.remove("open");
        openPalace(first.dataset.pid);
      };

      function focusAtomSearch() {
        if (studyModalIsOpen()) closeStudyModal({ focusLatest: false });
        const el = document.getElementById("atomSearch");
        if (!el) return;
        el.focus();
        el.select();
      }

      document.addEventListener("keydown", (e) => {
        if (
          e.altKey &&
          !e.ctrlKey &&
          !e.metaKey &&
          (e.key === "s" || e.key === "S")
        ) {
          e.preventDefault();
          focusAtomSearch();
          return;
        }
        if (e.target.matches("input, textarea, select")) return;
        if (e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const k = e.key;
          if (k === "V" || k === "v") {
            e.preventDefault();
            openStudyLinkChrome("video");
            return;
          }
          if (k === "A" || k === "a") {
            e.preventDefault();
            openStudyLinkChrome("article");
            return;
          }
          if (k === "F" || k === "f") {
            e.preventDefault();
            openStudyLinkChrome("favorite");
            return;
          }
        }
        if (handleStudyModalKey(e)) return;
        const ovOpen = document
          .getElementById("overlay")
          .classList.contains("open");
        if (ovOpen) {
          if (e.key === "Escape") {
            const ov = document.getElementById("overlay");
            if (ov.classList.contains("image-expanded")) {
              toggleOverlayImageExpand();
            } else {
              closeOverlay();
            }
            return;
          }
          if (
            (e.key === "f" || e.key === "F") &&
            !e.ctrlKey &&
            !e.metaKey &&
            !e.altKey &&
            !e.shiftKey
          ) {
            e.preventDefault();
            toggleOverlayImageExpand();
            return;
          }
          if (
            (e.key === "d" || e.key === "D") &&
            !e.ctrlKey &&
            !e.metaKey &&
            !e.altKey
          ) {
            e.preventDefault();
            toggleAtomDetails();
            return;
          }
          if (e.key === "c" || e.key === "C") {
            document.getElementById("btnCopyPrompt").click();
            return;
          }
          if (e.key === "ArrowLeft") {
            document.getElementById("btnPrevPalace").click();
            return;
          }
          if (e.key === "ArrowRight") {
            document.getElementById("btnNextPalace").click();
            return;
          }
        }
        if (e.key === "Escape") {
          if (state.view === "browse") {
            if (state.browse.beastId) state.browse.beastId = "";
            else if (state.browse.palaceId) state.browse.palaceId = "";
            else if (state.browse.studyId) state.browse.studyId = "";
            else {
              setView("practice");
              return;
            }
            render();
            return;
          }
          setView("practice");
          return;
        }
        if (e.key === "b" || e.key === "B") setView("browse");
        if (
          (e.key === "p" || e.key === "P") &&
          !e.ctrlKey &&
          !e.metaKey &&
          !e.altKey
        ) {
          e.preventDefault();
          togglePlansPractice();
          return;
        }
        if (
          (e.key === "l" || e.key === "L") &&
          !e.ctrlKey &&
          !e.metaKey &&
          !e.altKey
        ) {
          e.preventDefault();
          goLatestPalaceShortcut();
          return;
        }
        if (e.key === "m" || e.key === "M") setView("method");
        if (e.key === "h" || e.key === "H") setView("help");
        if (e.key === "1") setView("links");
      });

      refresh().catch((e) => {
        document.getElementById("stats").textContent = "Failed to load";
        toast(String(e.message || e), 5000);
      });
    </script>
  </body>
</html>
