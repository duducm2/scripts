[Bonificação]
geral = Recebimentos adicionais, como bônus corporativos, PLR ou gratificações.

[Empréstimo]
geral = Valores recebidos provenientes de crédito tomado junto a instituições financeiras ou terceiros.

[Investimentos]
geral = Rendimentos, pagamento de dividendos, juros ou resgates de aplicações financeiras.

[Nota Fiscal Paulista]
geral = Créditos resgatados provenientes do programa de incentivo fiscal do estado de São Paulo.

[Outros]
geral = Entradas financeiras diversas que não possuem uma classificação específica no sistema.

[Pix]
geral = Transferências instantâneas recebidas sem uma categoria de renda previamente definida.

[Prêmios]
geral = Valores financeiros ganhos em sorteios, loterias, concursos ou competições.

[Presente]
geral = Dinheiro recebido de familiares ou amigos em datas comemorativas ou como doação pessoal.

[Reajuste]
geral = Acertos de saldo positivo ou correções manuais para alinhar o controle financeiro com a conta real.

[Reembolso]
geral = Valores devolvidos por compras canceladas, estornos de cartão ou reembolso de despesas corporativas.

[Renda extra]
geral = Ganhos eventuais provenientes de trabalhos informais, freelancers ou projetos secundários.

[Restituição de importo de renda]
geral = Devolução do imposto retido a maior recebida após a declaração anual da Receita Federal.

[Salário]
geral = Remuneração mensal fixa e adiantamentos provenientes do vínculo empregatício principal.

[Transferência]
geral = Movimentações genéricas de entrada recebidas de outras contas ou pessoas.

[Transferência bancária]
geral = Entradas financeiras recebidas tradicionalmente via TED, DOC ou transferências diretas.

[Venda]
geral = Valores recebidos pela venda de itens pessoais usados, bens, produtos ou prestação de serviços diretos.