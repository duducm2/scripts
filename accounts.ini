[Mercado Pago main account]
geral = Conta principal do Mercado Pago para movimentações do dia a dia, pagamentos correntes e recebimentos frequentes.

[Mercado Pago short-term]
geral = Reserva financeira no Mercado Pago destinada a objetivos de curto prazo, liquidez diária ou fundo de emergência.

[Nubank Main]
geral = Conta principal do Nubank, utilizada para transações rápidas, Pix e gestão de gastos diários.

[Transition money]
geral = Saldo reservado temporariamente para transferências em andamento, giro de caixa ou despesas iminentes já programadas.

[BoschLife]
geral = Fundo de previdência privada corporativa (benefício da Bosch) focado em aposentadoria e segurança financeira de longo prazo.

[FGTS]
geral = Fundo de Garantia do Tempo de Serviço, conta vinculada ao contrato de trabalho retida na Caixa Econômica Federal.

[Meal voucher]
geral = Saldo do cartão de benefícios corporativo (Vale-Refeição/Vale-Alimentação) destinado a refeições e compras de mantimentos.

[Meli dólares]
geral = Conta de reserva em moeda estrangeira (dólar) ou criptoativos atrelados ao dólar (stablecoins) dentro do Mercado Pago.

[Mercado Pago long-term]
geral = Conta ou carteira de investimentos no Mercado Pago focada em rentabilidade, acumulação de capital e objetivos de longo prazo.