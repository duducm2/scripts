<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #121212;
        --panel: #1e1e1e;
        --text: #f2f2f2;
        --muted: #a0a0a0;
        --gold: #f1c40f;
        --line: #333;
        --due: #e67e22;
        --danger: #e74c3c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Segoe UI,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 16px 24px 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 24px 12px;
        align-items: center;
      }
      .btn,
      button.btn {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      .btn:hover,
      .btn.active {
        border-color: var(--gold);
        color: var(--gold);
      }
      .btn.danger:hover {
        border-color: var(--danger);
        color: var(--danger);
      }
      kbd {
        font: inherit;
        font-size: 11px;
        color: var(--gold);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        background: #252528;
      }
      #toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #252528;
        border: 1px solid var(--gold);
        padding: 10px 14px;
        border-radius: 8px;
        display: none;
        z-index: 2000;
        max-width: 360px;
      }
      #view {
        padding: 8px 24px 40px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .top-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 900px) {
        .top-row {
          grid-template-columns: 1fr;
        }
      }
      .column h2,
      .section-title {
        margin: 0 0 12px;
        font-size: 18px;
        color: var(--gold);
      }
      .project {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 8px;
        background: #252528;
      }
      .project summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        user-select: none;
      }
      .project summary::-webkit-details-marker {
        display: none;
      }
      .project summary::before {
        content: "▸";
        color: var(--gold);
        margin-right: 8px;
        font-size: 12px;
      }
      .project[open] summary::before {
        content: "▾";
      }
      .proj-title {
        font-weight: 600;
        flex: 1;
      }
      .proj-count {
        color: var(--muted);
        font-size: 12px;
        background: #1a1a1c;
        border-radius: 999px;
        padding: 2px 8px;
      }
      .task-list,
      .habit-list,
      .plain-list {
        list-style: none;
        margin: 0;
        padding: 0 12px 10px;
      }
      .task,
      .habit-row,
      .plain-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .task .em,
      .habit-row .em {
        flex: 0 0 auto;
      }
      .task .title,
      .habit-row .title,
      .plain-row .title {
        flex: 1;
        min-width: 120px;
        cursor: pointer;
      }
      .due {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .habit-row.due-now .due {
        color: var(--due);
      }
      .row-actions {
        display: none;
        flex-wrap: wrap;
        gap: 4px;
        width: 100%;
        margin-top: 2px;
        padding-left: 28px;
      }
      .task.kb-selected > .row-actions,
      .habit-row.kb-selected > .row-actions,
      .task:hover > .row-actions,
      .habit-row:hover > .row-actions {
        display: flex;
      }
      .row-actions .btn {
        padding: 2px 8px;
        font-size: 11px;
      }
      .proj-actions {
        display: none;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 12px 8px;
      }
      details.project.kb-selected > .proj-actions,
      details.project:hover > .proj-actions {
        display: flex;
      }
      .task-section {
        padding: 0 0 6px;
      }
      .task-section.collapsed > .task-list {
        display: none;
      }
      .task-section-label {
        padding: 4px 12px 2px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.85;
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .task-section-label::before {
        content: "▾";
        font-size: 9px;
        opacity: 0.7;
        width: 10px;
      }
      .task-section.collapsed > .task-section-label::before {
        content: "▸";
      }
      .task-section.kb-selected > .task-section-label {
        color: var(--gold);
        opacity: 1;
      }
      .task-section.emoji-hidden {
        display: none !important;
      }
      .thumbs {
        flex: 1 1 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px 0 2px 28px;
      }
      .project > .thumbs {
        padding: 0 12px 10px;
      }
      .thumb {
        display: block;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #1a1a1c;
        cursor: zoom-in;
        overflow: hidden;
        width: 72px;
        height: 54px;
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .emoji-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        align-items: center;
        justify-content: flex-end;
      }
      .emoji-chip {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        font-size: 11px;
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
        line-height: 1.3;
        opacity: 0.75;
      }
      .emoji-chip .em {
        color: var(--muted);
        font-size: 12px;
      }
      .emoji-chip .lbl {
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: lowercase;
      }
      .emoji-chip .n {
        color: var(--muted);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }
      .emoji-chip kbd {
        display: none;
      }
      .emoji-chip.active,
      .emoji-chip:hover {
        opacity: 1;
        color: var(--text);
      }
      .emoji-chip.active .em,
      .emoji-chip:hover .em,
      .emoji-chip.active .lbl,
      .emoji-chip:hover .lbl,
      .emoji-chip.active .n,
      .emoji-chip:hover .n {
        color: var(--gold);
      }
      .section-head-right .btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 11px;
        padding: 0 4px;
        opacity: 0.7;
      }
      .section-head-right .btn:hover {
        color: var(--gold);
        opacity: 1;
        border-color: transparent;
      }
      .section-head h2,
      .section-head .section-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        flex: 0 1 auto;
        letter-spacing: 0.01em;
      }
      .task.emoji-hidden,
      .habit-row.emoji-hidden,
      .project.emoji-hidden,
      .habit-card.emoji-hidden {
        display: none !important;
      }
      .section-hidden {
        display: none !important;
      }
      .top-row.section-solo {
        grid-template-columns: 1fr;
      }
      /* Masonry packing: fill columns top-to-bottom so short cards leave no row gaps */
      .column.bento {
        display: block;
        column-width: 360px;
        column-gap: 14px;
      }
      .column.bento > .section-head,
      .column.bento > .empty {
        column-span: all;
        margin-bottom: 12px;
      }
      .column.bento > .project {
        display: inline-block;
        width: 100%;
        margin: 0 0 14px;
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-column-break-inside: avoid;
      }
      .habits-wrap.bento .habit-cards {
        display: block;
        column-width: 300px;
        column-gap: 16px;
      }
      .habits-wrap.bento .habit-card {
        display: inline-block;
        width: 100%;
        margin: 0 0 16px;
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-column-break-inside: avoid;
      }
      @media (min-width: 1400px) {
        .column.bento {
          column-width: 380px;
        }
        .habits-wrap.bento .habit-cards {
          column-width: 320px;
        }
      }
      .kb-selected,
      details.project.kb-selected > summary,
      .task.kb-selected,
      .habit-row.kb-selected,
      .task-section.kb-selected > .task-section-label {
        outline: 2px solid var(--gold);
        outline-offset: -2px;
        background: rgba(241, 196, 15, 0.08);
      }
      details.project.kb-selected > summary {
        border-radius: 8px 8px 0 0;
      }
      .habit-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
        margin-top: 12px;
      }
      .habit-card h2 {
        margin: 0 0 12px;
        font-size: 20px;
        color: var(--gold);
      }
      .section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 12px;
        margin: 0 0 12px;
      }
      .section-head-right {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
      }
      .habits-wrap {
        margin-top: 20px;
      }
      .habits-wrap > .section-head {
        margin-bottom: 4px;
      }
      .strip {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        padding: 0 24px 12px;
        align-items: center;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        min-width: 88px;
      }
      .kpi .lbl {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
      }
      .kpi .val {
        font-size: 18px;
        margin-top: 2px;
        color: var(--gold);
      }
      #emojiFilterLbl {
        color: var(--gold);
        font-size: 12px;
      }
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #globalSearch {
        width: min(280px, 42vw);
        background: #252528;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
      }
      #globalSearch:focus {
        outline: none;
        border-color: var(--gold);
      }
      #globalSearch::placeholder {
        color: var(--muted);
      }
      mark.search-hit {
        background: rgba(241, 196, 15, 0.35);
        color: var(--text);
        border-radius: 2px;
        padding: 0 1px;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.82);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        cursor: zoom-out;
      }
      #lightbox[hidden] {
        display: none;
      }
      #lightbox img {
        max-width: min(96vw, 1200px);
        max-height: 92vh;
        border-radius: 8px;
        cursor: default;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 1500;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        width: min(520px, 100%);
        max-height: 90vh;
        overflow: auto;
      }
      .modal h3 {
        margin: 0 0 12px;
        color: var(--gold);
      }
      .modal label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 4px;
      }
      .modal input,
      .modal select,
      .modal textarea {
        width: 100%;
        background: #252528;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 8px;
        font: inherit;
      }
      .modal textarea {
        min-height: 120px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .help-modal {
        width: min(560px, 100%);
      }
      .help-groups {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .help-group h4 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .help-rows {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        align-items: baseline;
      }
      .help-rows kbd {
        justify-self: start;
        white-space: nowrap;
      }
      .help-rows span {
        color: var(--text);
        font-size: 13px;
      }
      .import-sources {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .import-source {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #252528;
        cursor: pointer;
        text-align: left;
        font: inherit;
        color: var(--text);
        width: 100%;
      }
      .import-source:hover,
      .import-source.selected {
        border-color: var(--gold);
      }
      .import-source.selected {
        background: rgba(241, 196, 15, 0.08);
      }
      .import-source .key {
        flex: 0 0 auto;
      }
      .import-source .meta {
        flex: 1;
        min-width: 0;
      }
      .import-source .meta strong {
        display: block;
        font-size: 15px;
      }
      .import-source .meta .sub {
        margin-top: 4px;
      }
      .import-actions .btn kbd {
        margin-left: 6px;
      }
      .inline-create {
        display: none;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px 24px 12px;
        border-bottom: 1px solid var(--line);
        background: #1a1a1c;
      }
      .inline-create.active {
        display: flex;
      }
      .inline-create .ctx {
        color: var(--muted);
        font-size: 12px;
        max-width: 280px;
      }
      .inline-create .ctx strong {
        color: var(--gold);
        font-weight: 600;
      }
      .inline-create input[type="text"] {
        flex: 1 1 220px;
        min-width: 160px;
        background: #252528;
        border: 1px solid var(--gold);
        border-radius: 8px;
        color: var(--text);
        padding: 8px 12px;
        font: inherit;
        font-size: 14px;
      }
      .inline-create input[type="text"]:focus {
        outline: none;
      }
      .modal .field-row[hidden] {
        display: none !important;
      }
      .crumb {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 10px;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Tasks</h1>
        <div class="sub" id="hdrSub">Loading…</div>
      </div>
      <div class="toolbar">
        <input
          type="search"
          id="globalSearch"
          placeholder="Search…"
          title="Search (Alt+S)"
          autocomplete="off"
          spellcheck="false"
        />
        <div id="mainToolbar"></div>
      </div>
    </header>
    <div class="strip" id="strip"></div>
    <div id="inlineCreate" class="inline-create" aria-hidden="true"></div>
    <div id="view"></div>
    <div id="toast"></div>
    <div id="lightbox" hidden><img src="" alt="" /></div>
    <div id="modalHost"></div>
    <script>
      (() => {
        const RECURRENCE_ORDER = [
          "daily",
          "weekly",
          "monthly",
          "quarterly",
          "biannual",
          "yearly",
          "every_2y",
          "every_3y",
          "every_5y",
          "every_10y",
        ];
        const RECURRENCE_LABELS = {
          daily: "Daily",
          weekly: "Weekly",
          monthly: "Monthly",
          quarterly: "Quarterly",
          biannual: "Bi-yearly",
          yearly: "Yearly",
          every_2y: "Every 2 years",
          every_3y: "Every 3 years",
          every_5y: "Every 5 years",
          every_10y: "Every 10 years",
          "": "Other",
        };
        const EMOJI_KEYS = { t: "⚡", w: "⏳", g: "🔲", u: "❓" };
        const EMOJI_LABELS = {
          "⚡": "important",
          "⏳": "waiting",
          "🔲": "general",
          "❓": "doubt",
          "✅": "done",
        };
        const EMOJI_KEY_BY = { "⚡": "t", "⏳": "w", "🔲": "g", "❓": "u" };
        const state = {
          data: null,
          filter: "work",
          view: "dashboard", // dashboard | import
          projectId: "",
          taskId: "",
          emojiFilter: "",
          sectionFocus: "", // "" | work | personal | habits
          search: "",
          importPreview: null,
          importSource: "task_pack", // selected import kind
          pwSide: "personal", // last side for Personal/Work first-item toggle
          inlineCreate: null, // { project_id, section_id, filter, kind }
          sel: null, // { kind: "project"|"section"|"task"|"habit", id }
          collapsedProjects: new Set(),
          collapsedSections: new Set(),
        };

        const IMPORT_SOURCES = [
          {
            id: "task_pack",
            key: "1",
            title: "TASK_PACK",
            blurb: "Desktop TASK_PACK.txt (Finance/Palace style markers).",
          },
        ];

        const $ = (sel) => document.querySelector(sel);
        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );

        function toast(msg) {
          const el = $("#toast");
          el.textContent = msg;
          el.style.display = "block";
          clearTimeout(toast._t);
          toast._t = setTimeout(() => {
            el.style.display = "none";
          }, 2800);
        }

        async function api(path, opts = {}) {
          const res = await fetch(path, {
            headers: {
              "Content-Type": "application/json",
              ...(opts.headers || {}),
            },
            ...opts,
          });
          const data = await res
            .json()
            .catch(() => ({ ok: false, error: "bad json" }));
          if (!res.ok || data.ok === false)
            throw new Error(data.error || res.statusText);
          return data;
        }

        async function refresh() {
          state.data = await api("/api/state");
          render();
        }

        function projectsFor(filt) {
          return (state.data.projects || [])
            .filter((p) => p.active !== "0" && p.filter === filt)
            .sort(
              (a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                a.title.localeCompare(b.title),
            );
        }

        function openTasks() {
          return (state.data.tasks || []).filter(
            (t) =>
              t.active !== "0" && t.kind !== "habitual" && t.emoji !== "✅",
          );
        }

        function attSrc(a) {
          const ref = (a.ref || "").replace(/\\/g, "/");
          if (!ref.startsWith("attachments/")) return "";
          return "/data/" + ref;
        }

        function thumbsHtml(parentType, parentId) {
          const imgs = (state.data.attachments || []).filter(
            (a) =>
              a.kind === "image" &&
              a.parent_type === parentType &&
              a.parent_id === parentId,
          );
          if (!imgs.length) return "";
          return `<div class="thumbs">${imgs
            .map((a) => {
              const src = attSrc(a);
              if (!src) return "";
              return `<button type="button" class="thumb" data-full="${esc(src)}" title="${esc(a.description || "")}"><img src="${esc(src)}" alt="" loading="lazy"/></button>`;
            })
            .join("")}</div>`;
        }

        function searchNeedle() {
          return (state.search || "").trim().toLowerCase();
        }

        function titleMatches(text) {
          const q = searchNeedle();
          if (!q) return true;
          return String(text || "")
            .toLowerCase()
            .includes(q);
        }

        function highlightTitle(text) {
          const q = searchNeedle();
          const raw = String(text ?? "");
          if (!q) return esc(raw);
          const lower = raw.toLowerCase();
          let i = 0;
          let out = "";
          let idx;
          while ((idx = lower.indexOf(q, i)) !== -1) {
            out += esc(raw.slice(i, idx));
            out += `<mark class="search-hit">${esc(raw.slice(idx, idx + q.length))}</mark>`;
            i = idx + q.length;
          }
          out += esc(raw.slice(i));
          return out || esc(raw);
        }

        function projectSearchPlan(p, pts) {
          const q = searchNeedle();
          const secs = sectionsFor(p.id);
          if (!q) {
            return {
              show: true,
              projectHit: false,
              pts,
              secs,
              listForSection: (sid) => pts.filter((t) => t.section_id === sid),
            };
          }
          const projectHit = String(p.title || "")
            .toLowerCase()
            .includes(q);
          const secHit = new Set(
            secs
              .filter((s) =>
                String(s.title || "")
                  .toLowerCase()
                  .includes(q),
              )
              .map((s) => s.id),
          );
          const taskHit = new Set(
            pts
              .filter((t) =>
                String(t.title || "")
                  .toLowerCase()
                  .includes(q),
              )
              .map((t) => t.id),
          );
          if (projectHit) {
            return {
              show: true,
              projectHit: true,
              pts,
              secs,
              listForSection: (sid) => pts.filter((t) => t.section_id === sid),
            };
          }
          if (!secHit.size && !taskHit.size) {
            return {
              show: false,
              projectHit: false,
              pts: [],
              secs: [],
              listForSection: () => [],
            };
          }
          const visibleSecs = secs.filter(
            (s) =>
              secHit.has(s.id) ||
              pts.some((t) => t.section_id === s.id && taskHit.has(t.id)),
          );
          const listForSection = (sid) => {
            const inSec = pts.filter((t) => t.section_id === sid);
            if (secHit.has(sid)) return inSec;
            return inSec.filter((t) => taskHit.has(t.id));
          };
          const visiblePts = pts.filter((t) => {
            if (taskHit.has(t.id)) return true;
            if (secHit.has(t.section_id)) return true;
            return false;
          });
          return {
            show: true,
            projectHit: false,
            pts: visiblePts,
            secs: visibleSecs,
            listForSection,
            orphans: pts.filter(
              (t) =>
                taskHit.has(t.id) &&
                (!t.section_id || !secs.some((s) => s.id === t.section_id)),
            ),
          };
        }

        function taskLi(t) {
          const due = (t.due_date || t.next_due || "").trim();
          return `<li class="task" data-emoji="${esc(t.emoji || "🔲")}" data-id="${esc(t.id)}">
      <span class="em">${esc(t.emoji || "🔲")}</span>
      <span class="title" data-act="edit-task">${highlightTitle(t.title)}</span>
      ${due ? `<span class="due">${esc(due)}</span>` : ""}
      <span class="row-actions">
        <button class="btn" data-act="emoji" data-key="done" title="Complete">✅</button>
        <button class="btn" data-act="emoji" data-key="important">⚡</button>
        <button class="btn" data-act="edit-task">Edit</button>
        <button class="btn" data-act="info-task">Info</button>
        <button class="btn" data-act="paste-att" data-ptype="task" data-pid="${esc(t.id)}">Img</button>
        <button class="btn danger" data-act="del-task">Del</button>
      </span>
      ${thumbsHtml("task", t.id)}
    </li>`;
        }

        function emojiLegendHtml(tasks) {
          const byEmoji = {};
          (tasks || []).forEach((t) => {
            const e = t.emoji || "🔲";
            byEmoji[e] = (byEmoji[e] || 0) + 1;
          });
          const entries = Object.entries(byEmoji).sort(
            (a, b) => b[1] - a[1] || a[0].localeCompare(b[0]),
          );
          if (!entries.length)
            return `<span class="emoji-legend"><span class="empty">none</span></span>`;
          return `<div class="emoji-legend">${entries
            .map(([e, n]) => {
              const k = EMOJI_KEY_BY[e] || "";
              const label = EMOJI_LABELS[e] || "other";
              const keyHint = k ? ` <kbd>⇧${k.toUpperCase()}</kbd>` : "";
              return `<button type="button" class="emoji-chip${state.emojiFilter === e ? " active" : ""}" data-emoji="${esc(e)}" data-key="${esc(k)}" title="Filter ${label}${k ? " (Shift+" + k.toUpperCase() + ")" : ""}">
        <span class="em">${esc(e)}</span>
        <span class="lbl">${esc(label)}</span>
        <span class="n">${n}</span>${keyHint}
      </button>`;
            })
            .join("")}</div>`;
        }

        function sectionHeadHtml(heading, tasks, filt) {
          const addBtn = filt
            ? `<button class="btn" data-act="add-project" data-f="${esc(filt)}">+ Project</button>`
            : "";
          return `<div class="section-head"><h2>${esc(heading)}</h2><div class="section-head-right">${emojiLegendHtml(tasks)}${addBtn}</div></div>`;
        }

        function sectionsFor(projectId) {
          return (state.data.sections || [])
            .filter((s) => s.project_id === projectId)
            .sort(
              (a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                a.title.localeCompare(b.title),
            );
        }

        function projectTasksHtml(p, pts, plan) {
          const pl = plan || projectSearchPlan(p, pts);
          const secs = pl.secs;
          const known = new Set(secs.map((s) => s.id));
          const sortTasks = (list) =>
            list.sort(
              (a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                a.title.localeCompare(b.title),
            );
          const parts = secs.map((s) => {
            const list = sortTasks(pl.listForSection(s.id).slice());
            const collapsed = state.collapsedSections.has(s.id)
              ? " collapsed"
              : "";
            return `<div class="task-section${collapsed}" data-id="${esc(s.id)}" data-sid="${esc(s.id)}">
        <div class="task-section-label">${highlightTitle(s.title)}</div>
        ${list.length ? `<ul class="task-list">${list.map(taskLi).join("")}</ul>` : ""}
      </div>`;
          });
          const orphans = (
            pl.orphans ||
            pts.filter((t) => !t.section_id || !known.has(t.section_id))
          ).slice();
          if (orphans.length) {
            const oid = `other:${p.id}`;
            const collapsed = state.collapsedSections.has(oid)
              ? " collapsed"
              : "";
            parts.push(`<div class="task-section${collapsed}" data-id="${esc(oid)}" data-sid="">
        <div class="task-section-label">Other</div>
        <ul class="task-list">${sortTasks(orphans).map(taskLi).join("")}</ul>
      </div>`);
          }
          if (!pl.pts.length && !searchNeedle()) {
            return (
              parts.join("") +
              '<p class="empty" style="padding:0 12px 10px">No open tasks</p>'
            );
          }
          if (!pl.pts.length && searchNeedle() && !parts.join("")) {
            return '<p class="empty" style="padding:0 12px 10px">No matching tasks</p>';
          }
          return parts.join("");
        }

        function sectionOptionsHtml(projectId, selectedId) {
          const secs = sectionsFor(projectId);
          if (!secs.length) return `<option value="">General</option>`;
          return secs
            .map(
              (s) =>
                `<option value="${esc(s.id)}" ${selectedId === s.id ? "selected" : ""}>${esc(s.title)}</option>`,
            )
            .join("");
        }

        function renderColumn(heading, filt) {
          const open = openTasks().filter((t) => t.filter === filt);
          const byProj = {};
          open.forEach((t) => {
            const pid = t.project_id || "";
            (byProj[pid] ||= []).push(t);
          });
          const blocks = [];
          let visibleOpen = [];
          for (const p of projectsFor(filt)) {
            const allPts = byProj[p.id] || [];
            const plan = projectSearchPlan(p, allPts);
            if (!plan.show) continue;
            const pts = plan.pts;
            visibleOpen = visibleOpen.concat(pts);
            const pThumbs = thumbsHtml("project", p.id);
            const openAttr = state.collapsedProjects.has(p.id) ? "" : " open";
            blocks.push(`<details class="project"${openAttr} data-id="${esc(p.id)}" data-pid="${esc(p.id)}">
        <summary><span class="proj-title">${highlightTitle(p.title)}</span><span class="proj-count">${pts.length}</span></summary>
        <div class="proj-actions row-actions">
          <button class="btn" data-act="add-task" data-pid="${esc(p.id)}" data-f="${esc(filt)}">+ Task</button>
          <button class="btn" data-act="add-section" data-pid="${esc(p.id)}">+ Section</button>
          <button class="btn" data-act="edit-project">Edit</button>
          <button class="btn" data-act="info-project">Info</button>
          <button class="btn" data-act="paste-att" data-ptype="project" data-pid="${esc(p.id)}">Img</button>
          <button class="btn danger" data-act="del-project">Del</button>
        </div>
        ${pThumbs}
        ${projectTasksHtml(p, allPts, plan)}
      </details>`);
          }
          const known = new Set(projectsFor(filt).map((p) => p.id));
          const orphans = open.filter((t) => {
            if (known.has(t.project_id)) return false;
            return !searchNeedle() || titleMatches(t.title);
          });
          if (orphans.length) {
            visibleOpen = visibleOpen.concat(orphans);
            blocks.push(`<details class="project" open><summary><span class="proj-title">Other</span><span class="proj-count">${orphans.length}</span></summary>
        <ul class="task-list">${orphans.map(taskLi).join("")}</ul></details>`);
          }
          const emptyMsg = searchNeedle()
            ? '<p class="empty">No matches</p>'
            : '<p class="empty">No projects</p>';
          return `<section class="column panel" id="sec-${esc(filt)}">${sectionHeadHtml(heading, searchNeedle() ? visibleOpen : open, filt)}${blocks.join("") || emptyMsg}</section>`;
        }

        function habitsHtml() {
          const q = searchNeedle();
          const habitual = (state.data.tasks || []).filter((t) => {
            if (t.active === "0" || t.kind !== "habitual") return false;
            if (!q) return true;
            if (
              String(t.title || "")
                .toLowerCase()
                .includes(q)
            )
              return true;
            const p = (state.data.projects || []).find(
              (x) => x.id === t.project_id,
            );
            return !!(
              p &&
              String(p.title || "")
                .toLowerCase()
                .includes(q)
            );
          });
          const by = {};
          habitual.forEach((t) => {
            const k = (t.recurrence || "").toLowerCase();
            (by[k] ||= []).push(t);
          });
          const keys = [
            ...RECURRENCE_ORDER.filter((k) => by[k]),
            ...Object.keys(by).filter((k) => !RECURRENCE_ORDER.includes(k)),
          ];
          const head = sectionHeadHtml("Habits", habitual, "habits");
          if (!keys.length)
            return `<div class="habits-wrap panel" id="sec-habits">${head}<p class="empty">${q ? "No matches" : "No habits"}</p></div>`;
          const today = new Date().toISOString().slice(0, 10);
          const cards = `<div class="habit-cards">${keys
            .map((k) => {
              const rows = by[k]
                .slice()
                .sort((a, b) =>
                  (a.next_due || a.due_date || "").localeCompare(
                    b.next_due || b.due_date || "",
                  ),
                );
              return `<article class="habit-card panel"><h2>${esc(RECURRENCE_LABELS[k] || k || "Other")}</h2>
        <ul class="habit-list">${rows
          .map((t) => {
            const due = (t.next_due || t.due_date || "").trim();
            const dueNow = !due || due <= today;
            return `<li class="habit-row${dueNow ? " due-now" : ""}" data-emoji="${esc(t.emoji || "🔲")}" data-id="${esc(t.id)}">
            <span class="em">${esc(t.emoji || "🔲")}</span>
            <span class="title" data-act="edit-task">${highlightTitle(t.title)}</span>
            ${due ? `<span class="due">${esc(due)}</span>` : ""}
            <span class="row-actions">
              <button class="btn" data-act="emoji" data-key="done" title="Advance">✅</button>
              <button class="btn" data-act="habit-to-personal" title="Send to Personal inbox (Shift+D)">→ Personal</button>
              <button class="btn" data-act="edit-task">Edit</button>
            </span>
          </li>`;
          })
          .join("")}</ul></article>`;
            })
            .join("")}</div>`;
          return `<div class="habits-wrap" id="sec-habits">${head}${cards}</div>`;
        }

        function renderDashboard() {
          const open = openTasks();
          const personal = open.filter((t) => t.filter === "personal").length;
          const work = open.filter((t) => t.filter === "work").length;
          const today = new Date().toISOString().slice(0, 10);
          const habitsDue = (state.data.tasks || []).filter(
            (t) =>
              t.active !== "0" &&
              t.kind === "habitual" &&
              (!(t.next_due || t.due_date) ||
                (t.next_due || t.due_date) <= today),

          $("#strip").innerHTML = `
      <div class="kpi"><div class="lbl">Personal</div><div class="val">${personal}</div></div>
      <div class="kpi"><div class="lbl">Work</div><div class="val">${work}</div></div>
      <div class="kpi"><div class="lbl">Habits due</div><div class="val">${habitsDue}</div></div>
      <span class="sub" id="emojiFilterLbl"></span>`;
          $("#view").innerHTML = `
      <div class="top-row">${renderColumn("Personal", "personal")}${renderColumn("Work", "work")}</div>
      ${habitsHtml()}`;
          applyEmojiFilter(state.emojiFilter);
          applySectionFocus(state.sectionFocus);
          updateFocusLbl();
          applySelection(false);
        }

          const prev = state.importPreview;
          const src =

          const sources = IMPORT_SOURCES.map((s) => {

            return `<button type="button" class="import-source${selected}" data-act="import-select" data-source="${esc(s.id)}">
        <kbd class="key">${esc(s.key)}</kbd>
        <span class="meta"><strong>${esc(s.title)}</strong><span class="sub">${esc(s.blurb)}</span></span>
      </button>`;
          }).join("");
          $("#view").innerHTML = `<div class="panel">
      <h2 class="section-title">Import</h2>
      <p class="sub">Choose a source (<kbd>1</kbd>…), then preview / confirm.</p>
      <div class="import-sources">${sources}</div>

        <button class="btn" data-act="goto-dash" title="Home (Esc)">Home <kbd>Esc</kbd></button>
      </div>
      <pre class="sub" style="white-space:pre-wrap">${prev ? esc(JSON.stringify(prev.counts || prev, null, 2)) : "No preview yet"}</pre>
      ${prev?.errors?.length ? `<p class="empty">${esc(prev.errors.join(" · "))}</p>` : ""}

        }

        async function runImportPreview() {
          if (state.importSource !== "task_pack") {
            toast("Select an import source");
            return;
          }
          state.importPreview = await api("/api/import/preview", {
            method: "POST",
            body: "{}",
          });
          toast("Preview ready");
          render();
        }

        async function runImportCommit() {
          if (!state.importPreview?.ok) {
            toast("Preview first");
            return;
          }
          const r = await api("/api/import/commit", {
            method: "POST",
            body: JSON.stringify(state.importPreview || {}),
          });
          toast(`Imported +${r.added?.tasks || 0} tasks`);
          state.importPreview = null;
          state.view = "dashboard";
          await refresh();
        }

        async function handleImportKey(ch) {
          const src = IMPORT_SOURCES.find((s) => s.key === ch);
          if (src) {
            state.importSource = src.id;
            state.importPreview = null;
            toast(src.title + " selected");
            render();
            return;
          }
          if (ch === "p") {
            await runImportPreview();
            return;
          }
          if (ch === "c") {
            await runImportCommit();
            return;
          }
        }

          $("#modalHost").onclick = (e) => {

            )
