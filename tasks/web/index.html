<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #121212;
        --panel: #1e1e1e;
        --text: #f2f2f2;
        --muted: #a0a0a0;
        --gold: #f1c40f;
        --line: #333;
        --due: #e67e22;
        --danger: #e74c3c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Segoe UI,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 16px 24px 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 24px 12px;
        align-items: center;
      }
      .btn,
      button.btn {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      .btn:hover,
      .btn.active {
        border-color: var(--gold);
        color: var(--gold);
      }
      .btn.danger:hover {
        border-color: var(--danger);
        color: var(--danger);
      }
      .btn.tertiary,
      a.btn.tertiary {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
        text-decoration: none;
        padding: 6px 10px;
      }
      .btn.tertiary:hover,
      a.btn.tertiary:hover {
        border-color: var(--line);
        color: var(--gold);
      }
      kbd {
        font: inherit;
        font-size: 11px;
        color: var(--gold);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        background: #252528;
      }
      #toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #252528;
        border: 1px solid var(--gold);
        padding: 10px 14px;
        border-radius: 8px;
        display: none;
        z-index: 2000;
        max-width: 360px;
      }
      #view {
        padding: 8px 24px 40px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .top-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 900px) {
        .top-row {
          grid-template-columns: 1fr;
        }
      }
      .column h2,
      .section-title {
        margin: 0 0 12px;
        font-size: 18px;
        color: var(--gold);
      }
      .project {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 8px;
        background: #252528;
        position: relative;
        z-index: 0;
      }
      .project:hover,
      .project.kb-selected {
        z-index: 3;
      }
      .project summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        user-select: none;
      }
      .project summary::-webkit-details-marker {
        display: none;
      }
      .project summary::before {
        content: "▸";
        color: var(--gold);
        margin-right: 8px;
        font-size: 12px;
      }
      .project[open] summary::before {
        content: "▾";
      }
      .proj-title {
        font-weight: 600;
        flex: 1;
      }
      .proj-count {
        color: var(--muted);
        font-size: 12px;
        background: #1a1a1c;
        border-radius: 999px;
        padding: 2px 8px;
      }
      .task-list,
      .habit-list,
      .plain-list {
        list-style: none;
        margin: 0;
        padding: 0 12px 10px;
      }
      .task,
      .plain-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .task .em {
        flex: 0 0 auto;
        min-width: 1.15em;
        text-align: center;
      }
      .task .em:empty::before {
        content: "";
        display: inline-block;
        width: 0.4em;
      }
      .task.is-cut {
        opacity: 0.45;
      }
      .task.is-cut .title {
        text-decoration: line-through;
        text-decoration-color: rgba(200, 200, 200, 0.5);
      }
      .task .info-tag {
        flex: 0 0 auto;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      .plain-row .title.is-link {
        color: var(--gold);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .task .title,
      .plain-row .title {
        flex: 1;
        min-width: 120px;
        cursor: pointer;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .task {
        position: relative;
        z-index: 0;
      }
      .due {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .task.due-now .due {
        color: var(--due);
      }
      .row-actions {
        display: none;
        flex-wrap: wrap;
        gap: 3px;
        width: 100%;
        margin-top: 2px;
        padding-left: 28px;
      }
      /* Compact translucent hover menus — keep title readable underneath */
      .task > .row-actions,
      .plain-row .row-actions,
      .proj-actions,
      .task-section-label .sec-actions {
        background: rgba(26, 26, 28, 0.72);
        border: 1px solid rgba(74, 74, 80, 0.55);
        border-radius: 5px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 2px 4px;
        gap: 2px;
      }
      .task > .row-actions .btn,
      .plain-row .row-actions .btn,
      .proj-actions .btn,
      .task-section-label .sec-actions .btn {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        line-height: 1.25;
        background: rgba(37, 37, 40, 0.55);
        min-width: 1.4em;
        min-height: 1.4em;
      }
      .emoji-chip .em-none {
        display: inline-block;
        min-width: 0.9em;
        min-height: 0.9em;
      }
      /* Overlay above the row so the title stays readable */
      .task > .row-actions {
        display: flex;
        position: absolute;
        right: 0;
        top: 0;
        transform: translateY(calc(-100% - 4px));
        width: auto;
        max-width: min(100%, 360px);
        margin: 0;
        padding-left: 4px;
        flex-wrap: wrap;
        justify-content: flex-end;
        z-index: 3;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .task.kb-selected > .row-actions,
      .task:hover > .row-actions {
        display: flex;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .task:hover,
      .task.kb-selected {
        z-index: 5;
      }
      .plain-row {
        position: relative;
        z-index: 0;
        flex-direction: column;
        align-items: stretch;
        flex-wrap: nowrap;
      }
      .plain-row:hover,
      .plain-row.kb-selected {
        z-index: 2;
      }
      .plain-row-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
      }
      .plain-row-head .title {
        flex: 1;
        min-width: 0;
      }
      .plain-row .thumbs {
        flex: 0 0 auto;
        width: 100%;
        padding-left: 0;
      }
      .plain-row .row-actions {
        display: none;
        position: static;
        transform: none;
        flex: 0 0 auto;
        align-self: flex-start;
        width: auto;
        margin: 0;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .plain-row:hover .row-actions,
      .plain-row.kb-selected .row-actions {
        display: flex;
      }
      .proj-actions {
        display: flex;
        position: absolute;
        right: 8px;
        top: 8px;
        z-index: 4;
        width: auto;
        max-width: min(100%, 360px);
        margin: 0;
        flex-wrap: wrap;
        justify-content: flex-end;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      details.project.kb-selected > .proj-actions,
      details.project:hover > .proj-actions {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .task-section {
        padding: 0 0 6px;
      }
      .task-section.collapsed > .task-list {
        display: none;
      }
      .task-section-label {
        padding: 4px 12px 2px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.85;
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .task-section-label .sec-title {
        min-width: 0;
        flex: 1 1 auto;
      }
      .task-section-label .sec-actions {
        display: none;
        flex: 0 0 auto;
        margin-left: auto;
        align-items: center;
      }
      .task-section:not(.is-general):hover > .task-section-label .sec-actions,
      .task-section:not(.is-general).kb-selected
        > .task-section-label
        .sec-actions {
        display: inline-flex;
      }
      .task-section-label::before {
        content: "▾";
        font-size: 9px;
        opacity: 0.7;
        width: 10px;
      }
      .task-section.collapsed > .task-section-label::before {
        content: "▸";
      }
      /* Default bucket — quieter label at the start; full frame around all General tasks */
      .task-section.is-general {
        margin: 4px 8px 10px;
        padding: 0 0 4px;
        border: 1px solid #4a4a50;
        border-radius: 6px;
        background: transparent;
      }
      .task-section.is-general > .task-section-label {
        text-transform: none;
        letter-spacing: 0.02em;
        font-weight: 400;
        font-size: 11px;
        opacity: 0.55;
        color: var(--muted);
        border-bottom: 1px solid #4a4a50;
        margin-bottom: 0;
      }
      .task-section.is-general > .task-list {
        padding-left: 12px;
        padding-right: 12px;
      }
      .task-section.is-general > .task-section-label::before {
        content: "–";
        opacity: 0.5;
      }
      .task-section.is-general.collapsed > .task-section-label::before {
        content: "+";
      }
      .task-section.is-general.collapsed > .task-section-label {
        border-bottom: none;
      }
      .task-section:not(.is-general) > .task-section-label {
        color: #c8c8c8;
        opacity: 0.9;
        font-weight: 600;
      }
      .task-section.kb-selected > .task-section-label {
        color: var(--gold);
        opacity: 1;
      }
      .task-section.is-general.kb-selected {
        border-color: var(--gold);
      }
      .task-section.is-general.kb-selected > .task-section-label {
        border-bottom-color: var(--gold);
      }
      .task-section.emoji-hidden {
        display: none !important;
      }
      .thumbs {
        flex: 1 1 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px 0 2px 28px;
      }
      .project > .thumbs {
        padding: 0 12px 10px;
      }
      .thumb {
        display: block;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #1a1a1c;
        cursor: zoom-in;
        overflow: hidden;
        width: 72px;
        height: 54px;
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .emoji-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        align-items: center;
        justify-content: flex-end;
      }
      .emoji-chip {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        font-size: 11px;
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
        line-height: 1.3;
        opacity: 0.75;
      }
      .emoji-chip .em {
        color: var(--muted);
        font-size: 12px;
      }
      .emoji-chip .lbl {
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: lowercase;
      }
      .emoji-chip .n {
        color: var(--muted);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }
      .emoji-chip kbd {
        display: none;
      }
      .emoji-chip.active,
      .emoji-chip:hover {
        opacity: 1;
        color: var(--text);
      }
      .emoji-chip.active .em,
      .emoji-chip:hover .em,
      .emoji-chip.active .lbl,
      .emoji-chip:hover .lbl,
      .emoji-chip.active .n,
      .emoji-chip:hover .n {
        color: var(--gold);
      }
      .section-head-right .btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 11px;
        padding: 0 4px;
        opacity: 0.7;
      }
      .section-head-right .btn:hover {
        color: var(--gold);
        opacity: 1;
        border-color: transparent;
      }
      .section-head h2,
      .section-head .section-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        flex: 0 1 auto;
        letter-spacing: 0.01em;
      }
      .task.emoji-hidden,
      .project.emoji-hidden {
        display: none !important;
      }
      .section-hidden {
        display: none !important;
      }
      .top-row.section-solo {
        grid-template-columns: 1fr;
      }
      /* Solo category: CSS grid stays stable when cards grow (multi-column reflows/blinks).
         Stretch items so every card in a row matches the tallest card in that row. */
      .column.bento {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 14px;
        align-items: stretch;
      }
      .column.bento > .section-head,
      .column.bento > .empty {
        grid-column: 1 / -1;
        margin-bottom: 0;
        align-self: start;
      }
      .column.bento > .project {
        margin: 0;
        width: auto;
        max-width: 100%;
        min-width: 0;
        align-self: stretch;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .column.bento > .project > summary {
        flex: 0 0 auto;
      }
      @media (min-width: 1400px) {
        .column.bento {
          grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        }
      }
      .kb-selected,
      details.project.kb-selected > summary,
      .task.kb-selected,
      .plain-row.kb-selected,
      .task-section.kb-selected > .task-section-label {
        outline: 2px solid var(--gold);
        outline-offset: -2px;
        background: rgba(241, 196, 15, 0.08);
      }
      details.project.kb-selected > summary {
        border-radius: 8px 8px 0 0;
      }
      .section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 12px;
        margin: 0 0 12px;
      }
      .section-head-right {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
      }
      .habits-column {
        margin-top: 20px;
      }
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #globalSearch {
        width: min(280px, 42vw);
        background: #252528;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
      }
      #globalSearch:focus {
        outline: none;
        border-color: var(--gold);
      }
      #globalSearch::placeholder {
        color: var(--muted);
      }
      mark.search-hit {
        background: rgba(241, 196, 15, 0.35);
        color: var(--text);
        border-radius: 2px;
        padding: 0 1px;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        z-index: 2600;
        background: rgba(0, 0, 0, 0.82);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        cursor: zoom-out;
      }
      #lightbox[hidden] {
        display: none;
      }
      #lightbox img {
        max-width: min(96vw, 1200px);
        max-height: 92vh;
        border-radius: 8px;
        cursor: default;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 1500;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        width: min(520px, 100%);
        max-height: 90vh;
        overflow: auto;
      }
      .modal.modal-info {
        width: 60vw;
        max-width: 60vw;
      }
      .modal h3 {
        margin: 0 0 12px;
        color: var(--gold);
      }
      .modal label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 4px;
      }
      .modal input,
      .modal select,
      .modal textarea {
        width: 100%;
        background: #252528;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 8px;
        font: inherit;
      }
      .modal textarea {
        min-height: 120px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .inline-create-row {
        align-items: center;
      }
      .inline-create-row input[type="text"] {
        flex: 1;
        min-width: 80px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--gold);
        border-radius: 0;
        color: var(--text);
        padding: 2px 4px;
        font: inherit;
        font-size: 13px;
      }
      .inline-create-row input[type="text"]:focus {
        outline: none;
      }
      .task-section.is-inline-create > .task-section-label {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 600;
      }
      .task-section.is-inline-create input[type="text"],
      .project.is-inline-create input[type="text"] {
        flex: 1;
        min-width: 80px;
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--gold);
        color: var(--text);
        padding: 2px 4px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
      }
      .task-section.is-inline-create input[type="text"]:focus,
      .project.is-inline-create input[type="text"]:focus {
        outline: none;
      }
      @keyframes just-added-flash {
        0% {
          box-shadow: 0 0 0 2px var(--gold);
          background: rgba(241, 196, 15, 0.18);
        }
        100% {
          box-shadow: none;
        }
      }
      .just-added {
        animation: just-added-flash 1.2s ease;
      }
      .modal .field-row[hidden] {
        display: none !important;
      }
      .crumb {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 10px;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Tasks</h1>
        <div class="sub" id="hdrSub">Loading…</div>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <input
            type="search"
            id="globalSearch"
            placeholder="Search…"
            title="Search (Alt+S)"
            autocomplete="off"
            spellcheck="false"
          />
          <a
            class="btn tertiary"
            href="https://github.com/duducm2/my-notes/blob/main/main/punctual.md"
            target="_blank"
            rel="noopener noreferrer"
            title="Personal tasks Markdown on GitHub (main/punctual.md)"
            >GitHub MD</a
          >
        </div>
      </div>
    </header>
    <div id="view"></div>
    <div id="toast"></div>
    <div id="lightbox" hidden><img src="" alt="" /></div>
    <div id="modalHost"></div>
    <script>
      (() => {
        const RECURRENCE_ORDER = [
          "daily",
          "weekly",
          "monthly",
          "quarterly",
          "biannual",
          "yearly",
          "every_2y",
          "every_3y",
          "every_5y",
          "every_10y",
        ];
        const RECURRENCE_LABELS = {
          daily: "Daily",
          weekly: "Weekly",
          monthly: "Monthly",
          quarterly: "Quarterly",
          biannual: "Bi-yearly",
          yearly: "Yearly",
          every_2y: "Every 2 years",
          every_3y: "Every 3 years",
          every_5y: "Every 5 years",
          every_10y: "Every 10 years",
          "": "Other",
        };
        const EMOJI_KEYS = { t: "⚡", q: "⏳", g: "🔲", u: "❓", o: "" };
        const EMOJI_API_KEYS = {
          t: "important",
          q: "waiting",
          g: "general",
          u: "doubt",
          o: "none",
        };
        const EMOJI_LABELS = {
          "⚡": "important",
          "⏳": "waiting",
          "🔲": "general",
          "❓": "doubt",
          "✅": "done",
          "": "none",
        };
        const EMOJI_KEY_BY = {
          "⚡": "t",
          "⏳": "q",
          "🔲": "g",
          "❓": "u",
          "": "o",
        };
        const state = {
          data: null,
          filter: "work",
          view: "dashboard",
          projectId: "",
          taskId: "",
          emojiFilter: null, // null = off; "" = none; else emoji char
          sectionFocus: "", // "" | work | personal | habits
          search: "",
          pwSide: "personal", // last side for Personal/Work first-item toggle
          inlineCreate: null, // { project_id, section_id, filter, kind }
          sel: null, // { kind: "project"|"section"|"task"|"habit", id }
          collapsedProjects: new Set(),
          collapsedSections: new Set(),
          lastEscAt: 0,
          infoCtx: null, // { parentType, parentId }
          infoUi: "", // "" | list | form
          infoSelId: "",
          taskClipboard: null, // { ...fields, cutFromId? } for Ctrl+C / Ctrl+X / Ctrl+V
        };
        // Same window as AI_QD_DOUBLE_TAP_MS / ZMK tap-dance (Utils/ai_quick_download.ahk).
        const ESC_DOUBLE_TAP_MS = 400;
        let taskIdsWithInfo = new Set();

        function rebuildTaskIdsWithInfo() {
          const ids = new Set();
          for (const i of state.data?.info_points || []) {
            if ((i.parent_type || "") === "task" && i.parent_id)
              ids.add(i.parent_id);
          }
          taskIdsWithInfo = ids;
        }

        const $ = (sel) => document.querySelector(sel);
        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );

        function trimLinkJunk(s) {
          return String(s || "")
            .trim()
            .replace(/[),.;]+$/g, "");
        }

        function classifyHyperlink(raw) {
          const s = trimLinkJunk(raw);
          if (!s) return null;
          const lower = s.toLowerCase();
          if (
            lower.startsWith("javascript:") ||
            lower.startsWith("vbscript:") ||
            lower.startsWith("data:")
          )
            return null;
          if (/^https?:\/\//i.test(s)) return { kind: "url", href: s };
          if (/^file:/i.test(s)) return { kind: "file", href: s };
          if (/^[A-Za-z]:[\\/]/.test(s) || s.startsWith("\\\\"))
            return { kind: "file", href: s };
          return null;
        }

        function firstHyperlinkInText(text) {
          const s = String(text || "").trim();
          if (!s) return null;
          const md = s.match(/\[([^\]]*)\]\(([^)\s]+)\)/);
          if (md) {
            const hit = classifyHyperlink(md[2]);
            if (hit) return hit;
          }
          const whole = classifyHyperlink(s);
          if (whole) return whole;
          const url = s.match(/https?:\/\/[^\s<>"']+/i);
          if (url) return classifyHyperlink(url[0]);
          const fileUri = s.match(/file:\/\/\/[^\s<>"']+/i);
          if (fileUri) return classifyHyperlink(fileUri[0]);
          const win = s.match(/(?:[A-Za-z]:\\|\\\\)[^\s<>"']+/);
          if (win) return classifyHyperlink(win[0]);
          return null;
        }

        function infoText(info) {
          const t = String(info?.title || "").trim();
          const b = String(info?.body || "").trim();
          if (t && b && t !== b) return t + "\n" + b;
          return t || b;
        }

        async function copyInfoById(id) {
          const row = (state.data.info_points || []).find((i) => i.id === id);
          const text = infoText(row);
          if (!text) {
            toast("Nothing to copy");
            return false;
          }
          try {
            await navigator.clipboard.writeText(text);
            toast("Copied");
            return true;
          } catch (err) {
            toast(err.message || "Could not copy");
            return false;
          }
        }

        async function copySelectedInfo() {
          if (!state.infoSelId) {
            toast("Select an info point first");
            return false;
          }
          return copyInfoById(state.infoSelId);
        }

        function infoHyperlink(info) {
          if (!info) return null;
          const fromText = firstHyperlinkInText(infoText(info));
          if (fromText) return fromText;
          const att = (state.data.attachments || []).find(
            (a) =>
              a.parent_type === "info" &&
              a.parent_id === info.id &&
              (a.kind || "") === "url" &&
              (a.ref || "").trim(),
          );
          return att ? firstHyperlinkInText(att.ref) : null;
        }

        async function openHyperlink(hit) {
          if (!hit?.href) return;
          try {
            await api("/api/open", {
              method: "POST",
              body: JSON.stringify({ target: hit.href }),
            });
          } catch (err) {
            if (hit.kind === "url") {
              window.open(hit.href, "_blank", "noopener,noreferrer");
              return;
            }
            toast(err.message || String(err));
          }
        }

        function toast(msg) {
          const el = $("#toast");
          el.textContent = msg;
          el.style.display = "block";
          clearTimeout(toast._t);
          toast._t = setTimeout(() => {
            el.style.display = "none";
          }, 2800);
        }

        async function api(path, opts = {}) {
          const res = await fetch(path, {
            headers: {
              "Content-Type": "application/json",
              ...(opts.headers || {}),
            },
            ...opts,
          });
          const data = await res
            .json()
            .catch(() => ({ ok: false, error: "bad json" }));
          if (!res.ok || data.ok === false)
            throw new Error(data.error || res.statusText);
          return data;
        }

        async function refresh() {
          state.data = await api("/api/state");
          render();
        }

        function projectsFor(filt) {
          return (state.data.projects || [])
            .filter((p) => p.active !== "0" && p.filter === filt)
            .sort(
              (a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                a.title.localeCompare(b.title),
            );
        }

        function openTasks() {
          return (state.data.tasks || []).filter(
            (t) =>
              t.active !== "0" && t.kind !== "habitual" && t.emoji !== "✅",
          );
        }

        function attSrc(a) {
          const ref = (a.ref || "").replace(/\\/g, "/");
          if (!ref.startsWith("attachments/")) return "";
          return "/data/" + ref;
        }

        function thumbsHtml(parentType, parentId) {
          const imgs = imageAttachmentsFor(parentType, parentId);
          if (!imgs.length) return "";
          return `<div class="thumbs">${imgs
            .map((a) => {
              const src = attSrc(a);
              if (!src) return "";
              return `<button type="button" class="thumb" data-full="${esc(src)}" title="${esc(a.description || "")}"><img src="${esc(src)}" alt="" loading="lazy"/></button>`;
            })
            .join("")}</div>`;
        }

        function imageAttachmentsFor(parentType, parentId) {
          const atts = state.data.attachments || [];
          const direct = atts.filter(
            (a) =>
              a.kind === "image" &&
              a.parent_type === parentType &&
              a.parent_id === parentId,
          );
          if (parentType === "info") return direct;
          const infoIds = new Set(
            (state.data.info_points || [])
              .filter(
                (i) => i.parent_type === parentType && i.parent_id === parentId,
              )
              .map((i) => i.id),
          );
          const nested = atts.filter(
            (a) =>
              a.kind === "image" &&
              a.parent_type === "info" &&
              infoIds.has(a.parent_id),
          );
          const seen = new Set();
          const out = [];
          for (const a of direct.concat(nested)) {
            if (!a.id || seen.has(a.id)) continue;
            seen.add(a.id);
            out.push(a);
          }
          return out;
        }

        function searchNeedle() {
          return (state.search || "").trim().toLowerCase();
        }

        function titleMatches(text) {
          const q = searchNeedle();
          if (!q) return true;
          return String(text || "")
            .toLowerCase()
            .includes(q);
        }

        function highlightTitle(text) {
          const q = searchNeedle();
          const raw = String(text ?? "");
          if (!q) return esc(raw);
          const lower = raw.toLowerCase();
          let i = 0;
          let out = "";
          let idx;
          while ((idx = lower.indexOf(q, i)) !== -1) {
            out += esc(raw.slice(i, idx));
            out += `<mark class="search-hit">${esc(raw.slice(idx, idx + q.length))}</mark>`;
            i = idx + q.length;
          }
          out += esc(raw.slice(i));
          return out || esc(raw);
        }

        function projectSearchPlan(p, pts) {
          const q = searchNeedle();
          const secs = sectionsFor(p.id);
          if (!q) {
            return {
              show: true,
              projectHit: false,
              pts,
              secs,
              listForSection: (sid) => pts.filter((t) => t.section_id === sid),
            };
          }
          const projectHit = String(p.title || "")
            .toLowerCase()
            .includes(q);
          const secHit = new Set(
            secs
              .filter((s) =>
                String(s.title || "")
                  .toLowerCase()
                  .includes(q),
              )
              .map((s) => s.id),
          );
          const taskHit = new Set(
            pts
              .filter((t) =>
                String(t.title || "")
                  .toLowerCase()
                  .includes(q),
              )
              .map((t) => t.id),
          );
          if (projectHit) {
            return {
              show: true,
              projectHit: true,
              pts,
              secs,
              listForSection: (sid) => pts.filter((t) => t.section_id === sid),
            };
          }
          if (!secHit.size && !taskHit.size) {
            return {
              show: false,
              projectHit: false,
              pts: [],
              secs: [],
              listForSection: () => [],
            };
          }
          const visibleSecs = secs.filter(
            (s) =>
              secHit.has(s.id) ||
              pts.some((t) => t.section_id === s.id && taskHit.has(t.id)),
          );
          const listForSection = (sid) => {
            const inSec = pts.filter((t) => t.section_id === sid);
            if (secHit.has(sid)) return inSec;
            return inSec.filter((t) => taskHit.has(t.id));
          };
          const visiblePts = pts.filter((t) => {
            if (taskHit.has(t.id)) return true;
            if (secHit.has(t.section_id)) return true;
            return false;
          });
          return {
            show: true,
            projectHit: false,
            pts: visiblePts,
            secs: visibleSecs,
            listForSection,
            orphans: pts.filter(
              (t) =>
                taskHit.has(t.id) &&
                (!t.section_id || !secs.some((s) => s.id === t.section_id)),
            ),
          };
        }

        function taskEmoji(t) {
          const em = t?.emoji;
          if (em === undefined || em === null) return "🔲";
          // legacy: Shift+O before server restart saved the word "none"
          if (em === "none" || em === "None") return "";
          return em;
        }

        function taskLi(t) {
          const isHabit = t.kind === "habitual";
          const due = (
            isHabit
              ? t.next_due || t.due_date || ""
              : t.due_date || t.next_due || ""
          ).trim();
          const today = new Date().toISOString().slice(0, 10);
          const dueNow = isHabit && (!due || due <= today);
          const hasInfo = taskIdsWithInfo.has(t.id);
          const infoTag = hasInfo
            ? `<span class="info-tag" data-act="info-task" title="Has info points">ℹ️</span>`
            : "";
          const actions = isHabit
            ? `<button class="btn" data-act="copy-task" title="Copy (Ctrl+C)">Copy</button>
        <button class="btn" data-act="cut-task" title="Cut (Ctrl+X)">Cut</button>
        <button class="btn" data-act="habit-to-personal" title="Send to Personal inbox (Shift+D)">→ Personal</button>
        <button class="btn" data-act="edit-task">Edit</button>
        <button class="btn" data-act="info-task">Info</button>
        <button class="btn" data-act="paste-att" data-ptype="task" data-pid="${esc(t.id)}">Img</button>
        <button class="btn danger" data-act="del-task">Del</button>`
            : `<button class="btn" data-act="copy-task" title="Copy (Ctrl+C)">Copy</button>
        <button class="btn" data-act="cut-task" title="Cut (Ctrl+X)">Cut</button>
        <button class="btn" data-act="emoji" data-key="done" title="Complete">✅</button>
        <button class="btn" data-act="emoji" data-key="important">⚡</button>
        <button class="btn" data-act="emoji" data-key="waiting" title="Waiting (Shift+Q)">⏳</button>
        <button class="btn" data-act="edit-task">Edit</button>
        <button class="btn" data-act="info-task">Info</button>
        <button class="btn" data-act="paste-att" data-ptype="task" data-pid="${esc(t.id)}">Img</button>
        <button class="btn danger" data-act="del-task">Del</button>`;
          const cutClass =
            state.taskClipboard?.cutFromId === t.id ? " is-cut" : "";
          const em = taskEmoji(t);
          return `<li class="task${dueNow ? " due-now" : ""}${cutClass}" data-emoji="${esc(em)}" data-id="${esc(t.id)}" data-kind="${esc(t.kind || "punctual")}"${hasInfo ? ' data-has-info="1"' : ""}>
      <span class="em">${esc(em)}</span>
      ${infoTag}
      <span class="title" data-act="edit-task">${highlightTitle(t.title)}</span>
      ${due ? `<span class="due">${esc(due)}</span>` : ""}
      <span class="row-actions">${actions}</span>
      ${thumbsHtml("task", t.id)}
    </li>`;
        }

        function emojiLegendHtml(tasks) {
          const byEmoji = {};
          (tasks || []).forEach((t) => {
            const e = taskEmoji(t);
            byEmoji[e] = (byEmoji[e] || 0) + 1;
          });
          const entries = Object.entries(byEmoji).sort(
            (a, b) => b[1] - a[1] || a[0].localeCompare(b[0]),
          );
          if (!entries.length) return `<span class="emoji-legend"></span>`;
          return `<div class="emoji-legend">${entries
            .map(([e, n]) => {
              const k = EMOJI_KEY_BY[e] || "";
              const label = EMOJI_LABELS[e] || "other";
              const keyHint = k ? ` <kbd>⇧${k.toUpperCase()}</kbd>` : "";
              const tipLabel = e ? label : "no emoji";
              const emHtml = e
                ? `<span class="em">${esc(e)}</span>`
                : `<span class="em em-none" aria-hidden="true"></span>`;
              return `<button type="button" class="emoji-chip${state.emojiFilter === e ? " active" : ""}" data-emoji="${esc(e)}" data-key="${esc(k)}" title="${k ? "Shift+" + k.toUpperCase() + ": tag selected task, or filter by " + tipLabel : "Filter " + tipLabel}">
        ${emHtml}
        ${e ? `<span class="lbl">${esc(label)}</span>` : ""}
        <span class="n">${n}</span>${keyHint}
      </button>`;
            })
            .join("")}</div>`;
        }

        function sectionHeadHtml(heading, tasks, filt) {
          const addBtn = filt
            ? `<button class="btn" data-act="add-project" data-f="${esc(filt)}">+ Project</button>`
            : "";
          return `<div class="section-head"><h2>${esc(heading)}</h2><div class="section-head-right">${emojiLegendHtml(tasks)}${addBtn}</div></div>`;
        }

        function sectionsFor(projectId) {
          return (state.data.sections || [])
            .filter((s) => s.project_id === projectId)
            .sort(
              (a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                a.title.localeCompare(b.title),
            );
        }

        function projectTasksHtml(p, pts, plan) {
          const pl = plan || projectSearchPlan(p, pts);
          const secs = pl.secs;
          const known = new Set(secs.map((s) => s.id));
          const sortTasks = (list) =>
            list.sort(
              (a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                a.title.localeCompare(b.title),
            );
          const parts = secs.map((s) => {
            const list = sortTasks(pl.listForSection(s.id).slice());
            const isGeneral =
              (s.title || "").trim().toLowerCase() === "general";
            const collapsed = state.collapsedSections.has(s.id)
              ? " collapsed"
              : "";
            const genClass = isGeneral ? " is-general" : "";
            const create = inlineCreateRowHtml(p.id, s.id);
            const items = create + list.map(taskLi).join("");
            const secActs = isGeneral
              ? ""
              : `<span class="sec-actions">
          <button type="button" class="btn" data-act="edit-section">Edit</button>
          <button type="button" class="btn danger" data-act="del-section">Del</button>
        </span>`;
            return `<div class="task-section${collapsed}${genClass}" data-id="${esc(s.id)}" data-sid="${esc(s.id)}">
        <div class="task-section-label"><span class="sec-title">${highlightTitle(s.title)}</span>${secActs}</div>
        ${items ? `<ul class="task-list">${items}</ul>` : ""}
      </div>`;
          });
          const orphans = (
            pl.orphans ||
            pts.filter((t) => !t.section_id || !known.has(t.section_id))
          ).slice();
          if (orphans.length) {
            const oid = `other:${p.id}`;
            const collapsed = state.collapsedSections.has(oid)
              ? " collapsed"
              : "";
            parts.push(`<div class="task-section${collapsed}" data-id="${esc(oid)}" data-sid="">
        <div class="task-section-label">Other</div>
        <ul class="task-list">${sortTasks(orphans).map(taskLi).join("")}</ul>
      </div>`);
          }
          parts.push(inlineSectionHtml(p.id));
          if (
            !pl.pts.length &&
            !searchNeedle() &&
            !inlineCreateInProject(p.id)
          ) {
            return (
              parts.join("") +
              '<p class="empty" style="padding:0 12px 10px">No open tasks</p>'
            );
          }
          if (!pl.pts.length && searchNeedle() && !parts.join("")) {
            return '<p class="empty" style="padding:0 12px 10px">No matching tasks</p>';
          }
          return parts.join("");
        }

        function sectionOptionsHtml(projectId, selectedId) {
          const secs = sectionsFor(projectId);
          if (!secs.length) return `<option value="">General</option>`;
          return secs
            .map(
              (s) =>
                `<option value="${esc(s.id)}" ${selectedId === s.id ? "selected" : ""}>${esc(s.title)}</option>`,
            )
            .join("");
        }

        function focusColumnClass(filt) {
          const f = state.sectionFocus || "";
          const parts = ["column", "panel"];
          if (filt === "habits") parts.push("habits-column");
          if (f && f !== filt) parts.push("section-hidden");
          if (f === filt) parts.push("bento");
          return parts.join(" ");
        }

        function focusTopRowClass() {
          const f = state.sectionFocus || "";
          const parts = ["top-row"];
          if (f === "habits") parts.push("section-hidden");
          if (f === "work" || f === "personal") parts.push("section-solo");
          return parts.join(" ");
        }

        function renderColumn(heading, filt) {
          const open = openTasks().filter((t) => t.filter === filt);
          const byProj = {};
          open.forEach((t) => {
            const pid = t.project_id || "";
            (byProj[pid] ||= []).push(t);
          });
          const blocks = [];
          let visibleOpen = [];
          for (const p of projectsFor(filt)) {
            const allPts = byProj[p.id] || [];
            const plan = projectSearchPlan(p, allPts);
            if (!plan.show) continue;
            const pts = plan.pts;
            visibleOpen = visibleOpen.concat(pts);
            const pThumbs = thumbsHtml("project", p.id);
            const openAttr = state.collapsedProjects.has(p.id) ? "" : " open";
            blocks.push(`<details class="project"${openAttr} data-id="${esc(p.id)}" data-pid="${esc(p.id)}">
        <summary><span class="proj-title">${highlightTitle(p.title)}</span><span class="proj-count">${pts.length}</span></summary>
        <div class="proj-actions row-actions">
          <button class="btn" data-act="add-task" data-pid="${esc(p.id)}" data-f="${esc(filt)}">+ Task</button>
          <button class="btn" data-act="add-section" data-pid="${esc(p.id)}">+ Section</button>
          <button class="btn" data-act="edit-project">Edit</button>
          <button class="btn" data-act="info-project">Info</button>
          <button class="btn" data-act="paste-att" data-ptype="project" data-pid="${esc(p.id)}">Img</button>
          <button class="btn danger" data-act="del-project">Del</button>
        </div>
        ${pThumbs}
        ${projectTasksHtml(p, allPts, plan)}
      </details>`);
          }
          const known = new Set(projectsFor(filt).map((p) => p.id));
          const orphans = open.filter((t) => {
            if (known.has(t.project_id)) return false;
            return !searchNeedle() || titleMatches(t.title);
          });
          if (orphans.length) {
            visibleOpen = visibleOpen.concat(orphans);
            blocks.push(`<details class="project" open><summary><span class="proj-title">Other</span><span class="proj-count">${orphans.length}</span></summary>
        <ul class="task-list">${orphans.map(taskLi).join("")}</ul></details>`);
          }
          const emptyMsg = searchNeedle()
            ? '<p class="empty">No matches</p>'
            : '<p class="empty">No projects</p>';
          const extra = inlineProjectHtml(filt);
          return `<section class="${focusColumnClass(filt)}" id="sec-${esc(filt)}">${sectionHeadHtml(heading, searchNeedle() ? visibleOpen : open, filt)}${blocks.join("")}${extra || (!blocks.length ? emptyMsg : "")}</section>`;
        }

        function habitTasksList() {
          const q = searchNeedle();
          return (state.data.tasks || []).filter((t) => {
            if (t.active === "0" || t.kind !== "habitual") return false;
            if (!q) return true;
            if (
              String(t.title || "")
                .toLowerCase()
                .includes(q)
            )
              return true;
            const p = (state.data.projects || []).find(
              (x) => x.id === t.project_id,
            );
            if (
              p &&
              String(p.title || "")
                .toLowerCase()
                .includes(q)
            )
              return true;
            const sec = (state.data.sections || []).find(
              (s) => s.id === t.section_id,
            );
            return !!(
              sec &&
              String(sec.title || "")
                .toLowerCase()
                .includes(q)
            );
          });
        }

        function renderHabitsColumn() {
          const habitual = habitTasksList();
          const byProj = {};
          habitual.forEach((t) => {
            const pid = t.project_id || "";
            (byProj[pid] ||= []).push(t);
          });
          const idSet = new Set([
            ...projectsFor("habits").map((p) => p.id),
            ...Object.keys(byProj).filter(Boolean),
          ]);
          const projects = (state.data.projects || [])
            .filter((p) => p.active !== "0" && idSet.has(p.id))
            .sort(
              (a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                a.title.localeCompare(b.title),
            );
          const blocks = [];
          let visible = [];
          for (const p of projects) {
            const allPts = byProj[p.id] || [];
            const plan = projectSearchPlan(p, allPts);
            if (!plan.show) continue;
            visible = visible.concat(plan.pts);
            const pThumbs = thumbsHtml("project", p.id);
            const openAttr = state.collapsedProjects.has(p.id) ? "" : " open";
            blocks.push(`<details class="project"${openAttr} data-id="${esc(p.id)}" data-pid="${esc(p.id)}">
        <summary><span class="proj-title">${highlightTitle(p.title)}</span><span class="proj-count">${plan.pts.length}</span></summary>
        <div class="proj-actions row-actions">
          <button class="btn" data-act="add-task" data-pid="${esc(p.id)}" data-f="habits">+ Task</button>
          <button class="btn" data-act="add-section" data-pid="${esc(p.id)}">+ Section</button>
          <button class="btn" data-act="edit-project">Edit</button>
          <button class="btn" data-act="info-project">Info</button>
          <button class="btn" data-act="paste-att" data-ptype="project" data-pid="${esc(p.id)}">Img</button>
          <button class="btn danger" data-act="del-project">Del</button>
        </div>
        ${pThumbs}
        ${projectTasksHtml(p, allPts, plan)}
      </details>`);
          }
          const known = new Set(projects.map((p) => p.id));
          const orphans = habitual.filter(
            (t) =>
              !known.has(t.project_id) &&
              (!searchNeedle() || titleMatches(t.title)),
          );
          if (orphans.length) {
            visible = visible.concat(orphans);
            blocks.push(`<details class="project" open><summary><span class="proj-title">Other</span><span class="proj-count">${orphans.length}</span></summary>
        <ul class="task-list">${orphans.map(taskLi).join("")}</ul></details>`);
          }
          const emptyMsg = searchNeedle()
            ? '<p class="empty">No matches</p>'
            : '<p class="empty">No habits</p>';
          const extra = inlineProjectHtml("habits");
          return `<section class="${focusColumnClass("habits")}" id="sec-habits">${sectionHeadHtml("Habits", searchNeedle() ? visible : habitual, "habits")}${blocks.join("")}${extra || (!blocks.length ? emptyMsg : "")}</section>`;
        }

        function renderDashboard() {
          rebuildTaskIdsWithInfo();
          $("#view").innerHTML = `
      <div class="${focusTopRowClass()}">${renderColumn("Personal", "personal")}${renderColumn("Work", "work")}</div>
      ${renderHabitsColumn()}`;
          applyEmojiFilter(state.emojiFilter);
          applySelection(false);
          bindInlineCreateInput();
        }

        function focusSearch() {
          const inp = $("#globalSearch");
          if (!inp) return;
          inp.focus();
          inp.select();
        }

        function shiftCmdFromEvent(e) {
          const code = e.code || "";
          if (code === "Digit1" || code === "Numpad1") return "1";
          if (code === "Digit2" || code === "Numpad2") return "2";
          if (code === "Digit3" || code === "Numpad3") return "3";
          if (code.startsWith("Key") && code.length === 4)
            return code.slice(3).toLowerCase();
          const k = (e.key || "").toLowerCase();
          if (k.length === 1 && /[a-z0-9]/.test(k)) return k;
          if (k === "!" || k === "@" || k === "#") {
            if (k === "!") return "1";
            if (k === "@") return "2";
            if (k === "#") return "3";
          }
          return "";
        }

        function clearSearch() {
          state.search = "";
          const inp = $("#globalSearch");
          if (inp) inp.value = "";
        }

        function applySearch(query) {
          state.search = query ?? "";
          if (state.view === "dashboard" && state.data) renderDashboard();
        }

        function render() {
          if (!state.data) return;
          const c = state.data.counts || {};
          $("#hdrSub").textContent =
            `${c.projects || 0} projects · ${c.tasks || 0} tasks · ${c.info || 0} info · ${c.open || 0} open`;
          renderDashboard();
        }

        function scrollToPageHeader() {
          window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
        }

        function applySectionFocus(filt, opts = {}) {
          const toggle = !!opts.toggle;
          if (toggle && filt && state.sectionFocus === filt) filt = "";
          const prev = state.sectionFocus || "";
          state.sectionFocus = filt || "";
          const f = state.sectionFocus;
          const personal = document.getElementById("sec-personal");
          const work = document.getElementById("sec-work");
          const habits = document.getElementById("sec-habits");
          const top = document.querySelector(".top-row");
          if (personal) personal.className = focusColumnClass("personal");
          if (work) work.className = focusColumnClass("work");
          if (habits) habits.className = focusColumnClass("habits");
          if (top) top.className = focusTopRowClass();
          // Only scroll when the focus mode actually changes (not on every re-apply)
          if (opts.scrollHeader !== false && f && f !== prev)
            scrollToPageHeader();
          applySelection(opts.selectScroll !== false);
        }

        function titleFirstChar(title) {
          const m = String(title || "")
            .normalize("NFKC")
            .match(/[A-Za-z0-9]/);
          return m ? m[0].toLowerCase() : "";
        }

        function collectTargets() {
          const out = [];
          const pushProj = (proj) => {
            if (proj.classList.contains("emoji-hidden")) return;
            const id =
              proj.getAttribute("data-id") || proj.getAttribute("data-pid");
            if (!id) return;
            const title =
              proj.querySelector(".proj-title")?.textContent?.trim() || "";
            out.push({ kind: "project", id, title, el: proj });
            if (!proj.open) return;
            proj
              .querySelectorAll(":scope > .task-section:not(.emoji-hidden)")
              .forEach((sec) => {
                if (sec.hasAttribute("data-inline-create")) return;
                const sid = sec.getAttribute("data-id");
                if (!sid) return;
                const stitle =
                  sec
                    .querySelector(".task-section-label")
                    ?.textContent?.trim() || "";
                out.push({ kind: "section", id: sid, title: stitle, el: sec });
                if (sec.classList.contains("collapsed")) return;
                sec
                  .querySelectorAll(
                    ".task:not(.emoji-hidden):not([data-inline-create])",
                  )
                  .forEach((t) => {
                    const tid = t.getAttribute("data-id");
                    if (!tid) return;
                    const kind =
                      t.getAttribute("data-kind") === "habitual"
                        ? "habit"
                        : "task";
                    out.push({
                      kind,
                      id: tid,
                      title:
                        t.querySelector(".title")?.textContent?.trim() || "",
                      el: t,
                    });
                  });
              });
            // tasks not wrapped in a section (legacy / empty layouts)
            proj
              .querySelectorAll(
                ":scope > .task-list > .task:not(.emoji-hidden)",
              )
              .forEach((t) => {
                const tid = t.getAttribute("data-id");
                if (!tid) return;
                const kind =
                  t.getAttribute("data-kind") === "habitual" ? "habit" : "task";
                out.push({
                  kind,
                  id: tid,
                  title: t.querySelector(".title")?.textContent?.trim() || "",
                  el: t,
                });
              });
          };
          ["sec-personal", "sec-work", "sec-habits"].forEach((sid) => {
            const sec = document.getElementById(sid);
            if (!sec || sec.classList.contains("section-hidden")) return;
            sec
              .querySelectorAll("details.project")
              .forEach((proj) => pushProj(proj));
          });
          return out;
        }

        function setProjectExpanded(id, expanded) {
          if (expanded) state.collapsedProjects.delete(id);
          else state.collapsedProjects.add(id);
          const el = document.querySelector(
            `details.project[data-id="${CSS.escape(id)}"]`,
          );
          if (el) el.open = !!expanded;
        }

        function setSectionExpanded(id, expanded) {
          if (expanded) state.collapsedSections.delete(id);
          else state.collapsedSections.add(id);
          const el = document.querySelector(
            `.task-section[data-id="${CSS.escape(id)}"]`,
          );
          if (el) el.classList.toggle("collapsed", !expanded);
        }

        function hierarchyNav(dir) {
          if (!state.sel) return;
          const targets = collectTargets();
          const idx = targets.findIndex(
            (t) =>
              state.sel && t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (idx < 0) return;
          const hit = targets[idx];

          if (hit.kind === "project") {
            if (dir > 0) {
              if (!hit.el.open) {
                setProjectExpanded(hit.id, true);
                applySelection(true);
                return;
              }
              const next = targets[idx + 1];
              if (next && next.el.closest("details.project") === hit.el)
                setSelection(next.kind, next.id, true);
              return;
            }
            if (hit.el.open) {
              setProjectExpanded(hit.id, false);
              applySelection(true);
            }
            return;
          }

          if (hit.kind === "section") {
            if (dir > 0) {
              if (hit.el.classList.contains("collapsed")) {
                setSectionExpanded(hit.id, true);
                applySelection(true);
                return;
              }
              const next = targets[idx + 1];
              if (next && next.el.closest(".task-section") === hit.el)
                setSelection(next.kind, next.id, true);
              return;
            }
            if (!hit.el.classList.contains("collapsed")) {
              setSectionExpanded(hit.id, false);
              applySelection(true);
              return;
            }
            const proj = hit.el.closest("details.project");
            const pid =
              proj?.getAttribute("data-id") || proj?.getAttribute("data-pid");
            if (pid) setSelection("project", pid, true);
            return;
          }

          if (hit.kind === "task") {
            if (dir < 0) {
              const sec = hit.el.closest(".task-section");
              const sid = sec?.getAttribute("data-id");
              if (sid) {
                setSelection("section", sid, true);
                return;
              }
              const proj = hit.el.closest("details.project");
              const pid =
                proj?.getAttribute("data-id") || proj?.getAttribute("data-pid");
              if (pid) setSelection("project", pid, true);
            }
          }
        }

        function applySelection(scroll) {
          document.querySelectorAll(".kb-selected").forEach((el) => {
            if (el.closest("#modalHost")) return;
            el.classList.remove("kb-selected");
          });
          if (!state.sel) return;
          const targets = collectTargets();
          const hit = targets.find(
            (t) => t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (!hit) {
            state.sel = null;
            return;
          }
          hit.el.classList.add("kb-selected");
          if (scroll)
            hit.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }

        function setSelection(kind, id, scroll) {
          if (!kind || !id) {
            state.sel = null;
            applySelection(false);
            return;
          }
          state.sel = { kind, id };
          applySelection(scroll !== false);
        }

        function flashAdded(kind, id) {
          if (!kind || !id) return;
          setSelection(kind, id, true);
          requestAnimationFrame(() => {
            const hit = collectTargets().find(
              (t) => t.kind === kind && t.id === id,
            );
            const el = hit?.el;
            if (!el) return;
            el.classList.remove("just-added");
            void el.offsetWidth;
            el.classList.add("just-added");
          });
        }

        function flashInfoRow(id) {
          if (!id) return;
          const el = document.querySelector(
            `#modalHost .plain-row[data-id="${CSS.escape(id)}"]`,
          );
          if (!el) return;
          el.classList.remove("just-added");
          void el.offsetWidth;
          el.classList.add("just-added");
        }

        function moveSelection(delta) {
          const targets = collectTargets();
          if (!targets.length) return;
          let idx = targets.findIndex(
            (t) =>
              state.sel && t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (idx < 0) {
            idx = delta > 0 ? 0 : targets.length - 1;
          } else {
            idx = (idx + delta + targets.length) % targets.length;
          }
          setSelection(targets[idx].kind, targets[idx].id, true);
        }

        function letterJump(ch) {
          const all = collectTargets();
          if (!all.length) return;
          const cur = all.findIndex(
            (t) =>
              state.sel && t.kind === state.sel.kind && t.id === state.sel.id,
          );
          // Windows-style: search downward from the item after the selection, wrap at end
          const n = all.length;
          const from = cur < 0 ? 0 : (cur + 1) % n;
          for (let i = 0; i < n; i++) {
            const idx = (from + i) % n;
            if (titleFirstChar(all[idx].title) === ch) {
              setSelection(all[idx].kind, all[idx].id, true);
              return;
            }
          }
        }

        function currentPwSide() {
          if (!state.sel) return state.pwSide || "personal";
          const targets = collectTargets();
          const hit = targets.find(
            (t) => t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (hit?.el?.closest("#sec-personal")) return "personal";
          if (hit?.el?.closest("#sec-work")) return "work";
          return state.pwSide || "personal";
        }

        function firstTargetInCategory(filt) {
          const sec = document.getElementById("sec-" + filt);
          if (!sec || sec.classList.contains("section-hidden")) return null;
          return (
            collectTargets().find((t) => t.el.closest("#sec-" + filt)) || null
          );
        }

        function toggleFirstPersonalWork() {
          // With an active search, jump to the first visible filtered hit
          if (searchNeedle()) {
            const targets = collectTargets();
            if (!targets.length) {
              toast("No matches");
              return;
            }
            setSelection(targets[0].kind, targets[0].id, false);
            scrollToPageHeader();
            return;
          }
          const from = currentPwSide();
          const next = from === "personal" ? "work" : "personal";
          const focusOpts = { selectScroll: false };
          if (state.sectionFocus === "habits" || state.sectionFocus === from) {
            applySectionFocus(next, focusOpts);
          } else if (state.sectionFocus && state.sectionFocus !== next) {
            applySectionFocus(next, focusOpts);
          }
          let hit = firstTargetInCategory(next);
          if (!hit) {
            applySectionFocus(next, focusOpts);
            hit = firstTargetInCategory(next);
          }
          if (!hit) {
            toast("No " + (next === "work" ? "Work" : "Personal") + " items");
            return;
          }
          state.pwSide = next;
          setSelection(hit.kind, hit.id, false);
          scrollToPageHeader();
        }

        function selectedTaskId() {
          if (!state.sel) return "";
          if (state.sel.kind === "task" || state.sel.kind === "habit")
            return state.sel.id;
          return "";
        }

        function taskRowById(id) {
          if (!id) return null;
          return (state.data.tasks || []).find((t) => t.id === id) || null;
        }

        function hoveredTaskId() {
          const el = document.querySelector(".task:hover[data-id]");
          return el?.getAttribute("data-id") || "";
        }

        function taskToCopyPayload(t) {
          if (!t) return null;
          return {
            title: t.title || "",
            emoji: t.emoji || "🔲",
            kind: t.kind || "punctual",
            recurrence: t.recurrence || "",
            due_date: t.due_date || "",
            next_due: t.next_due || "",
          };
        }

        function copyTaskById(id, opts = {}) {
          const t = taskRowById(id);
          const payload = taskToCopyPayload(t);
          if (!payload) {
            toast("Select or hover a task first");
            return false;
          }
          const cut = !!opts.cut;
          state.taskClipboard = {
            ...payload,
            cutFromId: cut ? t.id : "",
          };
          toast(cut ? "Cut task — paste to move" : "Copied task");
          render();
          applySelection(false);
          return true;
        }

        function cutTaskById(id) {
          return copyTaskById(id, { cut: true });
        }

        async function pasteCopiedTask() {
          const clip = state.taskClipboard;
          if (!clip?.title) {
            toast("Nothing to paste — copy or cut a task first");
            return;
          }
          let ctx = resolveTaskCreateContext({});
          if (!ctx.project_id) {
            toast("Select a project or section to paste into");
            return;
          }
          if (!ctx.section_id) {
            await refresh();
            ctx = resolveTaskCreateContext({
              project_id: ctx.project_id,
              filter: ctx.filter,
            });
          }
          let kind = clip.kind || "punctual";
          let recurrence = clip.recurrence || "";
          if (ctx.filter !== "habits" && kind === "habitual") {
            kind = "punctual";
            recurrence = "";
          }
          if (ctx.filter === "habits") kind = "habitual";
          if (kind === "punctual") recurrence = "";
          const payload = {
            title: clip.title,
            project_id: ctx.project_id,
            section_id: ctx.section_id || "",
            filter: ctx.filter,
            kind,
            recurrence,
            emoji: clip.emoji || "🔲",
            due_date: kind === "habitual" ? "" : clip.due_date || "",
            next_due:
              kind === "habitual"
                ? clip.next_due ||
                  clip.due_date ||
                  new Date().toISOString().slice(0, 10)
                : "",
          };

          const cutId = (clip.cutFromId || "").trim();
          const moving = !!(cutId && taskRowById(cutId));
          if (moving) {
            const src = taskRowById(cutId);
            if (
              src.project_id === ctx.project_id &&
              (src.section_id || "") === (ctx.section_id || "")
            ) {
              state.taskClipboard = { ...clip, cutFromId: "" };
              toast("Already here");
              render();
              applySelection(false);
              return;
            }
            payload.id = cutId;
            payload.active = src.active || "1";
          }

          const r = await api("/api/tasks", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          if (moving) state.taskClipboard = { ...clip, cutFromId: "" };
          toast(moving ? "Moved task" : "Pasted task");
          await refresh();
          if (r.task?.id) {
            const sk = r.task.kind === "habitual" ? "habit" : "task";
            flashAdded(sk, r.task.id);
          }
        }

        function selectedHabitId() {
          if (state.sel?.kind === "habit") return state.sel.id;
          if (state.sel?.kind === "task") {
            const t = (state.data.tasks || []).find(
              (x) => x.id === state.sel.id,
            );
            if (t?.kind === "habitual") return t.id;
          }
          return "";
        }

        async function setSelectedTaskEmoji(keyOrEmoji) {
          const tid = selectedTaskId();
          if (!tid) {
            toast("Select a task first");
            return;
          }
          const prev = state.sel;
          await api("/api/tasks/" + encodeURIComponent(tid) + "/emoji", {
            method: "POST",
            body: JSON.stringify({ key: keyOrEmoji }),
          });
          await refresh();
          if (prev?.id) {
            const t = (state.data.tasks || []).find((x) => x.id === prev.id);
            const kind =
              t?.kind === "habitual" || prev.kind === "habit"
                ? "habit"
                : "task";
            setSelection(kind, prev.id, false);
          }
        }

        async function sendHabitToPersonal(habitId) {
          const r = await api(
            "/api/tasks/" + encodeURIComponent(habitId) + "/to-personal",
            { method: "POST", body: "{}" },
          );
          toast("Sent to Personal · General");
          await refresh();
          applySectionFocus("personal");
          if (r.task?.id) flashAdded("task", r.task.id);
        }

        function selectedProjectId() {
          if (!state.sel) return "";
          if (state.sel.kind === "project") return state.sel.id;
          if (state.sel.kind === "section") {
            const sec = (state.data.sections || []).find(
              (s) => s.id === state.sel.id,
            );
            return sec?.project_id || "";
          }
          if (state.sel.kind === "task" || state.sel.kind === "habit") {
            const t = (state.data.tasks || []).find(
              (x) => x.id === state.sel.id,
            );
            return t?.project_id || "";
          }
          return "";
        }

        async function runShiftCommand(key) {
          const k = key.toLowerCase();
          if (k === "1") {
            applySectionFocus("work", { toggle: true });
            return;
          }
          if (k === "2") {
            applySectionFocus("personal", { toggle: true });
            return;
          }
          if (k === "3") {
            applySectionFocus("habits", { toggle: true });
            return;
          }
          if (k === "e") {
            const nodes = document.querySelectorAll("details.project");
            const openAll = Array.from(nodes).some((n) => !n.open);
            if (openAll) {
              state.collapsedProjects.clear();
              state.collapsedSections.clear();
              nodes.forEach((n) => {
                n.open = true;
              });
              document
                .querySelectorAll(".task-section.collapsed")
                .forEach((s) => s.classList.remove("collapsed"));
            } else {
              nodes.forEach((n) => {
                const id = n.getAttribute("data-id");
                if (id) state.collapsedProjects.add(id);
                n.open = false;
              });
            }
            applySelection(false);
            return;
          }
          if (k === "j") {
            toggleFirstPersonalWork();
            return;
          }
          if (Object.prototype.hasOwnProperty.call(EMOJI_KEYS, k)) {
            const tid = selectedTaskId();
            if (tid) {
              await setSelectedTaskEmoji(EMOJI_API_KEYS[k] || EMOJI_KEYS[k]);
              return;
            }
            const em = EMOJI_KEYS[k];
            applyEmojiFilter(state.emojiFilter === em ? null : em);
            applySelection(true);
            return;
          }
          if (k === "f") {
            applyEmojiFilter(null);
            applySelection(false);
            return;
          }
          if (k === "c") {
            const t = (state.data.tasks || []).find(
              (x) => x.id === selectedTaskId(),
            );
            if (t?.kind === "habitual") {
              toast("Habits cannot be completed");
              return;
            }
            await setSelectedTaskEmoji("done");
            return;
          }
          if (k === "d") {
            const tid = selectedHabitId();
            if (!tid) {
              toast("Select a habit first");
              return;
            }
            await sendHabitToPersonal(tid);
            return;
          }
          if (k === "i") {
            await setSelectedTaskEmoji("important");
            return;
          }
          if (k === "a") {
            const pid = selectedProjectId();
            if (pid) {
              const p = (state.data.projects || []).find((x) => x.id === pid);
              beginInlineTaskCreate({
                project_id: pid,
                filter: p?.filter || state.filter || "work",
              });
            } else if (
              state.sel?.kind === "section" ||
              state.sectionFocus === "personal" ||
              state.sectionFocus === "work" ||
              state.sectionFocus === "habits"
            ) {
              beginInlineTaskCreate({});
            } else {
              beginInlineProjectCreate(defaultProjectFilter());
            }
            return;
          }
          if (k === "b") {
            const pid = selectedProjectId();
            if (!pid) {
              toast("Select a project first");
              return;
            }
            beginInlineSectionCreate(pid);
            return;
          }
          if (k === "n") {
            if (state.sel?.kind === "project") {
              infoListModal("project", state.sel.id);
              return;
            }
            const tid = selectedTaskId();
            if (tid) {
              const t = (state.data.tasks || []).find((x) => x.id === tid);
              if (t) state.projectId = t.project_id;
              infoListModal("task", tid);
              return;
            }
            toast("Select a project or task");
            return;
          }
          if (k === "v") {
            await pasteClipboardImageToSelection();
            return;
          }
          if (k === "p") {
            if (state.view !== "dashboard") {
              state.view = "dashboard";
              await refresh();
            }
            state.filter = defaultProjectFilter();
            beginInlineProjectCreate(state.filter);
            return;
          }
        }

        function findSection(id) {
          if (!id || String(id).startsWith("other:")) return null;
          return (state.data.sections || []).find((s) => s.id === id) || null;
        }

        function isGeneralSection(sec) {
          return (sec?.title || "").trim().toLowerCase() === "general";
        }

        async function deleteSectionById(id) {
          const sec = findSection(id);
          if (!sec) {
            toast("Cannot delete this section");
            return false;
          }
          if (isGeneralSection(sec)) {
            toast("General cannot be deleted");
            return false;
          }
          if (!confirm("Delete section? Its tasks move to General."))
            return false;
          await api("/api/sections/" + encodeURIComponent(sec.id), {
            method: "DELETE",
          });
          if (state.sel?.kind === "section" && state.sel.id === sec.id)
            state.sel = null;
          toast("Deleted");
          await refresh();
          return true;
        }

        async function deleteSelection() {
          if (!state.sel) {
            toast("Nothing selected");
            return;
          }
          if (state.sel.kind === "project") {
            if (!confirm("Delete project and its tasks/info/attachments?"))
              return;
            await api("/api/projects/" + encodeURIComponent(state.sel.id), {
              method: "DELETE",
            });
            state.sel = null;
            toast("Deleted");
            await refresh();
            return;
          }
          if (state.sel.kind === "section") {
            await deleteSectionById(state.sel.id);
            return;
          }
          if (state.sel.kind === "task" || state.sel.kind === "habit") {
            if (!confirm("Delete task and its info/attachments?")) return;
            await api("/api/tasks/" + encodeURIComponent(state.sel.id), {
              method: "DELETE",
            });
            state.sel = null;
            toast("Deleted");
            await refresh();
          }
        }

        function editSelection() {
          if (!state.sel) return;
          if (state.sel.kind === "project") {
            projectForm(
              (state.data.projects || []).find((p) => p.id === state.sel.id),
            );
            return;
          }
          if (state.sel.kind === "section") {
            const sec = findSection(state.sel.id);
            if (!sec) return;
            if (isGeneralSection(sec)) {
              toast("General cannot be edited");
              return;
            }
            sectionForm(sec);
            return;
          }
          taskForm((state.data.tasks || []).find((t) => t.id === state.sel.id));
        }

        function goHome(opts = {}) {
          const keepSearch = !!opts.keepSearch;
          cancelInlineCreate();
          hideLightbox();
          if (modalOpen()) closeModal();
          state.infoUi = "";
          state.infoCtx = null;
          state.infoSelId = "";
          state.view = "dashboard";
          if (!keepSearch && searchNeedle()) clearSearch();
          if (state.emojiFilter !== null) applyEmojiFilter(null);
          if (state.sectionFocus) applySectionFocus("");
          if (state.sel) setSelection(null, null, false);
          const inp = $("#globalSearch");
          if (inp && document.activeElement === inp) inp.blur();
          if (state.data) render();
          scrollToPageHeader();
        }

        function hideLightbox() {
          const lb = $("#lightbox");
          if (!lb || lb.hidden) return false;
          lb.hidden = true;
          const img = lb.querySelector("img");
          if (img) img.src = "";
          return true;
        }

        function closeOtherModal() {
          if (!modalOpen()) return false;
          closeModal();
          state.infoUi = "";
          state.infoCtx = null;
          state.infoSelId = "";
          applySelection(true);
          return true;
        }

        // Close inline create, image preview, Info, or other modals.
        // Does not clear Work/Personal/Habits focus, search, or dashboard selection.
        function dismissTransientUi() {
          if (state.inlineCreate) {
            cancelInlineCreate();
            return true;
          }
          if (hideLightbox()) return true;
          if (handleInfoEscape()) return true;
          if (closeOtherModal()) return true;
          return false;
        }

        function handleEscape() {
          if (dismissTransientUi()) return;
          const now = Date.now();
          const isDouble =
            state.lastEscAt > 0 &&
            now - state.lastEscAt >= 0 &&
            now - state.lastEscAt < ESC_DOUBLE_TAP_MS;
          if (isDouble) {
            state.lastEscAt = 0;
            goHome({ keepSearch: false });
            return;
          }
          state.lastEscAt = now;
          goHome({ keepSearch: true });
        }

        function goBack() {
          if (dismissTransientUi()) return true;
          if (searchNeedle()) {
            clearSearch();
            if (state.view === "dashboard" && state.data) renderDashboard();
            return true;
          }
          if (state.emojiFilter !== null) {
            applyEmojiFilter(null);
            applySelection(false);
            return true;
          }
          if (state.sectionFocus) {
            applySectionFocus("");
            return true;
          }
          if (state.sel) {
            setSelection(null, null, false);
            return true;
          }
          return false;
        }
