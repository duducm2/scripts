        function modalOpen() {
          return !!$("#modalHost")?.innerHTML;
        }

        function infoRowsForCtx() {
          const ctx = state.infoCtx;
          if (!ctx) return [];
          return (state.data.info_points || []).filter(
            (i) =>
              i.parent_type === ctx.parentType && i.parent_id === ctx.parentId,
          );
        }

        function paintInfoSel() {
          document.querySelectorAll("#modalHost .plain-row").forEach((el) => {
            el.classList.toggle(
              "kb-selected",
              el.getAttribute("data-id") === state.infoSelId,
            );
          });
        }

        function dismissInfoModal() {
          state.infoUi = "";
          state.infoCtx = null;
          state.infoSelId = "";
          closeModal();
          applySelection(true);
        }

        function handleInfoEscape() {
          if (state.infoUi === "form") {
            const ctx = state.infoCtx;
            if (ctx) infoListModal(ctx.parentType, ctx.parentId);
            else dismissInfoModal();
            return true;
          }
          if (state.infoUi === "list") {
            dismissInfoModal();
            return true;
          }
          return false;
        }

        function infoListModal(parentType, parentId, preferId) {
          state.projectId =
            parentType === "project" ? parentId : state.projectId;
          state.taskId = parentType === "task" ? parentId : "";
          state.infoCtx = { parentType, parentId };
          state.infoUi = "list";
          const rows = (state.data.info_points || []).filter(
            (i) => i.parent_type === parentType && i.parent_id === parentId,
          );
          if (preferId && rows.some((r) => r.id === preferId))
            state.infoSelId = preferId;
          else if (
            !state.infoSelId ||
            !rows.some((r) => r.id === state.infoSelId)
          )
            state.infoSelId = rows[0]?.id || "";
          modal(`<div class="modal modal-info"><h3>Info</h3>
      <div class="toolbar" style="padding:0 0 10px">
        <button class="btn" data-m="add-info-here">+ Info</button>
        <button class="btn" data-m="cancel">Close</button>
      </div>
      <ul class="plain-list">${
        rows
          .map((i) => {
            const hit = infoHyperlink(i);
            const openAttrs = hit
              ? ` data-act="open-info-link" data-href="${esc(hit.href)}" data-kind="${esc(hit.kind)}" title="Open"`
              : "";
            const sel = i.id === state.infoSelId ? " kb-selected" : "";
            return `<li class="plain-row${sel}" data-id="${esc(i.id)}">
        <div class="plain-row-head">
          <span class="title${hit ? " is-link" : ""}"${openAttrs}>${esc(infoText(i))}</span>
          <span class="row-actions">
            <button class="btn" data-act="edit-info">Edit</button>
            <button class="btn danger" data-act="del-info">Del</button>
          </span>
        </div>
        ${thumbsHtml("info", i.id)}
      </li>`;
          })
          .join("") || '<p class="empty">No info points</p>'
      }</ul></div>`);
          $("#modalHost").onclick = async (e) => {
            if (
              e.target.dataset.m === "cancel" ||
              e.target.classList.contains("modal-bg")
            ) {
              dismissInfoModal();
              return;
            }
            if (e.target.dataset.m === "add-info-here") {
              infoForm(null);
              return;
            }
            const row = e.target.closest(".plain-row[data-id]");
            if (row && !e.target.closest("[data-act]")) {
              state.infoSelId = row.getAttribute("data-id") || "";
              paintInfoSel();
            }
            const actEl = e.target.closest("[data-act]");
            if (!actEl) return;
            const act = actEl.getAttribute("data-act");
            const id =
              e.target.closest("[data-id]")?.getAttribute("data-id") || "";
            if (id) state.infoSelId = id;
            if (act === "open-info-link") {
              e.preventDefault();
              await openHyperlink({
                href: actEl.getAttribute("data-href") || "",
                kind: actEl.getAttribute("data-kind") || "url",
              });
              return;
            }
            if (act === "edit-info") {
              infoForm((state.data.info_points || []).find((i) => i.id === id));
              return;
            }
            if (act === "del-info") {
              await deleteInfoPoint(id);
            }
          };
        }

        async function deleteInfoPoint(id) {
          if (!id) return;
          if (!confirm("Delete info?")) return;
          const ctx = state.infoCtx;
          const rows = infoRowsForCtx();
          const idx = rows.findIndex((r) => r.id === id);
          try {
            await api("/api/info/" + encodeURIComponent(id), {
              method: "DELETE",
            });
            toast("Deleted");
            await refresh();
            if (!ctx) return;
            const remaining = (state.data.info_points || []).filter(
              (i) =>
                i.parent_type === ctx.parentType &&
                i.parent_id === ctx.parentId,
            );
            const pick =
              remaining[Math.min(Math.max(idx, 0), remaining.length - 1)];
            state.infoSelId = pick?.id || "";
            infoListModal(ctx.parentType, ctx.parentId, state.infoSelId);
          } catch (err) {
            toast(err.message);
          }
        }

        async function saveInfoFromForm(existing) {
          const ctx = state.infoCtx;
          const parentType =
            ctx?.parentType || (state.taskId ? "task" : "project");
          const parentId = ctx?.parentId || state.taskId || state.projectId;
          const text = ($("#mText")?.value || "").trim();
          if (!text) {
            toast("Text required");
            $("#mText")?.focus();
            return;
          }
          const r = await api("/api/info", {
            method: "POST",
            body: JSON.stringify({
              id: existing?.id || "",
              title: text,
              body: "",
              section_path: "",
              parent_type: parentType,
              parent_id: parentId,
            }),
          });
          toast("Saved");
          await refresh();
          const iid = r.info?.id || existing?.id || "";
          infoListModal(parentType, parentId, iid);
          flashInfoRow(iid);
        }

        function moveInfoSel(dir) {
          const rows = infoRowsForCtx();
          if (!rows.length) return;
          let idx = rows.findIndex((r) => r.id === state.infoSelId);
          if (idx < 0) idx = dir > 0 ? -1 : 0;
          idx = Math.max(0, Math.min(rows.length - 1, idx + dir));
          state.infoSelId = rows[idx].id;
          paintInfoSel();
        }

        function applyEmojiFilter(emoji) {
          // null = clear filter; "" = tasks with no emoji; otherwise match that emoji
          state.emojiFilter = emoji === undefined ? null : emoji;
          const filtering = state.emojiFilter !== null;
          document.querySelectorAll(".task").forEach((el) => {
            const match =
              !filtering || el.getAttribute("data-emoji") === state.emojiFilter;
            el.classList.toggle("emoji-hidden", !match);
          });
          document.querySelectorAll("details.project").forEach((proj) => {
            if (!filtering) {
              proj.classList.remove("emoji-hidden");
              return;
            }
            const visible = proj.querySelectorAll(
              ".task:not(.emoji-hidden)",
            ).length;
            proj.classList.toggle("emoji-hidden", visible === 0);
            if (visible > 0) proj.open = true;
          });
          document.querySelectorAll(".task-section").forEach((sec) => {
            if (!filtering) {
              sec.classList.remove("emoji-hidden");
              return;
            }
            const visible = sec.querySelectorAll(
              ".task:not(.emoji-hidden)",
            ).length;
            sec.classList.toggle("emoji-hidden", visible === 0);
          });
          document.querySelectorAll(".emoji-chip").forEach((chip) => {
            chip.classList.toggle(
              "active",
              filtering &&
                chip.getAttribute("data-emoji") === state.emojiFilter,
            );
          });
          applySelection(false);
        }

        function modal(html) {
          const host = $("#modalHost");
          host.innerHTML = `<div class="modal-bg">${html}</div>`;
          focusModalPrimaryField();
          return host;
        }

        function focusModalPrimaryField(selector) {
          const run = () => {
            const host = $("#modalHost");
            if (!host?.innerHTML) return;
            const field = selector
              ? host.querySelector(selector)
              : host.querySelector(
                  'textarea, input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]):not([type="file"])',
                );
            if (!field || field.disabled) return;
            field.focus({ preventScroll: true });
            if (typeof field.select === "function") {
              try {
                field.select();
              } catch (_) {}
            }
          };
          // Defer: focus during keydown (e.g. Enter → edit) is often ignored
          setTimeout(run, 0);
        }

        function closeModal() {
          $("#modalHost").innerHTML = "";
          if (state.infoUi === "list" || state.infoUi === "form") {
            /* caller sets infoUi; do not clear ctx here during list↔form */
          }
        }

        function defaultProjectFilter() {
          if (
            state.sectionFocus === "work" ||
            state.sectionFocus === "personal" ||
            state.sectionFocus === "habits"
          )
            return state.sectionFocus;
          if (state.sel?.kind === "project") {
            const p = (state.data.projects || []).find(
              (x) => x.id === state.sel.id,
            );
            if (p?.filter) return p.filter;
          }
          if (state.sel?.kind === "section") {
            const sec = (state.data.sections || []).find(
              (s) => s.id === state.sel.id,
            );
            const p = (state.data.projects || []).find(
              (x) => x.id === sec?.project_id,
            );
            if (p?.filter) return p.filter;
          }
          if (state.sel?.kind === "task" || state.sel?.kind === "habit") {
            const t = (state.data.tasks || []).find(
              (x) => x.id === state.sel.id,
            );
            if (t?.filter) return t.filter;
          }
          const f = state.filter || state.pwSide || "work";
          return ["work", "personal", "habits"].includes(f) ? f : "work";
        }

        function projectForm(existing) {
          const filt = existing?.filter || defaultProjectFilter();
          modal(`<div class="modal"><h3>${existing ? "Edit" : "Add"} project</h3>
      <label>Title</label><input id="mTitle" value="${esc(existing?.title || "")}"/>
      <label>Filter</label><select id="mFilt">
        ${["work", "personal", "habits"].map((f) => `<option value="${f}" ${filt === f ? "selected" : ""}>${f}</option>`).join("")}
      </select>
      <label>Section path</label><input id="mSec" value="${esc(existing?.section_path || "")}"/>
      <div class="modal-actions">
        <button class="btn" data-m="cancel">Cancel</button>
        <button class="btn" data-m="save-project">Save</button>
      </div></div>`);
          $("#modalHost").onclick = async (e) => {
            if (
              e.target.dataset.m === "cancel" ||
              e.target.classList.contains("modal-bg")
            )
              closeModal();
            if (e.target.dataset.m === "save-project") {
              try {
                const r = await api("/api/projects", {
                  method: "POST",
                  body: JSON.stringify({
                    id: existing?.id || "",
                    title: $("#mTitle").value,
                    filter: $("#mFilt").value,
                    section_path: $("#mSec").value,
                  }),
                });
                closeModal();
                toast("Saved");
                await refresh();
                if (r.project?.id) flashAdded("project", r.project.id);
              } catch (err) {
                toast(err.message);
              }
            }
          };
        }

        function sectionForm(existing) {
          if (!existing) return;
          if (isGeneralSection(existing)) {
            toast("General cannot be edited");
            return;
          }
          modal(`<div class="modal"><h3>Edit section</h3>
      <label>Title</label><input id="mTitle" value="${esc(existing.title || "")}"/>
      <div class="modal-actions">
        <button class="btn" data-m="cancel">Cancel</button>
        <button class="btn" data-m="save-section">Save</button>
      </div></div>`);
          $("#modalHost").onclick = async (e) => {
            if (
              e.target.dataset.m === "cancel" ||
              e.target.classList.contains("modal-bg")
            )
              closeModal();
            if (e.target.dataset.m === "save-section") {
              try {
                const title = ($("#mTitle")?.value || "").trim();
                if (!title) {
                  toast("Title required");
                  $("#mTitle")?.focus();
                  return;
                }
                if (title.toLowerCase() === "general") {
                  toast("Cannot rename to General");
                  return;
                }
                const r = await api("/api/sections", {
                  method: "POST",
                  body: JSON.stringify({
                    id: existing.id,
                    title,
                    project_id: existing.project_id,
                  }),
                });
                closeModal();
                toast("Saved");
                await refresh();
                if (r.section?.id) flashAdded("section", r.section.id);
              } catch (err) {
                toast(err.message);
              }
            }
          };
        }

        function inboxTitleFor(filt) {
          if (filt === "personal") return "Personal inbox";
          if (filt === "habits") return "Habits & Health";
          return "Work inbox";
        }

        function resolveTaskCreateContext(hint = {}) {
          let project_id = (hint.project_id || "").trim();
          let section_id = (hint.section_id || "").trim();
          let filter = (hint.filter || "").trim().toLowerCase();
          let kind = (hint.kind || "").trim().toLowerCase();

          if (state.sel?.kind === "section") {
            const sec = (state.data.sections || []).find(
              (s) => s.id === state.sel.id,
            );
            if (sec) {
              project_id = project_id || sec.project_id;
              section_id = section_id || sec.id;
              const p = (state.data.projects || []).find(
                (x) => x.id === sec.project_id,
              );
              filter = filter || p?.filter || "";
            }
          } else if (
            state.sel?.kind === "task" ||
            state.sel?.kind === "habit"
          ) {
            const t = (state.data.tasks || []).find(
              (x) => x.id === state.sel.id,
            );
            if (t) {
              project_id = project_id || t.project_id;
              section_id = section_id || t.section_id;
              filter = filter || t.filter || "";
              kind = kind || t.kind || "";
            }
          } else if (state.sel?.kind === "project") {
            project_id = project_id || state.sel.id;
            const p = (state.data.projects || []).find(
              (x) => x.id === project_id,
            );
            filter = filter || p?.filter || "";
          }

          if (!filter) {
            if (
              state.sectionFocus === "personal" ||
              state.sectionFocus === "work" ||
              state.sectionFocus === "habits"
            )
              filter = state.sectionFocus;
            else filter = state.pwSide || state.filter || "work";
          }
          if (!["work", "personal", "habits"].includes(filter)) filter = "work";

          if (!project_id) {
            const want = inboxTitleFor(filter).toLowerCase();
            const p =
              projectsFor(filter).find(
                (x) => (x.title || "").trim().toLowerCase() === want,
              ) || projectsFor(filter)[0];
            project_id = p?.id || "";
          } else {
            const p = (state.data.projects || []).find(
              (x) => x.id === project_id,
            );
            if (p?.filter) filter = p.filter;
          }

          if (!section_id && project_id) {
            const secs = sectionsFor(project_id);
            section_id =
              secs.find((s) => (s.title || "").toLowerCase() === "general")
                ?.id ||
              secs[0]?.id ||
              "";
          }

          // Habits column only lists kind=habitual; default new habits there.
          if (!kind) kind = filter === "habits" ? "habitual" : "punctual";
          if (!["punctual", "habitual"].includes(kind)) kind = "punctual";
          if (filter === "habits") kind = "habitual";

          return { project_id, section_id, filter, kind };
        }

        function inlineCreateInProject(projectId) {
          const c = state.inlineCreate;
          return (
            c?.project_id === projectId &&
            (c.entity === "task" || c.entity === "section" || !c.entity)
          );
        }

        function inlineCreateRowHtml(projectId, sectionId) {
          const c = state.inlineCreate;
          if (!c || c.project_id !== projectId) return "";
          if ((c.entity || "task") !== "task") return "";
          if ((c.section_id || "") !== (sectionId || "")) return "";
          return `<li class="task inline-create-row" data-inline-create="task">
      <span class="em">🔲</span>
      <input type="text" id="inlineTitle" placeholder="New task" autocomplete="off" />
    </li>`;
        }

        function inlineSectionHtml(projectId) {
          const c = state.inlineCreate;
          if (!c || c.entity !== "section" || c.project_id !== projectId)
            return "";
          return `<div class="task-section is-inline-create" data-inline-create="section">
      <div class="task-section-label"><input type="text" id="inlineTitle" placeholder="New section" autocomplete="off" /></div>
    </div>`;
        }

        function inlineProjectHtml(filt) {
          const c = state.inlineCreate;
          if (!c || c.entity !== "project" || c.filter !== filt) return "";
          return `<details class="project is-inline-create" open data-inline-create="project">
      <summary><input type="text" id="inlineTitle" placeholder="New project" autocomplete="off" /></summary>
    </details>`;
        }

        function cancelInlineCreate() {
          state.inlineCreate = null;
          document.querySelector("[data-inline-create]")?.remove();
        }

        function bindInlineCreateInput() {
          const inp = $("#inlineTitle");
          if (!inp || !state.inlineCreate) return;
          inp.focus();
          inp.scrollIntoView({ block: "nearest", behavior: "smooth" });
          inp.addEventListener("mousedown", (e) => e.stopPropagation());
          inp.addEventListener("click", (e) => e.stopPropagation());
          inp.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              e.stopPropagation();
              try {
                await commitInlineCreate();
              } catch (err) {
                toast(err.message || String(err));
              }
            }
          });
        }

        function mountInlineCreateRow() {
          document.querySelector("[data-inline-create]")?.remove();
          const ctx = state.inlineCreate;
          if (!ctx || (ctx.entity || "task") !== "task") return;
          if (!ctx.section_id) {
            renderDashboard();
            return;
          }
          const sec = document.querySelector(
            `.task-section[data-id="${CSS.escape(ctx.section_id)}"]`,
          );
          if (!sec) {
            renderDashboard();
            return;
          }
          sec.classList.remove("collapsed");
          const proj = sec.closest("details.project");
          if (proj) proj.open = true;
          let ul = sec.querySelector(":scope > .task-list");
          if (!ul) {
            ul = document.createElement("ul");
            ul.className = "task-list";
            sec.appendChild(ul);
          }
          ul.insertAdjacentHTML(
            "afterbegin",
            inlineCreateRowHtml(ctx.project_id, ctx.section_id),
          );
          bindInlineCreateInput();
        }

        function mountInlineSection() {
          document.querySelector("[data-inline-create]")?.remove();
          const ctx = state.inlineCreate;
          if (!ctx?.project_id) {
            renderDashboard();
            return;
          }
          const proj = document.querySelector(
            `details.project[data-id="${CSS.escape(ctx.project_id)}"]`,
          );
          if (!proj) {
            renderDashboard();
            return;
          }
          proj.open = true;
          proj.insertAdjacentHTML(
            "beforeend",
            inlineSectionHtml(ctx.project_id),
          );
          bindInlineCreateInput();
        }

        function mountInlineProject() {
          document.querySelector("[data-inline-create]")?.remove();
          const ctx = state.inlineCreate;
          const filt = ctx?.filter || "work";
          const col = document.getElementById("sec-" + filt);
          if (!col) {
            renderDashboard();
            return;
          }
          const html = inlineProjectHtml(filt);
          const empty = col.querySelector(":scope > .empty");
          if (empty) empty.remove();
          col.insertAdjacentHTML("beforeend", html);
          bindInlineCreateInput();
        }

        function mountInlineCreate() {
          const ctx = state.inlineCreate;
          if (!ctx) return;
          if (ctx.entity === "section") mountInlineSection();
          else if (ctx.entity === "project") mountInlineProject();
          else mountInlineCreateRow();
        }

        async function beginInlineTaskCreate(hint = {}) {
          if (state.view !== "dashboard") {
            state.view = "dashboard";
            await refresh();
          }
          let ctx = resolveTaskCreateContext(hint);
          if (!ctx.project_id) {
            const r = await api("/api/projects", {
              method: "POST",
              body: JSON.stringify({
                title: inboxTitleFor(ctx.filter),
                filter: ctx.filter,
              }),
            });
            await refresh();
            ctx = resolveTaskCreateContext({
              ...hint,
              project_id: r.project.id,
              filter: ctx.filter,
            });
          }
          if (!ctx.project_id) {
            toast("No project available");
            return;
          }
          if (!ctx.section_id) {
            await refresh();
            ctx = resolveTaskCreateContext({
              ...hint,
              project_id: ctx.project_id,
              filter: ctx.filter,
            });
          }
          cancelInlineCreate();
          state.inlineCreate = { ...ctx, entity: "task" };
          state.collapsedProjects.delete(ctx.project_id);
          if (ctx.section_id) state.collapsedSections.delete(ctx.section_id);
          if (
            ctx.filter === "personal" ||
            ctx.filter === "work" ||
            ctx.filter === "habits"
          ) {
            if (state.sectionFocus && state.sectionFocus !== ctx.filter)
              applySectionFocus(ctx.filter);
          }
          mountInlineCreate();
        }

        function beginInlineSectionCreate(projectId) {
          const p = (state.data.projects || []).find((x) => x.id === projectId);
          const filter = p?.filter || defaultProjectFilter();
          cancelInlineCreate();
          state.collapsedProjects.delete(projectId);
          state.inlineCreate = {
            entity: "section",
            project_id: projectId,
            filter,
          };
          if (
            filter === "personal" ||
            filter === "work" ||
            filter === "habits"
          ) {
            if (state.sectionFocus && state.sectionFocus !== filter)
              applySectionFocus(filter);
          }
          mountInlineCreate();
        }

        function beginInlineProjectCreate(filter) {
          const filt = ["work", "personal", "habits"].includes(filter)
            ? filter
            : defaultProjectFilter();
          cancelInlineCreate();
          state.inlineCreate = { entity: "project", filter: filt };
          if (state.sectionFocus && state.sectionFocus !== filt)
            applySectionFocus(filt);
          mountInlineCreate();
        }

        async function commitInlineCreate() {
          const ctx = state.inlineCreate;
          if (!ctx) return;
          const title = ($("#inlineTitle")?.value || "").trim();
          if (!title) {
            toast("Title required");
            $("#inlineTitle")?.focus();
            return;
          }
          const entity = ctx.entity || "task";
          if (entity === "section") {
            const r = await api("/api/sections", {
              method: "POST",
              body: JSON.stringify({
                project_id: ctx.project_id,
                title,
              }),
            });
            cancelInlineCreate();
            toast("Section added");
            await refresh();
            if (r.section?.id) flashAdded("section", r.section.id);
            return;
          }
          if (entity === "project") {
            const r = await api("/api/projects", {
              method: "POST",
              body: JSON.stringify({
                title,
                filter: ctx.filter || "work",
                section_path: "",
              }),
            });
            cancelInlineCreate();
            toast("Project added");
            await refresh();
            if (r.project?.filter)
              applySectionFocus(r.project.filter, {
                scrollHeader: false,
              });
            if (r.project?.id) flashAdded("project", r.project.id);
            return;
          }
          const kind = ctx.kind || "punctual";
          const payload = {
            title,
            project_id: ctx.project_id,
            section_id: ctx.section_id,
            filter: ctx.filter,
            kind,
            emoji: "🔲",
          };
          if (kind === "habitual") {
            payload.next_due = new Date().toISOString().slice(0, 10);
          }
          const r = await api("/api/tasks", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          cancelInlineCreate();
          toast(
            kind === "habitual"
              ? "Habit added — Enter to set recurrence"
              : "Task added — Enter to edit details",
          );
          await refresh();
          if (r.task?.id) {
            const sk = r.task.kind === "habitual" ? "habit" : "task";
            flashAdded(sk, r.task.id);
          }
        }

          $("#modalHost").onclick = async (e) => {

        async function uploadImage(parentType, parentId, file) {
          const buf = await file.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let binary = "";
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + chunk),
            );
          }
          const b64 = btoa(binary);
          const r = await api("/api/attachments", {
            method: "POST",
            body: JSON.stringify({
              parent_type: parentType,
              parent_id: parentId,
              kind: "image",
              filename: file.name || "paste.png",
              data_base64: b64,
              description: file.name || "clipboard image",
            }),
          });
          toast("Image attached");
          await refresh();
          if (state.infoCtx) {
            const iid = r.info_id || "";
            infoListModal(
              state.infoCtx.parentType,
              state.infoCtx.parentId,
              iid,
            );
            flashInfoRow(iid);
          } else if (parentType === "project") {
            flashAdded("project", parentId);
          } else if (parentType === "task") {
            const t = (state.data.tasks || []).find((x) => x.id === parentId);
            flashAdded(t?.kind === "habitual" ? "habit" : "task", parentId);
          }
        }

        function resolveAttachmentTarget() {
          if (state.infoCtx)
            return {
              ptype: state.infoCtx.parentType,
              pid: state.infoCtx.parentId,
              label: "info parent",
            };
          if (!state.sel) return null;
          if (state.sel.kind === "project")
            return { ptype: "project", pid: state.sel.id, label: "project" };
          if (state.sel.kind === "task" || state.sel.kind === "habit")
            return { ptype: "task", pid: state.sel.id, label: "task" };
          if (state.sel.kind === "section") {
            const sec = (state.data.sections || []).find(
              (s) => s.id === state.sel.id,
            );
            if (sec?.project_id)
              return {
                ptype: "project",
                pid: sec.project_id,
                label: "project (from section)",
              };
          }
          return null;
        }

        async function pasteClipboardImageToSelection() {
          const target = resolveAttachmentTarget();
          if (!target) {
            toast("Select a project, section, or task first");
            return;
          }
          if (!navigator.clipboard?.read) {
            toast("Clipboard image read not available in this browser");
            return;
          }
          let file = null;
          try {
            const items = await navigator.clipboard.read();
            for (const item of items) {
              const type = item.types.find((t) => t.startsWith("image/"));
              if (!type) continue;
              const blob = await item.getType(type);
              const ext = (type.split("/")[1] || "png").replace(
                /[^a-z0-9]/gi,
                "",
              );
              file = new File([blob], `clipboard.${ext || "png"}`, {
                type: blob.type || type,
              });
              break;
            }
          } catch (err) {
            toast(
              err?.name === "NotAllowedError"
                ? "Clipboard permission denied"
                : err?.message || "Could not read clipboard",
            );
            return;
          }
          if (!file) {
            toast("No image in clipboard");
            return;
          }
          await uploadImage(target.ptype, target.pid, file);
        }

            e.preventDefault();

            lb.hidden = false;

          }

              $("#lightbox").hidden = true;
              $("#lightbox").querySelector("img").src = "";

          const chip = e.target.closest(".emoji-chip");

            applySelection(true);

          }
          const habitRow = e.target.closest(
            ".task[data-kind='habitual'][data-id]",

          const secRow = e.target.closest(".task-section[data-id]");
          const projRow = e.target.closest("details.project[data-id]");
          if (habitRow) {
            setSelection("habit", habitRow.getAttribute("data-id"), false);
          } else if (taskRow) {
            setSelection("task", taskRow.getAttribute("data-id"), false);
          } else if (secRow && e.target.closest(".task-section-label")) {

            setSelection("section", sid, false);
            if (e.detail === 2 && sid) {
              setSectionExpanded(sid, secRow.classList.contains("collapsed"));

          } else if (projRow && e.target.closest("summary")) {
            setSelection("project", projRow.getAttribute("data-id"), false);
          }
          const actEl = e.target.closest("[data-act]");
          if (!actEl) return;
          const act = actEl.getAttribute("data-act");
          const row = e.target.closest("[data-id]");
          const id =
            row?.getAttribute("data-id") || actEl.getAttribute("data-id") || "";

          try {
            if (act === "goto-dash") {
              goHome();
              return;
            }
            if (act === "add-project") {
              const f = actEl.getAttribute("data-f") || "work";
              state.filter = f;
              beginInlineProjectCreate(f);
              return;
            }
            if (act === "edit-project") {
              projectForm((state.data.projects || []).find((p) => p.id === id));
              return;
            }
            if (act === "del-project") {
              if (!confirm("Delete project and its tasks/info/attachments?"))
                return;
              await api("/api/projects/" + encodeURIComponent(id), {
                method: "DELETE",
              });
              toast("Deleted");
              await refresh();
              return;
            }
            if (act === "add-task") {
              const pid = actEl.getAttribute("data-pid") || id;
              const f = actEl.getAttribute("data-f") || state.filter || "work";
              beginInlineTaskCreate({ project_id: pid, filter: f });
              return;
            }
            if (act === "inline-save") {
              await commitInlineCreate();
              return;
            }
            if (act === "inline-cancel") {
              cancelInlineCreate();
              return;
            }
            if (act === "add-section") {
              const pid = actEl.getAttribute("data-pid") || id;
              beginInlineSectionCreate(pid);
              return;
            }
            if (act === "edit-section") {
              const sec = findSection(id);
              if (!sec) return;
              if (isGeneralSection(sec)) {
                toast("General cannot be edited");
                return;
              }
              sectionForm(sec);
              return;

              await deleteSectionById(id);
              return;
            }
            if (act === "edit-task") {
              taskForm((state.data.tasks || []).find((t) => t.id === id));
              return;
            }
            if (act === "copy-task") {
              copyTaskById(id);
              return;
            }
            if (act === "cut-task") {
              cutTaskById(id);
              return;
            }
            if (act === "del-task") {
              if (!confirm("Delete task and its info/attachments?")) return;
              await api("/api/tasks/" + encodeURIComponent(id), {
                method: "DELETE",
              });
              toast("Deleted");
              await refresh();
              return;
            }
            if (act === "emoji") {
              const key = actEl.getAttribute("data-key");
              const t = (state.data.tasks || []).find((x) => x.id === id);
              if (t?.kind === "habitual" && (key === "done" || key === "✅")) {
                toast("Habits cannot be completed");
                return;
              }
              await api("/api/tasks/" + encodeURIComponent(id) + "/emoji", {
                method: "POST",
                body: JSON.stringify({ key }),
              });
              await refresh();
              return;
            }
            if (act === "habit-to-personal") {
              await sendHabitToPersonal(id);
              return;
            }
            if (act === "info-project") {
              infoListModal("project", id);
              return;
            }
            if (act === "info-task") {
              const t = (state.data.tasks || []).find((x) => x.id === id);
              if (t) state.projectId = t.project_id;
              infoListModal("task", id);
              return;
            }
            if (act === "add-info") {
              infoForm(null);
              return;
            }
            if (act === "edit-info") {
              infoForm((state.data.info_points || []).find((i) => i.id === id));
              return;
            }
            if (act === "del-info") {
              if (!confirm("Delete info?")) return;
              await api("/api/info/" + encodeURIComponent(id), {
                method: "DELETE",
              });
              toast("Deleted");
              await refresh();
              return;
            }
            if (act === "paste-att") {
              const ptype = actEl.getAttribute("data-ptype");
              const pid = actEl.getAttribute("data-pid");
              state._attTarget = { ptype, pid };
              const inp = document.createElement("input");
              inp.type = "file";
              inp.accept = "image/*";
              inp.onchange = async () => {
                if (inp.files?.[0]) await uploadImage(ptype, pid, inp.files[0]);
              };
              inp.click();
              return;
            }
          } catch (err) {
            toast(err.message || String(err));
          }
        });

        document.addEventListener("paste", async (e) => {
          const items = e.clipboardData?.items;
          if (!items) return;
          let file = null;
          for (const it of items) {
            if (it.type.startsWith("image/")) {
              file = it.getAsFile();
              break;
            }
          }
          if (!file) return;
          const target = resolveAttachmentTarget() || state._attTarget;
          if (!target?.ptype || !target?.pid) return;
          e.preventDefault();
          await uploadImage(target.ptype, target.pid, file);
        });

        function clickModalSave() {

        document.addEventListener("keydown", async (e) => {
          if (
            (e.ctrlKey || e.metaKey) &&
            (e.key === "Enter" ||
              e.code === "Enter" ||
              e.code === "NumpadEnter")
          ) {
            if (clickModalSave()) {
              e.preventDefault();
              e.stopPropagation();
              return;
            }
            if (e.target?.id === "inlineTitle" && state.inlineCreate) {
              e.preventDefault();
              e.stopPropagation();
              try {
                await commitInlineCreate();
              } catch (err) {
                toast(err.message || String(err));
              }
              return;
            }
          }
          if (e.ctrlKey || e.metaKey) {
            const tag = (e.target?.tagName || "").toLowerCase();
            const inField =
              tag === "input" ||
              tag === "textarea" ||
              tag === "select" ||
              e.target?.isContentEditable;
            if (inField) return;
            const k = (e.key || "").toLowerCase();
            if (state.infoUi === "list") {
              if (k === "c" || e.code === "KeyC") {
                e.preventDefault();
                e.stopPropagation();
                try {
                  await copySelectedInfo();
                } catch (err) {
                  toast(err.message || String(err));
                }
              }
              return;
            }
            if (modalOpen()) return;
            if (k === "c" || e.code === "KeyC") {
              e.preventDefault();
              e.stopPropagation();
              copyTaskById(selectedTaskId() || hoveredTaskId());
              return;
            }
            if (k === "x" || e.code === "KeyX") {
              e.preventDefault();
              e.stopPropagation();
              cutTaskById(selectedTaskId() || hoveredTaskId());
              return;
            }
            if (k === "v" || e.code === "KeyV") {
              e.preventDefault();
              e.stopPropagation();
              try {
                await pasteCopiedTask();
              } catch (err) {
                toast(err.message || String(err));
              }
              return;
            }
            return;
          }
          if (e.altKey) {
            const isS =
              e.code === "KeyS" || (e.key || "").toLowerCase() === "s";
            if (isS) {
              e.preventDefault();
              e.stopPropagation();
              focusSearch();
            }
            return;
          }
          const tag = (e.target?.tagName || "").toLowerCase();
          const inField =
            tag === "input" ||
            tag === "textarea" ||
            tag === "select" ||
            e.target?.isContentEditable;
          if (inField) {
            if (e.key === "Escape") {
              e.preventDefault();
              handleEscape();
              return;
            }
            if (
              e.key === "Backspace" &&
              e.target?.id === "inlineTitle" &&
              !(e.target.value || "")
            ) {
              e.preventDefault();
              cancelInlineCreate();
              return;
            }
            if (
              e.target?.id === "globalSearch" &&
              e.shiftKey &&
              shiftCmdFromEvent(e) === "j"
            ) {
              e.preventDefault();
              e.stopPropagation();
              e.target.blur();
              toggleFirstPersonalWork();
              return;
            }
            return;
          }

          if (e.key === "Escape") {
            e.preventDefault();
            handleEscape();
            return;
          }

          if (
            e.shiftKey &&
            shiftCmdFromEvent(e) === "v" &&
            (state.infoUi === "list" || state.infoUi === "form")
          ) {
            e.preventDefault();
            e.stopPropagation();
            try {
              await pasteClipboardImageToSelection();
            } catch (err) {
              toast(err.message || String(err));
            }
            return;
          }

          if (state.infoUi === "list") {
            if (e.shiftKey && shiftCmdFromEvent(e) === "e") {
              e.preventDefault();
              e.stopPropagation();
              const row = (state.data.info_points || []).find(
                (i) => i.id === state.infoSelId,
              );
              if (!row) {
                toast("Select an info point first");
                return;
              }
              infoForm(row);
              return;
            }
            if (
              e.key === "Enter" &&
              e.shiftKey &&
              !e.ctrlKey &&
              !e.metaKey &&
              !e.altKey
            ) {
              e.preventDefault();
              e.stopPropagation();
              const row = (state.data.info_points || []).find(
                (i) => i.id === state.infoSelId,
              );
              if (!row) {
                toast("Select an info point first");
                return;
              }
              const hit = infoHyperlink(row);
              if (!hit) {
                toast("No link on this info");
                return;
              }
              try {
                await openHyperlink(hit);
              } catch (err) {
                toast(err.message || String(err));
              }
              return;
            }
            if (e.key === "Enter") {
              e.preventDefault();
              infoForm(null);
              return;
            }
            if (e.key === "Delete") {
              e.preventDefault();
              await deleteInfoPoint(state.infoSelId);
              return;
            }
            if (e.key === "ArrowDown") {
              e.preventDefault();
              moveInfoSel(1);
              return;
            }
            if (e.key === "ArrowUp") {
              e.preventDefault();
              moveInfoSel(-1);
              return;
            }
            if (e.key === "Backspace") {
              e.preventDefault();
              dismissInfoModal();
              return;
            }
            return;
          }

          if (e.key === "Backspace") {
            e.preventDefault();
            goBack();
            return;
          }

          if (modalOpen()) return;

          if (e.shiftKey) {
            const cmd = shiftCmdFromEvent(e);
            if (cmd) {
              e.preventDefault();
              e.stopPropagation();
              try {
                await runShiftCommand(cmd);
              } catch (err) {
                toast(err.message || String(err));
              }
            }
            return;
          }

          if (e.key === "ArrowDown") {
            e.preventDefault();
            moveSelection(1);
            return;
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            moveSelection(-1);
            return;
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            hierarchyNav(1);
            return;
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            hierarchyNav(-1);
            return;
          }
          if (e.key === "Home") {
            e.preventDefault();
            const targets = collectTargets();
            if (targets.length)
              setSelection(targets[0].kind, targets[0].id, false);
            scrollToPageHeader();
            return;
          }
          if (e.key === "End") {
            e.preventDefault();
            const targets = collectTargets();
            if (targets.length)
              setSelection(
                targets[targets.length - 1].kind,
                targets[targets.length - 1].id,
                true,
              );
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            editSelection();
            return;
          }
          if (e.key === "Delete") {
            e.preventDefault();
            try {
              await deleteSelection();
            } catch (err) {
              toast(err.message || String(err));
            }
            return;
          }

          if (/^[a-z0-9]$/i.test(e.key)) {
            e.preventDefault();
            letterJump(e.key.toLowerCase());
            return;
          }
        });

        // boot
        document.addEventListener("toggle", (e) => {
          const proj = e.target;
          if (!(proj instanceof HTMLDetailsElement)) return;
          if (!proj.classList.contains("project")) return;
          const id = proj.getAttribute("data-id");
          if (!id) return;
          if (proj.open) state.collapsedProjects.delete(id);
          else state.collapsedProjects.add(id);
        });
        const searchInp = $("#globalSearch");
        if (searchInp) {
          searchInp.value = state.search || "";
          searchInp.addEventListener("input", () => {
            applySearch(searchInp.value);
          });
        }
        refresh().catch((err) => {
          $("#hdrSub").textContent = err.message;
          toast(err.message);
        });
      })();
    </script>
  </body>
</html>
