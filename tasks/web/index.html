        function focusSearch() {
          const inp = $("#globalSearch");
          if (!inp) return;
          inp.focus();
          inp.select();
        }

        function shiftCmdFromEvent(e) {
          const code = e.code || "";
          if (code === "Digit1" || code === "Numpad1") return "1";
          if (code === "Digit2" || code === "Numpad2") return "2";
          if (code === "Digit3" || code === "Numpad3") return "3";
          if (code.startsWith("Key") && code.length === 4)
            return code.slice(3).toLowerCase();
          const k = (e.key || "").toLowerCase();
          if (k.length === 1 && /[a-z0-9]/.test(k)) return k;
          if (k === "!" || k === "@" || k === "#") {
            if (k === "!") return "1";
            if (k === "@") return "2";
            if (k === "#") return "3";
          }
          return "";
        }

        function clearSearch() {
          state.search = "";
          const inp = $("#globalSearch");
          if (inp) inp.value = "";
        }

        function applySearch(query) {
          state.search = query ?? "";
          if (state.view === "dashboard" && state.data) renderDashboard();
          else updateFocusLbl();
        }

        function render() {
          if (!state.data) return;
          const c = state.data.counts || {};
          $("#hdrSub").textContent =
            `${c.projects || 0} projects · ${c.tasks || 0} tasks · ${c.info || 0} info · ${c.open || 0} open`;
          renderToolbar();
          if (state.view === "import") renderImport();
          else renderDashboard();
        }

        function scrollToSection(filt) {
          const el = document.getElementById(
            filt === "habits" ? "sec-habits" : "sec-" + filt,
          );
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function updateFocusLbl() {
          const lbl = $("#emojiFilterLbl");
          if (!lbl) return;
          const parts = [];
          if (state.sectionFocus) {
            const name =
              state.sectionFocus === "work"
                ? "Work"
                : state.sectionFocus === "personal"
                  ? "Personal"
                  : "Habits";
            parts.push(name + " only");
          }
          if (state.emojiFilter) {
            parts.push(
              (EMOJI_LABELS[state.emojiFilter] || state.emojiFilter) + " emoji",
            );
          }
          if (searchNeedle()) {
            parts.push('search "' + state.search.trim() + '"');
          }
          lbl.textContent = parts.length
            ? "Showing " + parts.join(" · ") + " — Esc clears"
            : "";
        }

        function applySectionFocus(filt, opts = {}) {
          const toggle = !!opts.toggle;
          if (toggle && filt && state.sectionFocus === filt) filt = "";
          state.sectionFocus = filt || "";
          const personal = document.getElementById("sec-personal");
          const work = document.getElementById("sec-work");
          const habits = document.getElementById("sec-habits");
          const top = document.querySelector(".top-row");
          const f = state.sectionFocus;
          if (personal) {
            personal.classList.toggle(
              "section-hidden",
              !!f && f !== "personal",
            );
            personal.classList.toggle("bento", f === "personal");
          }
          if (work) {
            work.classList.toggle("section-hidden", !!f && f !== "work");
            work.classList.toggle("bento", f === "work");
          }
          if (habits) {
            habits.classList.toggle("section-hidden", !!f && f !== "habits");
            habits.classList.toggle("bento", f === "habits");
          }
          if (top) {
            top.classList.toggle(
              "section-solo",
              f === "work" || f === "personal",
            );
            top.classList.toggle("section-hidden", f === "habits");
          }
          updateFocusLbl();
          if (f) scrollToSection(f);
          applySelection(true);
        }

        function titleFirstChar(title) {
          const m = String(title || "")
            .normalize("NFKC")
            .match(/[A-Za-z0-9]/);
          return m ? m[0].toLowerCase() : "";
        }

        function collectTargets() {
          const out = [];
          const pushProj = (proj) => {
            if (proj.classList.contains("emoji-hidden")) return;
            const id =
              proj.getAttribute("data-id") || proj.getAttribute("data-pid");
            if (!id) return;
            const title =
              proj.querySelector(".proj-title")?.textContent?.trim() || "";
            out.push({ kind: "project", id, title, el: proj });
            if (!proj.open) return;
            proj
              .querySelectorAll(":scope > .task-section:not(.emoji-hidden)")
              .forEach((sec) => {
                const sid = sec.getAttribute("data-id");
                if (!sid) return;
                const stitle =
                  sec
                    .querySelector(".task-section-label")
                    ?.textContent?.trim() || "";
                out.push({ kind: "section", id: sid, title: stitle, el: sec });
                if (sec.classList.contains("collapsed")) return;
                sec
                  .querySelectorAll(".task:not(.emoji-hidden)")
                  .forEach((t) => {
                    const tid = t.getAttribute("data-id");
                    if (!tid) return;
                    out.push({
                      kind: "task",
                      id: tid,
                      title:
                        t.querySelector(".title")?.textContent?.trim() || "",
                      el: t,
                    });
                  });
              });
            // tasks not wrapped in a section (legacy / empty layouts)
            proj
              .querySelectorAll(
                ":scope > .task-list > .task:not(.emoji-hidden)",
              )
              .forEach((t) => {
                const tid = t.getAttribute("data-id");
                if (!tid) return;
                out.push({
                  kind: "task",
                  id: tid,
                  title: t.querySelector(".title")?.textContent?.trim() || "",
                  el: t,
                });
              });
          };
          ["sec-personal", "sec-work"].forEach((sid) => {
            const sec = document.getElementById(sid);
            if (!sec || sec.classList.contains("section-hidden")) return;
            sec
              .querySelectorAll("details.project")
              .forEach((proj) => pushProj(proj));
          });
          const habitsSec = document.getElementById("sec-habits");
          if (habitsSec && !habitsSec.classList.contains("section-hidden")) {
            habitsSec
              .querySelectorAll(".habit-row:not(.emoji-hidden)")
              .forEach((h) => {
                if (h.closest(".habit-card.emoji-hidden")) return;
                const id = h.getAttribute("data-id");
                if (!id) return;
                out.push({
                  kind: "habit",
                  id,
                  title: h.querySelector(".title")?.textContent?.trim() || "",
                  el: h,
                });
              });
          }
          return out;
        }

        function setProjectExpanded(id, expanded) {
          if (expanded) state.collapsedProjects.delete(id);
          else state.collapsedProjects.add(id);
          const el = document.querySelector(
            `details.project[data-id="${CSS.escape(id)}"]`,
          );
          if (el) el.open = !!expanded;
        }

        function setSectionExpanded(id, expanded) {
          if (expanded) state.collapsedSections.delete(id);
          else state.collapsedSections.add(id);
          const el = document.querySelector(
            `.task-section[data-id="${CSS.escape(id)}"]`,
          );
          if (el) el.classList.toggle("collapsed", !expanded);
        }

        function hierarchyNav(dir) {
          if (!state.sel) return;
          const targets = collectTargets();
          const idx = targets.findIndex(
            (t) =>
              state.sel && t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (idx < 0) return;
          const hit = targets[idx];

          if (hit.kind === "project") {
            if (dir > 0) {
              if (!hit.el.open) {
                setProjectExpanded(hit.id, true);
                applySelection(true);
                return;
              }
              const next = targets[idx + 1];
              if (next && next.el.closest("details.project") === hit.el)
                setSelection(next.kind, next.id, true);
              return;
            }
            if (hit.el.open) {
              setProjectExpanded(hit.id, false);
              applySelection(true);
            }
            return;
          }

          if (hit.kind === "section") {
            if (dir > 0) {
              if (hit.el.classList.contains("collapsed")) {
                setSectionExpanded(hit.id, true);
                applySelection(true);
                return;
              }
              const next = targets[idx + 1];
              if (next && next.el.closest(".task-section") === hit.el)
                setSelection(next.kind, next.id, true);
              return;
            }
            if (!hit.el.classList.contains("collapsed")) {
              setSectionExpanded(hit.id, false);
              applySelection(true);
              return;
            }
            const proj = hit.el.closest("details.project");
            const pid =
              proj?.getAttribute("data-id") || proj?.getAttribute("data-pid");
            if (pid) setSelection("project", pid, true);
            return;
          }

          if (hit.kind === "task") {
            if (dir < 0) {
              const sec = hit.el.closest(".task-section");
              const sid = sec?.getAttribute("data-id");
              if (sid) {
                setSelection("section", sid, true);
                return;
              }
              const proj = hit.el.closest("details.project");
              const pid =
                proj?.getAttribute("data-id") || proj?.getAttribute("data-pid");
              if (pid) setSelection("project", pid, true);
            }
          }
        }

        function applySelection(scroll) {
          document
            .querySelectorAll(".kb-selected")
            .forEach((el) => el.classList.remove("kb-selected"));
          if (!state.sel) return;
          const targets = collectTargets();
          const hit = targets.find(
            (t) => t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (!hit) {
            state.sel = null;
            return;
          }
          hit.el.classList.add("kb-selected");
          if (scroll)
            hit.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }

        function setSelection(kind, id, scroll) {
          if (!kind || !id) {
            state.sel = null;
            applySelection(false);
            return;
          }
          state.sel = { kind, id };
          applySelection(scroll !== false);
        }

        function moveSelection(delta) {
          const targets = collectTargets();
          if (!targets.length) return;
          let idx = targets.findIndex(
            (t) =>
              state.sel && t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (idx < 0) {
            idx = delta > 0 ? 0 : targets.length - 1;
          } else {
            idx = (idx + delta + targets.length) % targets.length;
          }
          setSelection(targets[idx].kind, targets[idx].id, true);
        }

        function letterJump(ch) {
          const targets = collectTargets().filter(
            (t) => titleFirstChar(t.title) === ch,
          );
          if (!targets.length) return;
          let idx = targets.findIndex(
            (t) =>
              state.sel && t.kind === state.sel.kind && t.id === state.sel.id,
          );
          idx = idx < 0 ? 0 : (idx + 1) % targets.length;
          setSelection(targets[idx].kind, targets[idx].id, true);
        }

        function currentPwSide() {
          if (!state.sel) return state.pwSide || "personal";
          const targets = collectTargets();
          const hit = targets.find(
            (t) => t.kind === state.sel.kind && t.id === state.sel.id,
          );
          if (hit?.el?.closest("#sec-personal")) return "personal";
          if (hit?.el?.closest("#sec-work")) return "work";
          return state.pwSide || "personal";
        }

        function firstTargetInCategory(filt) {
          const sec = document.getElementById("sec-" + filt);
          if (!sec || sec.classList.contains("section-hidden")) return null;
          return (
            collectTargets().find((t) => t.el.closest("#sec-" + filt)) || null
          );
        }

        function toggleFirstPersonalWork() {
          const from = currentPwSide();
          const next = from === "personal" ? "work" : "personal";
          if (state.sectionFocus === "habits" || state.sectionFocus === from) {
            applySectionFocus(next);
          } else if (state.sectionFocus && state.sectionFocus !== next) {
            applySectionFocus(next);
          }
          let hit = firstTargetInCategory(next);
          if (!hit) {
            applySectionFocus(next);
            hit = firstTargetInCategory(next);
          }
          if (!hit) {
            toast("No " + (next === "work" ? "Work" : "Personal") + " items");
            return;
          }
          state.pwSide = next;
          setSelection(hit.kind, hit.id, true);
        }

        function selectedTaskId() {
          if (!state.sel) return "";
          if (state.sel.kind === "task" || state.sel.kind === "habit")
            return state.sel.id;
          return "";
        }

        function selectedHabitId() {
          if (state.sel?.kind === "habit") return state.sel.id;
          if (state.sel?.kind === "task") {
            const t = (state.data.tasks || []).find(
              (x) => x.id === state.sel.id,
            );
            if (t?.kind === "habitual") return t.id;
          }
          return "";
        }

        async function sendHabitToPersonal(habitId) {
          const r = await api(
            "/api/tasks/" + encodeURIComponent(habitId) + "/to-personal",
            { method: "POST", body: "{}" },
          );
          toast("Sent to Personal · General");
          await refresh();
          applySectionFocus("personal");
          if (r.task?.id) setSelection("task", r.task.id, true);
        }

        function selectedProjectId() {
          if (!state.sel) return "";
          if (state.sel.kind === "project") return state.sel.id;
          if (state.sel.kind === "task") {
            const t = (state.data.tasks || []).find(
              (x) => x.id === state.sel.id,
            );
            return t?.project_id || "";
          }
          return "";
        }

        async function runShiftCommand(key) {
          const k = key.toLowerCase();
          if (k === "1") {
            applySectionFocus("work", { toggle: true });
            return;
          }
          if (k === "2") {
            applySectionFocus("personal", { toggle: true });
            return;
          }
          if (k === "3") {
            applySectionFocus("habits", { toggle: true });
            return;
          }
          if (k === "e") {
            const nodes = document.querySelectorAll("details.project");
            const openAll = Array.from(nodes).some((n) => !n.open);
            if (openAll) {
              state.collapsedProjects.clear();
              state.collapsedSections.clear();
              nodes.forEach((n) => {
                n.open = true;
              });
              document
                .querySelectorAll(".task-section.collapsed")
                .forEach((s) => s.classList.remove("collapsed"));
            } else {
              nodes.forEach((n) => {
                const id = n.getAttribute("data-id");
                if (id) state.collapsedProjects.add(id);
                n.open = false;
              });
            }
            applySelection(false);
            return;
          }
          if (k === "j") {
            toggleFirstPersonalWork();
            return;
          }
          if (EMOJI_KEYS[k]) {
            const em = EMOJI_KEYS[k];
            applyEmojiFilter(state.emojiFilter === em ? "" : em);
            applySelection(true);
            return;
          }
          if (k === "f") {
            applyEmojiFilter("");
            applySelection(false);
            return;
          }
          if (k === "c") {
            const tid = selectedTaskId();
            if (!tid) {
              toast("Select a task first");
              return;
            }
            await api("/api/tasks/" + encodeURIComponent(tid) + "/emoji", {
              method: "POST",
              body: JSON.stringify({ key: "done" }),
            });
            await refresh();
            return;
          }
          if (k === "d") {
            const tid = selectedHabitId();
            if (!tid) {
              toast("Select a habit first");
              return;
            }
            await sendHabitToPersonal(tid);
            return;
          }
          if (k === "i") {
            const tid = selectedTaskId();
            if (!tid) {
              toast("Select a task first");
              return;
            }
            await api("/api/tasks/" + encodeURIComponent(tid) + "/emoji", {
              method: "POST",
              body: JSON.stringify({ key: "important" }),
            });
            await refresh();
            return;
          }
          if (k === "a") {
            const pid = selectedProjectId();
            if (pid) {
              const p = (state.data.projects || []).find((x) => x.id === pid);
              beginInlineTaskCreate({
                project_id: pid,
                filter: p?.filter || state.filter || "work",
              });
            } else if (
              state.sel?.kind === "section" ||
              state.sectionFocus === "personal" ||
              state.sectionFocus === "work" ||
              state.sectionFocus === "habits"
            ) {
              beginInlineTaskCreate({});
            } else {
              projectForm(null);
            }
            return;
          }
          if (k === "b") {
            const pid = selectedProjectId();
            if (!pid) {
              toast("Select a project first");
              return;
            }
            await promptAddSection(pid);
            return;
          }
          if (k === "n") {
            if (state.sel?.kind === "project") {
              infoListModal("project", state.sel.id);
              return;
            }
            const tid = selectedTaskId();
            if (tid) {
              const t = (state.data.tasks || []).find((x) => x.id === tid);
              if (t) state.projectId = t.project_id;
              infoListModal("task", tid);
              return;
            }
            toast("Select a project or task");
            return;
          }
          if (k === "v") {
            let ptype = "";
            let pid = "";
            if (state.sel?.kind === "project") {
              ptype = "project";
              pid = state.sel.id;
            } else if (selectedTaskId()) {
              ptype = "task";
              pid = selectedTaskId();
            }
            if (!pid) {
              toast("Select a project or task");
              return;
            }
            state._attTarget = { ptype, pid };
            const inp = document.createElement("input");
            inp.type = "file";
            inp.accept = "image/*";
            inp.onchange = async () => {
              if (inp.files?.[0]) await uploadImage(ptype, pid, inp.files[0]);
            };
            inp.click();
            return;
          }
          if (k === "p") {
            state.view = "import";
            state.importPreview = null;
            render();
            return;
          }
          if (k === "m") {
            await runMigrateMd();
            return;
          }
          if (k === "h") {
            helpModal();
            return;
          }
        }

        async function runMigrateMd() {
          if (!confirm("Overwrite tasks CSV from notes MD files?")) return;
          const r = await api("/api/migrate", {
            method: "POST",
            body: "{}",
          });
          toast(r.message || "Migrated");
          await refresh();
        }

        async function deleteSelection() {
          if (!state.sel) {
            toast("Nothing selected");
            return;
          }
          if (state.sel.kind === "project") {
            if (!confirm("Delete project and its tasks/info/attachments?"))
              return;
            await api("/api/projects/" + encodeURIComponent(state.sel.id), {
              method: "DELETE",
            });
            state.sel = null;
            toast("Deleted");
            await refresh();
            return;
          }
          if (state.sel.kind === "task" || state.sel.kind === "habit") {
            if (!confirm("Delete task and its info/attachments?")) return;
            await api("/api/tasks/" + encodeURIComponent(state.sel.id), {
              method: "DELETE",
            });
            state.sel = null;
            toast("Deleted");
            await refresh();
          }
        }

        function editSelection() {
          if (!state.sel) return;
          if (state.sel.kind === "project") {
            projectForm(
              (state.data.projects || []).find((p) => p.id === state.sel.id),
            );
            return;
          }
          if (state.sel.kind === "section") return;
          taskForm((state.data.tasks || []).find((t) => t.id === state.sel.id));
        }

        function goHome() {
          cancelInlineCreate();
          if (!$("#lightbox")?.hidden) {
            $("#lightbox").hidden = true;
            const img = $("#lightbox")?.querySelector("img");
            if (img) img.src = "";
          }
          if (modalOpen()) closeModal();
          state.view = "dashboard";
          state.importPreview = null;
          if (searchNeedle()) clearSearch();
          if (state.emojiFilter) applyEmojiFilter("");
          if (state.sectionFocus) applySectionFocus("");
          if (state.sel) setSelection(null, null, false);
          if (state.data) render();
        }

        function goBack() {
          if (state.inlineCreate) {
            cancelInlineCreate();
            return true;
          }
          if (!$("#lightbox")?.hidden) {
            $("#lightbox").hidden = true;
            const img = $("#lightbox")?.querySelector("img");
            if (img) img.src = "";
            return true;
          }
          if (modalOpen()) {
            closeModal();
            return true;
          }
          if (state.view === "import") {
            goHome();
            return true;
          }
          if (searchNeedle()) {
            clearSearch();
            if (state.view === "dashboard" && state.data) renderDashboard();
            return true;
          }
          if (state.emojiFilter) {
            applyEmojiFilter("");
            applySelection(false);
            return true;
          }
          if (state.sectionFocus) {
            applySectionFocus("");
            return true;
          }
          if (state.sel) {
            setSelection(null, null, false);
            return true;
          }
          return false;
        }

        function modalOpen() {
          return !!$("#modalHost")?.innerHTML;
        }

        function infoListModal(parentType, parentId) {
          state.projectId =
            parentType === "project" ? parentId : state.projectId;
          state.taskId = parentType === "task" ? parentId : "";
          const rows = (state.data.info_points || []).filter(
            (i) => i.parent_type === parentType && i.parent_id === parentId,
          );
          modal(`<div class="modal"><h3>Info</h3>
      <div class="toolbar" style="padding:0 0 10px">
        <button class="btn" data-m="add-info-here">+ Info</button>
        <button class="btn" data-m="cancel">Close</button>
      </div>
      <ul class="plain-list">${
        rows
          .map(
            (i) => `<li class="plain-row" data-id="${esc(i.id)}">
        <span class="title">${esc(i.title)}</span>
        <span class="row-actions">
          <button class="btn" data-act="edit-info">Edit</button>
          <button class="btn danger" data-act="del-info">Del</button>
        </span>
      </li>`,
          )
          .join("") || '<p class="empty">No info points</p>'
      }</ul></div>`);
          $("#modalHost").onclick = async (e) => {
            if (
              e.target.dataset.m === "cancel" ||
              e.target.classList.contains("modal-bg")
            ) {
              closeModal();
              return;
            }
            if (e.target.dataset.m === "add-info-here") {
              closeModal();
              infoForm(null);
              return;
            }
            const actEl = e.target.closest("[data-act]");
            if (!actEl) return;
            const act = actEl.getAttribute("data-act");
            const id =
              e.target.closest("[data-id]")?.getAttribute("data-id") || "";
            if (act === "edit-info") {
              closeModal();
              infoForm((state.data.info_points || []).find((i) => i.id === id));
            }
            if (act === "del-info") {
              if (!confirm("Delete info?")) return;
              try {
                await api("/api/info/" + encodeURIComponent(id), {
                  method: "DELETE",
                });
                toast("Deleted");
                await refresh();
                infoListModal(parentType, parentId);
              } catch (err) {
                toast(err.message);
              }
            }
          };
        }

        function applyEmojiFilter(emoji) {
          state.emojiFilter = emoji || "";
          document.querySelectorAll(".task, .habit-row").forEach((el) => {
            const match =
              !state.emojiFilter ||
              el.getAttribute("data-emoji") === state.emojiFilter;
            el.classList.toggle("emoji-hidden", !match);
          });
          document.querySelectorAll("details.project").forEach((proj) => {
            if (!state.emojiFilter) {
              proj.classList.remove("emoji-hidden");
              return;
            }
            const visible = proj.querySelectorAll(
              ".task:not(.emoji-hidden)",
            ).length;
            proj.classList.toggle("emoji-hidden", visible === 0);
            if (visible > 0) proj.open = true;
          });
          document.querySelectorAll(".task-section").forEach((sec) => {
            if (!state.emojiFilter) {
              sec.classList.remove("emoji-hidden");
              return;
            }
            const visible = sec.querySelectorAll(
              ".task:not(.emoji-hidden)",
            ).length;
            sec.classList.toggle("emoji-hidden", visible === 0);
          });
          document.querySelectorAll(".habit-card").forEach((card) => {
            if (!state.emojiFilter) {
              card.classList.remove("emoji-hidden");
              return;
            }
            const visible = card.querySelectorAll(
              ".habit-row:not(.emoji-hidden)",
            ).length;
            card.classList.toggle("emoji-hidden", visible === 0);
          });
          const lbl = $("#emojiFilterLbl");
          if (lbl) updateFocusLbl();
          document.querySelectorAll(".emoji-chip").forEach((chip) => {
            chip.classList.toggle(
              "active",
              !!state.emojiFilter &&
                chip.getAttribute("data-emoji") === state.emojiFilter,
            );
          });
          applySelection(false);
        }

        function modal(html) {
          const host = $("#modalHost");
          host.innerHTML = `<div class="modal-bg">${html}</div>`;
          return host;
        }
        function closeModal() {
          $("#modalHost").innerHTML = "";
        }

        function projectForm(existing) {
          modal(`<div class="modal"><h3>${existing ? "Edit" : "Add"} project</h3>
      <label>Title</label><input id="mTitle" value="${esc(existing?.title || "")}"/>
      <label>Filter</label><select id="mFilt">
        ${["work", "personal", "habits"].map((f) => `<option value="${f}" ${(existing?.filter || state.filter) === f ? "selected" : ""}>${f}</option>`).join("")}
      </select>
      <label>Section path</label><input id="mSec" value="${esc(existing?.section_path || "")}"/>
      <div class="modal-actions">
        <button class="btn" data-m="cancel">Cancel</button>
        <button class="btn" data-m="save-project">Save</button>
      </div></div>`);
          $("#modalHost").onclick = async (e) => {
            if (
              e.target.dataset.m === "cancel" ||
              e.target.classList.contains("modal-bg")
            )
              closeModal();
            if (e.target.dataset.m === "save-project") {
              try {
                await api("/api/projects", {
                  method: "POST",
                  body: JSON.stringify({
                    id: existing?.id || "",
                    title: $("#mTitle").value,
                    filter: $("#mFilt").value,
                    section_path: $("#mSec").value,
                  }),
                });
                closeModal();
                toast("Saved");
                await refresh();
              } catch (err) {
                toast(err.message);
              }
            }
          };
        }

        function inboxTitleFor(filt) {
          if (filt === "personal") return "Personal inbox";
          if (filt === "habits") return "Habits & Health";
          return "Work inbox";
        }

        function resolveTaskCreateContext(hint = {}) {
          let project_id = (hint.project_id || "").trim();
          let section_id = (hint.section_id || "").trim();
          let filter = (hint.filter || "").trim().toLowerCase();
          let kind = (hint.kind || "punctual").trim().toLowerCase();

          if (state.sel?.kind === "section") {
            const sec = (state.data.sections || []).find(
              (s) => s.id === state.sel.id,
            );
            if (sec) {
              project_id = project_id || sec.project_id;
              section_id = section_id || sec.id;
              const p = (state.data.projects || []).find(
                (x) => x.id === sec.project_id,
              );
              filter = filter || p?.filter || "";
            }
          } else if (
            state.sel?.kind === "task" ||
            state.sel?.kind === "habit"
          ) {
            const t = (state.data.tasks || []).find(
              (x) => x.id === state.sel.id,
            );
            if (t) {
              project_id = project_id || t.project_id;
              section_id = section_id || t.section_id;
              filter = filter || t.filter || "";
            }
          } else if (state.sel?.kind === "project") {
            project_id = project_id || state.sel.id;
            const p = (state.data.projects || []).find(
              (x) => x.id === project_id,
            );
            filter = filter || p?.filter || "";
          }

          if (!filter) {
            if (
              state.sectionFocus === "personal" ||
              state.sectionFocus === "work" ||
              state.sectionFocus === "habits"
            )
              filter = state.sectionFocus;
            else filter = state.pwSide || state.filter || "work";
          }
          if (!["work", "personal", "habits"].includes(filter)) filter = "work";

          if (!project_id) {
            const want = inboxTitleFor(filter).toLowerCase();
            const p =
              projectsFor(filter).find(
                (x) => (x.title || "").trim().toLowerCase() === want,
              ) || projectsFor(filter)[0];
            project_id = p?.id || "";
          } else {
            const p = (state.data.projects || []).find(
              (x) => x.id === project_id,
            );
            if (p?.filter) filter = p.filter;
          }

          if (!section_id && project_id) {
            const secs = sectionsFor(project_id);
            section_id =
              secs.find((s) => (s.title || "").toLowerCase() === "general")
                ?.id ||
              secs[0]?.id ||
              "";
          }

          return { project_id, section_id, filter, kind };
        }

        function cancelInlineCreate() {
          state.inlineCreate = null;
          const bar = $("#inlineCreate");
          if (bar) {
            bar.classList.remove("active");
            bar.innerHTML = "";
            bar.setAttribute("aria-hidden", "true");
          }
        }

        function renderInlineCreateBar() {
          const bar = $("#inlineCreate");
          if (!bar || !state.inlineCreate) {
            cancelInlineCreate();
            return;
          }
          const ctx = state.inlineCreate;
          const p = (state.data.projects || []).find(
            (x) => x.id === ctx.project_id,
          );
          const s = (state.data.sections || []).find(
            (x) => x.id === ctx.section_id,
          );
          const where = [p?.title || "Project", s?.title || "General"]
            .filter(Boolean)
            .join(" · ");
          bar.classList.add("active");
          bar.setAttribute("aria-hidden", "false");
          bar.innerHTML = `
      <span class="ctx"><strong>${esc(ctx.filter)}</strong> · ${esc(where)}</span>
      <input type="text" id="inlineTitle" placeholder="Task title — Enter to add, Backspace to cancel" autocomplete="off" />
      <button type="button" class="btn" data-act="inline-save">Add</button>
      <button type="button" class="btn" data-act="inline-cancel">Cancel</button>`;
          const inp = $("#inlineTitle");
          inp?.focus();
          inp?.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              e.stopPropagation();
              try {
                await commitInlineCreate();
              } catch (err) {
                toast(err.message || String(err));
              }
            }
          });
        }

        async function beginInlineTaskCreate(hint = {}) {
          if (state.view !== "dashboard") {
            state.view = "dashboard";
            await refresh();
          }
          let ctx = resolveTaskCreateContext(hint);
          if (!ctx.project_id) {
            const r = await api("/api/projects", {
              method: "POST",
              body: JSON.stringify({
                title: inboxTitleFor(ctx.filter),
                filter: ctx.filter,
              }),
            });
            await refresh();
            ctx = resolveTaskCreateContext({
              ...hint,
              project_id: r.project.id,
              filter: ctx.filter,
            });
          }
          if (!ctx.project_id) {
            toast("No project available");
            return;
          }
          if (!ctx.section_id) {
            await refresh();
            ctx = resolveTaskCreateContext({
              ...hint,
              project_id: ctx.project_id,
              filter: ctx.filter,
            });
          }
          state.inlineCreate = ctx;
          if (ctx.filter === "personal" || ctx.filter === "work") {
            if (state.sectionFocus && state.sectionFocus !== ctx.filter)
              applySectionFocus(ctx.filter);
          }
          renderInlineCreateBar();
        }

        async function commitInlineCreate() {
          const ctx = state.inlineCreate;
          if (!ctx) return;
          const title = ($("#inlineTitle")?.value || "").trim();
          if (!title) {
            toast("Title required");
            $("#inlineTitle")?.focus();
            return;
          }
          const r = await api("/api/tasks", {
            method: "POST",
            body: JSON.stringify({
              title,
              project_id: ctx.project_id,
              section_id: ctx.section_id,
              filter: ctx.filter,
              kind: ctx.kind || "punctual",
              emoji: "🔲",
            }),
          });
          cancelInlineCreate();
          toast("Task added — Enter to edit details");
          await refresh();
          if (r.task?.id) setSelection("task", r.task.id, true);
        }

        function taskForm(existing) {
          if (!existing?.id) {
            beginInlineTaskCreate(existing || {});
            return;
          }
          const filt = existing.filter || state.filter || "work";
          const projs = projectsFor(filt);
          const pid = existing.project_id || projs[0]?.id || "";
          const defaultSec =
            existing.section_id ||
            sectionsFor(pid).find(
              (s) => (s.title || "").toLowerCase() === "general",
            )?.id ||
            "";
          const dueVal =
            existing.kind === "habitual"
              ? existing.next_due || existing.due_date || ""
              : existing.due_date || "";
          const isHabit = existing.kind === "habitual";
          modal(`<div class="modal"><h3>Edit task</h3>
      <label>Title</label><input id="mTitle" value="${esc(existing.title || "")}"/>
      <label>Project</label><select id="mProj">${projs.map((p) => `<option value="${esc(p.id)}" ${pid === p.id ? "selected" : ""}>${esc(p.title)}</option>`).join("")}</select>
      <label>Section</label><select id="mSection">${sectionOptionsHtml(pid, defaultSec)}</select>
      <label>Filter</label><select id="mFilt">${["work", "personal", "habits"].map((f) => `<option value="${f}" ${filt === f ? "selected" : ""}>${f}</option>`).join("")}</select>
      <label>Kind</label><select id="mKind"><option value="punctual" ${!isHabit ? "selected" : ""}>punctual</option><option value="habitual" ${isHabit ? "selected" : ""}>habitual</option></select>
      <div class="field-row" id="mRecWrap" ${isHabit ? "" : "hidden"}>
        <label>Recurrence</label><select id="mRec"><option value="">(none)</option>${RECURRENCE_ORDER.map((r) => `<option value="${r}" ${existing.recurrence === r ? "selected" : ""}>${RECURRENCE_LABELS[r]}</option>`).join("")}</select>
      </div>
      <label>Emoji <span class="sub">(optional)</span></label><input id="mEmoji" value="${esc(existing.emoji === "🔲" ? "" : existing.emoji || "")}" placeholder="Leave blank for default"/>
      <label>Due date</label><input id="mDue" value="${esc(dueVal)}" placeholder="YYYY-MM-DD"/>
      <div class="modal-actions"><button class="btn" data-m="cancel">Cancel</button><button class="btn" data-m="save-task">Save</button></div></div>`);
          const syncSections = () => {
            const sel = $("#mSection");
            const cur = sel?.value || "";
            const np = $("#mProj")?.value || "";
            if (sel) sel.innerHTML = sectionOptionsHtml(np, cur);
          };
          const syncKind = () => {
            const wrap = $("#mRecWrap");
            if (wrap) wrap.hidden = $("#mKind")?.value !== "habitual";
          };
          $("#mProj")?.addEventListener("change", syncSections);
          $("#mKind")?.addEventListener("change", syncKind);
          $("#modalHost").onclick = async (e) => {
            if (
              e.target.dataset.m === "cancel" ||
              e.target.classList.contains("modal-bg")
            )
              closeModal();
            if (e.target.dataset.m === "save-task") {
              try {
                const kind = $("#mKind").value;
                const due = ($("#mDue").value || "").trim();
                const emoji = ($("#mEmoji").value || "").trim() || "🔲";
                await api("/api/tasks", {
                  method: "POST",
                  body: JSON.stringify({
                    id: existing.id,
                    title: $("#mTitle").value,
                    project_id: $("#mProj").value,
                    section_id: $("#mSection").value,
                    filter: $("#mFilt").value,
                    kind,
                    recurrence: kind === "habitual" ? $("#mRec").value : "",
                    emoji,
                    due_date: due,
                    next_due: kind === "habitual" ? due : "",
                  }),
                });
                closeModal();
                toast("Saved");
                await refresh();
              } catch (err) {
                toast(err.message);
              }
            }
          };
        }

        async function promptAddSection(projectId) {
          const title = prompt("Section name");
          if (title == null) return;
          const name = title.trim();
          if (!name) {
            toast("Name required");
            return;
          }
          await api("/api/sections", {
            method: "POST",
            body: JSON.stringify({ project_id: projectId, title: name }),
          });
          toast("Section added");
          await refresh();
        }

        function infoForm(existing) {
          const parentType = state.taskId ? "task" : "project";
          const parentId = state.taskId || state.projectId;
          modal(`<div class="modal"><h3>${existing ? "Edit" : "Add"} info</h3>
      <label>Title</label><input id="mTitle" value="${esc(existing?.title || "")}"/>
      <label>Body</label><textarea id="mBody">${esc(existing?.body || "")}</textarea>
      <label>Section</label><input id="mSec" value="${esc(existing?.section_path || "")}"/>
      <div class="modal-actions"><button class="btn" data-m="cancel">Cancel</button><button class="btn" data-m="save-info">Save</button></div></div>`);
          $("#modalHost").onclick = async (e) => {
            if (
              e.target.dataset.m === "cancel" ||
              e.target.classList.contains("modal-bg")
            )
              closeModal();
            if (e.target.dataset.m === "save-info") {
              try {
                await api("/api/info", {
                  method: "POST",
                  body: JSON.stringify({
                    id: existing?.id || "",
                    title: $("#mTitle").value,
                    body: $("#mBody").value,
                    section_path: $("#mSec").value,
                    parent_type: parentType,
                    parent_id: parentId,
                  }),
                });
                closeModal();
                toast("Saved");
                await refresh();
              } catch (err) {
                toast(err.message);
              }
            }
          };
        }

        async function uploadImage(parentType, parentId, file) {
          const buf = await file.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let binary = "";
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + chunk),
            );
          }
          const b64 = btoa(binary);
          await api("/api/attachments", {
            method: "POST",
            body: JSON.stringify({
              parent_type: parentType,
              parent_id: parentId,
              kind: "image",
              filename: file.name || "paste.png",
              data_base64: b64,
              description: file.name || "clipboard image",
            }),
          });
          toast("Image attached");
          await refresh();
        }

        document.addEventListener("click", async (e) => {
          const thumb = e.target.closest(".thumb");
          if (thumb) {
            e.preventDefault();
            const lb = $("#lightbox");
            lb.querySelector("img").src = thumb.getAttribute("data-full") || "";
            lb.hidden = false;
            return;
          }
          if (e.target === $("#lightbox") || e.target.closest("#lightbox")) {
            if (e.target.id === "lightbox" || e.target.tagName === "DIV") {
              $("#lightbox").hidden = true;
              $("#lightbox").querySelector("img").src = "";
            }
          }
          const chip = e.target.closest(".emoji-chip");
          if (chip) {
            const em = chip.getAttribute("data-emoji") || "";
            applyEmojiFilter(state.emojiFilter === em ? "" : em);
            applySelection(true);
            return;
          }
          const habitRow = e.target.closest(".habit-row[data-id]");
          const taskRow = e.target.closest(".task[data-id]");
          const secRow = e.target.closest(".task-section[data-id]");
          const projRow = e.target.closest("details.project[data-id]");
          if (habitRow) {
            setSelection("habit", habitRow.getAttribute("data-id"), false);
          } else if (taskRow) {
            setSelection("task", taskRow.getAttribute("data-id"), false);
          } else if (secRow && e.target.closest(".task-section-label")) {
            const sid = secRow.getAttribute("data-id");
            setSelection("section", sid, false);
            if (e.detail === 2 && sid) {
              setSectionExpanded(sid, secRow.classList.contains("collapsed"));
            }
          } else if (projRow && e.target.closest("summary")) {
            setSelection("project", projRow.getAttribute("data-id"), false);
          }
          const actEl = e.target.closest("[data-act]");
          if (!actEl) return;
          const act = actEl.getAttribute("data-act");
          const row = e.target.closest("[data-id]");
          const id =
            row?.getAttribute("data-id") || actEl.getAttribute("data-id") || "";

          try {
            if (act === "goto-dash") {
              goHome();
              return;
            }
            if (act === "goto-import") {
              state.view = "import";
              state.importPreview = null;
              render();
              return;
            }
            if (act === "help") {
              helpModal();
              return;
            }
            if (act === "add-project") {
              const f = actEl.getAttribute("data-f") || "work";
              state.filter = f;
              projectForm(null);
              return;
            }
            if (act === "edit-project") {
              projectForm((state.data.projects || []).find((p) => p.id === id));
              return;
            }
            if (act === "del-project") {
              if (!confirm("Delete project and its tasks/info/attachments?"))
                return;
              await api("/api/projects/" + encodeURIComponent(id), {
                method: "DELETE",
              });
              toast("Deleted");
              await refresh();
              return;
            }
            if (act === "add-task") {
              const pid = actEl.getAttribute("data-pid") || id;
              const f = actEl.getAttribute("data-f") || state.filter || "work";
              beginInlineTaskCreate({ project_id: pid, filter: f });
              return;
            }
            if (act === "inline-save") {
              await commitInlineCreate();
              return;
            }
            if (act === "inline-cancel") {
              cancelInlineCreate();
              return;
            }
            if (act === "add-section") {
              const pid = actEl.getAttribute("data-pid") || id;
              await promptAddSection(pid);
              return;
            }
            if (act === "edit-task") {
              taskForm((state.data.tasks || []).find((t) => t.id === id));
              return;
            }
            if (act === "del-task") {
              if (!confirm("Delete task and its info/attachments?")) return;
              await api("/api/tasks/" + encodeURIComponent(id), {
                method: "DELETE",
              });
              toast("Deleted");
              await refresh();
              return;
            }
            if (act === "emoji") {
              const key = actEl.getAttribute("data-key");
              await api("/api/tasks/" + encodeURIComponent(id) + "/emoji", {
                method: "POST",
                body: JSON.stringify({ key }),
              });
              await refresh();
              return;
            }
            if (act === "habit-to-personal") {
              await sendHabitToPersonal(id);
              return;
            }
            if (act === "info-project") {
              infoListModal("project", id);
              return;
            }
            if (act === "info-task") {
              const t = (state.data.tasks || []).find((x) => x.id === id);
              if (t) state.projectId = t.project_id;
              infoListModal("task", id);
              return;
            }
            if (act === "add-info") {
              infoForm(null);
              return;
            }
            if (act === "edit-info") {
              infoForm((state.data.info_points || []).find((i) => i.id === id));
              return;
            }
            if (act === "del-info") {
              if (!confirm("Delete info?")) return;
              await api("/api/info/" + encodeURIComponent(id), {
                method: "DELETE",
              });
              toast("Deleted");
              await refresh();
              return;
            }
            if (act === "paste-att") {
              const ptype = actEl.getAttribute("data-ptype");
              const pid = actEl.getAttribute("data-pid");
              state._attTarget = { ptype, pid };
              const inp = document.createElement("input");
              inp.type = "file";
              inp.accept = "image/*";
              inp.onchange = async () => {
                if (inp.files?.[0]) await uploadImage(ptype, pid, inp.files[0]);
              };
              inp.click();
              return;
            }
            if (act === "import-select") {
              const sid = actEl.getAttribute("data-source") || "task_pack";
              state.importSource = sid;
              state.importPreview = null;
              render();
              return;
            }
            if (act === "import-preview") {
              await runImportPreview();
              return;
            }
            if (act === "import-commit") {
              await runImportCommit();
              return;
            }
            if (act === "migrate") {
              await runMigrateMd();
              return;
            }
          } catch (err) {
            toast(err.message || String(err));
          }
        });

        document.addEventListener("paste", async (e) => {
          if (!state._attTarget) return;
          const items = e.clipboardData?.items;
          if (!items) return;
          for (const it of items) {
            if (it.type.startsWith("image/")) {
              e.preventDefault();
              const file = it.getAsFile();
              const ptype =
                state._attTarget?.ptype || (state.taskId ? "info" : "project");
              const pid =
                state._attTarget?.pid || state.taskId || state.projectId;
              if (file && pid) await uploadImage(ptype, pid, file);
              return;
            }
          }
        });

        document.addEventListener("keydown", async (e) => {
          if (e.ctrlKey || e.metaKey) return;
          if (e.altKey) {
            const isS =
              e.code === "KeyS" || (e.key || "").toLowerCase() === "s";
            if (isS) {
              e.preventDefault();
              e.stopPropagation();
              focusSearch();
            }
            return;
          }
          const tag = (e.target?.tagName || "").toLowerCase();
          if (
            tag === "input" ||
            tag === "textarea" ||
            tag === "select" ||
            e.target?.isContentEditable
          ) {
            if (e.key === "Escape") {
              e.preventDefault();
              goHome();
              return;
            }
            if (
              e.key === "Backspace" &&
              e.target?.id === "inlineTitle" &&
              !(e.target.value || "")
            ) {
              e.preventDefault();
              cancelInlineCreate();
              return;
            }
            return;
          }

          if (e.key === "Escape") {
            e.preventDefault();
            goHome();
            return;
          }
          if (e.key === "Backspace") {
            e.preventDefault();
            goBack();
            return;
          }

          if (modalOpen()) return;

          if (e.key === "F1") {
            e.preventDefault();
            helpModal();
            return;
          }

          if (e.shiftKey) {
            const cmd = shiftCmdFromEvent(e);
            if (cmd === "h") {
              e.preventDefault();
              e.stopPropagation();
              helpModal();
              return;
            }
            if (state.view === "import") return;
            if (cmd) {
              e.preventDefault();
              e.stopPropagation();
              try {
                await runShiftCommand(cmd);
              } catch (err) {
                toast(err.message || String(err));
              }
            }
            return;
          }

          if (state.view === "import") {
            const ch = (e.key || "").toLowerCase();
            if (/^[1pc]$/.test(ch)) {
              e.preventDefault();
              try {
                await handleImportKey(ch);
              } catch (err) {
                toast(err.message || String(err));
              }
            }
            return;
          }

          if (e.key === "ArrowDown") {
            e.preventDefault();
            moveSelection(1);
            return;
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            moveSelection(-1);
            return;
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            hierarchyNav(1);
            return;
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            hierarchyNav(-1);
            return;
          }
          if (e.key === "Home") {
            e.preventDefault();
            const targets = collectTargets();
            if (targets.length)
              setSelection(targets[0].kind, targets[0].id, true);
            return;
          }
          if (e.key === "End") {
            e.preventDefault();
            const targets = collectTargets();
            if (targets.length)
              setSelection(
                targets[targets.length - 1].kind,
                targets[targets.length - 1].id,
                true,
              );
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            editSelection();
            return;
          }
          if (e.key === "Delete") {
            e.preventDefault();
            try {
              await deleteSelection();
            } catch (err) {
              toast(err.message || String(err));
            }
            return;
          }

          // Plain letter jump (1/2/3 reserved for category focus)
          if (/^[a-z0-9]$/i.test(e.key) && !/^[123]$/.test(e.key)) {
            e.preventDefault();
            letterJump(e.key.toLowerCase());
            return;
          }
          // Plain 1/2/3 also focus a single category (same as Shift+1/2/3)
          if (e.key === "1" || e.key === "2" || e.key === "3") {
            e.preventDefault();
            applySectionFocus(
              e.key === "1" ? "work" : e.key === "2" ? "personal" : "habits",
              { toggle: true },
            );
          }
        });

        // boot
        document.addEventListener("toggle", (e) => {
          const proj = e.target;
          if (!(proj instanceof HTMLDetailsElement)) return;
          if (!proj.classList.contains("project")) return;
          const id = proj.getAttribute("data-id");
          if (!id) return;
          if (proj.open) state.collapsedProjects.delete(id);
          else state.collapsedProjects.add(id);
        });
        const searchInp = $("#globalSearch");
        if (searchInp) {
          searchInp.value = state.search || "";
          searchInp.addEventListener("input", () => {
            applySearch(searchInp.value);
          });
        }
        if (new URLSearchParams(location.search).get("import") === "1")
          state.view = "import";
        refresh().catch((err) => {
          $("#hdrSub").textContent = err.message;
          toast(err.message);
        });
      })();
    </script>
  </body>
</html>
